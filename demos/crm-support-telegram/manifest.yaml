apiVersion: yoizen.io/v1
kind: IntegrationManifest
metadata:
  name: crm-support-telegram
spec:
  # ---------------------------------------------------------------------------
  # T02+T03 (manual-loops/demos/crm-support-telegram.md — human decision 2026-07-24:
  # T02 and T03 MERGED into one task so the `>=1 process` structural rule
  # (`checkAtLeastOneProcess`, validate-structural-rules.ts — a `kind:
  # IntegrationManifest` manifest with no agent/workflow is structurally
  # INVALID) is satisfied by this file from the first commit onward instead
  # of only after a later task). Covers: channel + HubSpot connector +
  # secrets (T02 scope) PLUS the shared LLM connector, knowledge base, skill,
  # system variables and the published support agent (T03 scope) — migrating
  # the five sequential `01-…05-*.ts` setup-script drivers to this single
  # declarative manifest, applied with `yoizen manifests apply -f
  # manifest.yaml --secrets-from-env` (same end-state pattern
  # `integrations/channels/telegram-transform-reply` already shipped). T04
  # adds the `priority-scorer` service, T05 the workflow — at that point the
  # manifest becomes the SOLE provisioning path and the setup scripts are
  # deleted (T06).
  #
  # VERIFIED LIVE STATE (2026-07-24): the dev tenant was found RESET — none of
  # the T01-audited script-provisioned artifacts existed. The first
  # `manifests apply` therefore CREATED all 7 top-level resources fresh (plus
  # the knowledge base, verified live via the inventory script though the
  # verdict table doesn't enumerate `knowledgeBases`); the second `plan` is a
  # clean noop. Every resource below is named with the slugs the T01 audit
  # derived from the (now-gone) script defaults anyway, so any FUTURE cluster
  # that still holds the old script-era artifacts (e.g. `CRM Support Telegram
  # Bot`, `crmSupportCompanyName`, `crmSupportSlaHours`) adopts by name after
  # a one-time rename to these slugs — see
  # `/private/tmp/.../scratchpad/rename-live-artifacts.ts` (idempotent,
  # already a no-op on this tenant since nothing needed renaming).
  # ---------------------------------------------------------------------------
  channels:
    # Telegram channel account, slug `crm-support-telegram-bot` — created
    # fresh by the first apply (VERIFIED LIVE STATE above); a future cluster
    # still holding the old `CRM Support Telegram Bot` display name adopts
    # after the one-time rename documented there. Bot token is the only
    # secret; bound below and resolved at apply time from the same-named env
    # var via `--secrets-from-env` (never stored in the repo). Same shape as
    # `telegram-transform-reply/manifest.yaml`: channels-writer's `update()`
    # only patches `name`, never touches `accessToken`, so reapply is
    # NOOP-safe on the token.
    - name: crm-support-telegram-bot
      type: telegram
      direction: inbound
      secretRef: telegram-bot-token
  connectors:
    # `demo-hubspot` connector — HubSpot CRM REST API (contacts/deals/tickets),
    # bearer auth from the HubSpot Service Key (or legacy private-app token,
    # an interchangeable Bearer-token fallback — SPEC user decision 5).
    # `config.baseUrl`/`config.context` are the only `config` keys the
    # connectors-writer reads (see `http-connectors/manifest.yaml` header
    # comment); `timeoutMs`/`maxRetries`/`retryBackoffMs`/`healthCheckPath`
    # from the deleted script are NOT expressible via `connectorSchema`
    # (no matching field) and are silently ignored by the writer if placed
    # under `config`, so they are intentionally omitted here rather than
    # cargo-culted in.
    - name: demo-hubspot
      type: http
      config:
        baseUrl: https://api.hubapi.com
        context: external
      auth:
        authType: bearer
        bearerToken:
          secretRef: hubspot-service-key
      tags:
        - demo
        - crm-support-telegram
        - hubspot
      endpoints:
        # Uncached (original-loop decision, `02-hubspot-connector.ts`
        # `ENDPOINTS`): search results must always reflect the latest
        # contact state.
        - label: Search contacts (filtered)
          method: POST
          path: /crm/v3/objects/contacts/search
        # Uncached: write endpoint.
        - label: Create contact
          method: POST
          path: /crm/v3/objects/contacts
        # POST batch/read association routes — HubSpot's documented way to
        # list associations for a contact without a path-templated id (see
        # the deleted script's header comment on the connector-runtime's
        # verbatim-path endpoint resolution). 60s TTL, keyed on the request
        # body (the contact id), not query params — same `readCacheStrategy`
        # the script applied to both association endpoints.
        - label: List deals associated with contact(s) (batch read)
          method: POST
          path: /crm/v3/associations/contacts/deals/batch/read
          cache:
            enabled: true
            ttlSeconds: 60
            methods: [POST]
            keyHeaders: []
            keyQueryParams: []
            keyBody: true
        - label: List tickets associated with contact(s) (batch read)
          method: POST
          path: /crm/v3/associations/contacts/tickets/batch/read
          cache:
            enabled: true
            ttlSeconds: 60
            methods: [POST]
            keyHeaders: []
            keyQueryParams: []
            keyBody: true
        # Uncached: write endpoint.
        - label: Create ticket
          method: POST
          path: /crm/v3/objects/tickets

    # ---------------------------------------------------------------------
    # LLM connector — the SHARED `sample-<provider>-llm` naming convention
    # every `ai` sample reuses (T01 disposition: DECLARE, not "assume
    # present" — byte-identical to `ai-skill-support-agent/manifest.yaml`
    # and `ai-knowledge-base-agent/manifest.yaml`'s `sample-openai-llm`
    # entries so re-applying ANY sibling sample never produces an
    # update-loop on this connector: `connectorComparable` only diffs
    # `endpoints`/`tags`, never `auth`'s secretRef name, so this manifest's
    # own — differently NAMED — secret binding is safe). Reused for BOTH the
    # agent's `model_config.llm.connectorId` AND the knowledge base's
    # `ingestion_config.provider_connector_id` below, exactly like the
    # deleted `03-ai-agent.ts` reused the same `connectorId` for both.
    # ---------------------------------------------------------------------
    - name: sample-openai-llm
      type: llm
      config:
        baseUrl: https://api.openai.com/v1
        context: external
      auth:
        authType: bearer
        bearerToken:
          secretRef: crm-support-telegram-openai-api-key
      # Required by agent-admin's credential resolver for any LLM adapter an
      # agent's `model_config.llm.connectorId` points at — the deleted
      # script always sent `tags: ["llm"]` on this connector.
      tags:
        - llm

  # ---------------------------------------------------------------------------
  # Catalog skill — `order-status-phrasing-guide` (T01 name inventory), placed
  # BEFORE `agents` (`RESOURCE_KIND_ORDER`, manifest.schema.ts) so the agent's
  # `catalog_skill_id: { skillRef: ... }` below resolves within the same
  # apply. Every field mirrors the deleted `03-ai-agent.ts`'s
  # `buildSkillPayload()` verbatim, including the single `files[]` entry
  # (`type: reference`) — `skillSchema.files[].content` is inline-string-only
  # (`ai-skill-support-agent/manifest.yaml` precedent, same schema).
  # ---------------------------------------------------------------------------
  skills:
    - name: order-status-phrasing-guide
      description: Phrasing guide for communicating order status clearly and empathetically.
      system_prompt: "You are the order-status phrasing expert. When a customer asks about an order, follow this order: (1) state the concrete current status; (2) then any estimated date; (3) never invent tracking numbers or dates that were not supplied in the conversation's context; (4) if the order is delayed, apologize before explaining next steps; (5) if no order context is present, ask for the order number rather than guessing."
      icon: local_shipping
      color: "#42a5f5"
      trigger_commands:
        - order status
        - where is my order
        - track order
      when_to_use: Use when the customer asks about the status, location, or delivery estimate of an order.
      priority: 10
      allowed_tools: []
      mode: llm_driven
      files:
        - name: order-status-phrasing.md
          path: reference/order-status-phrasing.md
          type: reference
          content: |
            # Order-status phrasing guide

            - Never say "I don't know" about an order — say "let me check the latest
              status for you" and use the enriched CRM context if it is present in the
              conversation.
            - Lead with the concrete state (e.g. "shipped", "processing", "delivered"),
              THEN the estimated date, in that order.
            - If no order/context information is available in this conversation, ask the
              customer for their order number instead of guessing.
            - Never invent a tracking number or delivery date — only report what was
              supplied in context; otherwise say the information is being retrieved and
              offer a specific next step (e.g. "I'll confirm and follow up within the
              SLA window").
            - For delayed orders, acknowledge the delay explicitly before explaining next
              steps — do not bury the apology.

  # ---------------------------------------------------------------------------
  # Knowledge base — `crm-support-faq-kb` (T01 name inventory), same
  # `ingestion_config`/inline-document pattern as `ai-knowledge-base-agent`
  # and `ai-skill-support-agent`: `provider_connector_id` is a `{ connectorRef
  # }` symbolic ref resolved by `substitute-kb-ingestion-config.ts` before the
  # KB reconciler CREATES this (non-external) knowledge base;
  # `chunk_size`/`chunk_overlap`/`embedding_model`/`chunking_strategy` mirror
  # the deleted `03-ai-agent.ts`'s `ingestionConfig` verbatim.
  #
  # DOCUMENT NAME: `knowledgeBaseSchema.documents[].name` is a `nameSchema`
  # slug (lowercase alphanumeric + hyphens, no dots), so the deleted script's
  # `product-faq.md` filename (`KB_DOC_NAME`) becomes the slug `product-faq`
  # here — documented limitation, not a silent drop (same precedent as
  # `ai-knowledge-base-agent/manifest.yaml`'s `support-faq.md` -> `support-faq`
  # — `uploadTextDocument` hardcodes `mime_type`/`content_type` for inline
  # sources regardless of filename extension, so ingestion is unaffected).
  # `KB_DESCRIPTION`/`project`/`category`/`icon` from the deleted script have
  # NO field in `knowledgeBaseSchema` (only `name`/`documents`/
  # `ingestion_config`/`external`) — dropped here, not silently lost:
  # agent-admin-service applies its own server-side defaults on create, same
  # documented limitation as both sibling `ai-*` samples.
  # ---------------------------------------------------------------------------
  knowledgeBases:
    - name: crm-support-faq-kb
      documents:
        - name: product-faq
          source:
            type: inline
            content: |
              # Product FAQ

              ## What is your return policy?
              Unopened items can be returned within 30 days of delivery for a full refund.
              Opened items are eligible for a refund within 14 days, minus a 10% restocking
              fee, unless the item arrived defective.

              ## How long does shipping take?
              Standard shipping takes 3-5 business days. Expedited shipping takes 1-2
              business days. International orders take 7-14 business days depending on
              customs processing.

              ## How do I track my order?
              Every order confirmation email includes a tracking link. You can also check
              order status by messaging support with your order number.

              ## Do you offer a warranty?
              All devices carry a 1-year manufacturer warranty covering defects in
              materials and workmanship. Accidental damage and normal wear are not
              covered.

              ## Can I change or cancel my order after placing it?
              Orders can be changed or cancelled within 1 hour of placement, before they
              enter fulfillment. After that window, the order ships as placed and must go
              through the standard return process instead.

              ## What payment methods do you accept?
              We accept all major credit cards, PayPal, and Apple Pay. Payment is
              authorized at checkout and captured when the order ships.

              ## What if my item arrives damaged?
              Contact support with your order number and a photo of the damage within 48
              hours of delivery. We will ship a free replacement or issue a full refund,
              your choice — no return of the damaged item is required.
      ingestion_config:
        chunk_size: 800
        chunk_overlap: 120
        embedding_model: text-embedding-3-small
        chunking_strategy: recursive
        provider_connector_id:
          connectorRef: sample-openai-llm

  # ---------------------------------------------------------------------------
  # System variables — created fresh by the first apply, slugs
  # `crm-support-company-name`/`crm-support-sla-hours` (VERIFIED LIVE STATE,
  # header comment above). `nameSchema` requires a slug and rejects the
  # deleted script's camelCase `crmSupportCompanyName`/`crmSupportSlaHours`
  # outright, so a future cluster still holding those old-era names needs the
  # same one-time rename documented above before it can adopt. The agent's
  # `system_prompt` below references these SAME slugs via
  # `{{variables.system.<name>}}` (agent-ai-service's runtime template
  # renderer resolves by the live variable's exact name), so the two must
  # stay in lockstep with whatever name these variables carry live.
  # `systemVariableSchema` (`name`/`type`/`value`/`label`/`description`)
  # matches `CreateSystemVariableInput` exactly — same values the script's
  # `CRM_COMPANY_NAME`/`CRM_SLA_HOURS` defaults set.
  # ---------------------------------------------------------------------------
  systemVariables:
    - name: crm-support-company-name
      type: string
      value: Acme Support Co
      label: Support company name
      description: Brand name the support agent uses to introduce itself (demos/crm-support-telegram)
    - name: crm-support-sla-hours
      type: string
      value: "24"
      label: Support SLA (hours)
      description: SLA in hours the support agent cites for follow-ups/escalations (demos/crm-support-telegram)

  # ---------------------------------------------------------------------------
  # Support agent — `crm-support-agent` (T01 name inventory), PUBLISHED
  # end-state. `agentSchema.profile` is a free-form passthrough record
  # (`z.record(z.string(), z.unknown())`, manifest.schema.ts:478) — fully
  # permissive, so the deleted `03-ai-agent.ts`'s `buildAgentBody()` shape
  # (`model_config.llm`/`.rules`/`.soul`/`.subagents`, `tools`, `channels`) is
  # expressible verbatim. `knowledgeBaseRefs` (not raw `knowledge_base_ids`)
  # is how the manifest carries the KB-at-CREATE workaround the script
  # hand-rolls (original-loop finding: gateway `UpdateAgentDto` drops
  # `knowledge_base_ids` on PATCH) — `agents-writer.ts`'s
  # `reconcileKnowledgeBases` resolves this ref and wires it at CREATE time,
  # so that gap does not resurface here.
  #
  # SUBAGENT SNAPSHOT (same contract as `ai-skill-support-agent/manifest.yaml`):
  # `profile.model_config.subagents[]` carries the `skillRef` symbolic ref
  # (`catalog_skill_id`) PLUS the full skill-field snapshot the deleted
  # script's `buildAgentBody()` embedded verbatim (name/description/
  # system_prompt/enabled/trigger_commands/when_to_use/priority/mode) —
  # required because agent-ai-service reads these fields from the subagent
  # ENTRY ITSELF at chat time, never re-fetching the catalog skill by id.
  # MIGRATION NOTE: because this is a snapshot, not a live reference, a
  # future edit to the `skills[]` entry above must also update this
  # snapshot's matching fields to stay consistent — both are declared from
  # the same source values here so a normal edit + re-apply keeps them in
  # sync automatically.
  #
  # TOOLS: `loadSkill` (reaches the order-status-phrasing-guide subagent
  # skill at runtime) + `memory` (per-user memory, keyed by `state.userId` —
  # the deleted script's ONLY memory mechanism: a builtin tool entry, no
  # separate per-agent memory flag). The workflow's `agentCall` (T05) supplies
  # a stable per-customer `userId` (`{{request.from}}`).
  # ---------------------------------------------------------------------------
  agents:
    - name: crm-support-agent
      profile:
        description: Support agent leading the crm-support-telegram demo's customer conversations, backed by a product FAQ knowledge base, an order-status phrasing skill and per-user memory
        system_prompt: |
          You are the lead support agent for {{variables.system.crm-support-company-name}}, driving a live Telegram support conversation end to end — you are NOT a passive intent router waiting to be told what to do.

          Every inbound customer message you receive is prefixed with a CONTEXT block assembled by the support workflow, shaped like:
            Context: { "contact": { ...HubSpot contact fields... }, "priority": { "score": <number>, "tier": "standard"|"vip", "reasons": [<string>, ...] } }
          Followed by the customer's own message text. Use that context to personalize your reply (name, known history, priority reasons) — never quote the raw JSON back to the customer, and never invent contact or priority details that were not supplied.

          Tone:
          - Default: professional, warm, concise.
          - When priority.tier == "vip": shift to a more formal, escalation-aware tone — acknowledge the urgency implied by the priority reasons, avoid casual language, and proactively offer a fast path to a human agent if the issue is not fully resolved in this reply.

          Cite the current SLA of {{variables.system.crm-support-sla-hours}} hours only when relevant (delays, escalations, or when explicitly asked "how long will this take").

          Lead the conversation: ask clarifying questions when the request is ambiguous, use the attached knowledge base for product/policy facts, and use the order-status-phrasing-guide skill whenever the customer asks about an order's status. You have access to per-user memory — use it to recall facts this same customer told you in earlier turns (their preferences, open issues already discussed), and store new durable facts worth remembering across conversations.
        model_config:
          llm:
            provider: openai
            model: gpt-4o-mini
            connectorId:
              connectorRef: sample-openai-llm
            temperature: 0.3
            maxTokens: 500
          rules: Prefer knowledge-base facts over general knowledge; if the answer is not covered, say so plainly. Never promise dates/tracking numbers not present in the supplied context. Escalate VIP-tier customers proactively when an issue cannot be resolved immediately.
          soul: Warm, professional, proactive — leads the conversation instead of waiting to be asked.
          subagents:
            - name: order-status-phrasing-guide
              description: Phrasing guide for communicating order status clearly and empathetically.
              system_prompt: "You are the order-status phrasing expert. When a customer asks about an order, follow this order: (1) state the concrete current status; (2) then any estimated date; (3) never invent tracking numbers or dates that were not supplied in the conversation's context; (4) if the order is delayed, apologize before explaining next steps; (5) if no order context is present, ask for the order number rather than guessing."
              enabled: true
              catalog_skill_id:
                skillRef: order-status-phrasing-guide
              trigger_commands:
                - order status
                - where is my order
                - track order
              when_to_use: Use when the customer asks about the status, location, or delivery estimate of an order.
              priority: 10
              mode: llm_driven
        tools:
          - name: loadSkill
            description: Built-in tool enabled so the order-status-phrasing-guide subagent skill is reachable at runtime.
            source_type: builtin
            builtin: true
          - name: memory
            description: "Built-in tool enabled for per-user memory: read/store/search facts about the current customer (state.userId) across conversations."
            source_type: builtin
            builtin: true
        channels: []
      knowledgeBaseRefs:
        - crm-support-faq-kb

  # ---------------------------------------------------------------------------
  # `priority-scorer` hosted service (T04, manual-loops/demos/crm-support-telegram.md
  # — updated by `manual-loops/provisioning-manifest-gaps-4.md`'s outcome:
  # `services[].env[].value` now carries literal | `{secretRef}` |
  # `{connectorRef}` | `{connectorRef, endpointMethod, endpointPath}`, so the
  # T01 audit's option (a) — deferring 6 of the 9 env vars to a post-apply
  # `bootstrap.sh` reconcile — FELL AWAY. All 9 env vars the deleted
  # `04-priority-scorer.ts` set are expressed here, declaratively, in one
  # apply). `image`/scaling fields mirror the deleted script's
  # `IMAGE_REF`/`SERVICE_PORT`/`MIN_SCALE`/`MAX_SCALE`/`CONCURRENCY_TARGET`
  # constants verbatim; `port` is sent (Knative's *container* port, required
  # by `serviceSchema`) — PORT the env var is never set (Knative-reserved,
  # per every sibling `services:` entry's convention, e.g.
  # `hosted-services-api/manifest.yaml`).
  #
  # ENV FIDELITY vs the deleted script's Stage 5 `envVars` object (9 entries):
  #   - YOIZEN_TENANT, YOIZEN_BASE_URL, SELF_INTERNAL_BASE_URL: the 3
  #     DETERMINISTIC literals (T01 disposition) — precomputed here exactly as
  #     the script's Stage 4 derived them (`registry-service`'s own
  #     `knativeServiceName`/`tenantKubernetesNamespaceName` helpers,
  #     `services.service.ts:57-62`, verified live 2026-07-14 per the
  #     script's own header comment): `knativeName =
  #     "${SERVICE_NAME}-${tenant}"` = `priority-scorer-acme`, `namespace =
  #     "${tenant}-${env}-ns"` = `acme-dev-ns`, tenant `acme` / env `dev` per
  #     this cluster's dev-seed default (`lib/resolve-demo-env.sh`).
  #     YOIZEN_BASE_URL is the INTERNAL gateway URL (the script's
  #     `internalGatewayBaseUrl`, NOT the public `YOIZEN_BASE_URL` the CLI
  #     itself logs in with) — same literal both would resolve to on this
  #     cluster, kept as an explicit value here (no ref mechanism needed for
  #     a value that isn't a manifest-created resource's id).
  #   - YOIZEN_EMAIL / YOIZEN_PASSWORD: `{ secretRef }` — the scorer's own
  #     platform login credentials (used by its `connectors.invoke()` calls
  #     at runtime), resolved k8s-natively via `valueFrom.secretKeyRef` from
  #     the `psec-service-priority-scorer` k8s Secret (gaps-4 T04, Option B —
  #     never baked into the Knative spec as plaintext). New bindings below,
  #     scope `kind: service, owner: priority-scorer`.
  #   - HUBSPOT_CONNECTOR_ID: `{ connectorRef: demo-hubspot }` — resolves to
  #     the SAME apply's `demo-hubspot` connector id (gaps-4 T02).
  #   - HUBSPOT_DEALS_ENDPOINT_ID / HUBSPOT_TICKETS_ENDPOINT_ID /
  #     HUBSPOT_CREATE_TICKET_ENDPOINT_ID: `{ connectorRef: demo-hubspot,
  #     endpointMethod, endpointPath }` (gaps-4 T03) — method/path pairs
  #     copied VERBATIM from the `demo-hubspot` connector's own `endpoints:`
  #     above (`List deals associated with contact(s)`, `List tickets
  #     associated with contact(s)`, `Create ticket`), matching the deleted
  #     script's `HUBSPOT_DEALS_ENDPOINT`/`HUBSPOT_TICKETS_ENDPOINT`/
  #     `HUBSPOT_CREATE_TICKET_ENDPOINT` constants exactly.
  # ---------------------------------------------------------------------------
  services:
    - name: priority-scorer
      image: dev.local/priority-scorer:local
      port: 8080
      minScale: 0
      maxScale: 2
      concurrencyTarget: 10
      env:
        - name: YOIZEN_TENANT
          value: acme
        - name: YOIZEN_BASE_URL
          value: http://api-gateway.platform-services-dev.svc.cluster.local
        - name: SELF_INTERNAL_BASE_URL
          value: http://priority-scorer-acme.acme-dev-ns.svc.cluster.local
        - name: YOIZEN_EMAIL
          value:
            secretRef: priority-scorer-yoizen-email
        - name: YOIZEN_PASSWORD
          value:
            secretRef: priority-scorer-yoizen-password
        - name: HUBSPOT_CONNECTOR_ID
          value:
            connectorRef: demo-hubspot
        - name: HUBSPOT_DEALS_ENDPOINT_ID
          value:
            connectorRef: demo-hubspot
            endpointMethod: POST
            endpointPath: /crm/v3/associations/contacts/deals/batch/read
        - name: HUBSPOT_TICKETS_ENDPOINT_ID
          value:
            connectorRef: demo-hubspot
            endpointMethod: POST
            endpointPath: /crm/v3/associations/contacts/tickets/batch/read
        - name: HUBSPOT_CREATE_TICKET_ENDPOINT_ID
          value:
            connectorRef: demo-hubspot
            endpointMethod: POST
            endpointPath: /crm/v3/objects/tickets

  # ---------------------------------------------------------------------------
  # Workflow — `crm-support-telegram` (T01 name inventory: `application:
  # crm-support`), the low-code orchestration graph, translated faithfully
  # from the still-present `src/05-workflow.ts`. This completes the manifest:
  # every resource the demo needs is now declared in ONE file.
  #
  # SUBSTITUTION SUMMARY — re-verified against the CURRENT
  # `substitution-allowlist.ts`/`array-substitution-allowlist.ts` before
  # writing this (gaps-4 only added `services[].env[]` ref-resolution
  # behavior, per the coordinator's note — it did NOT add any new workflow
  # action-argument allowlist entries; the five entries below are BYTE
  # IDENTICAL to the T01 audit's findings):
  #   - `trigger.config.accountIds` — ARRAY_SUBSTITUTION_ALLOWLIST's ONE entry
  #     (`accountIds` -> `channelRef`, array-substitution-allowlist.ts:53-63).
  #     Account-scoped ON PURPOSE (never a shared/unscoped trigger — an empty
  #     `accountIds` means "listen on any account" per the deleted script's
  #     own comment) — mirrors `telegram-transform-reply/manifest.yaml`'s
  #     trigger block exactly, pinned to THIS manifest's own
  #     `crm-support-telegram-bot` channel.
  #   - `searchContact.args.adapterId` — SUBSTITUTION_ALLOWLIST's `adapterId`
  #     -> `connectorRef` entry (substitution-allowlist.ts:43-49). RE-VERIFIED:
  #     `endpointId` is still NOT an allowlisted key (absent from
  #     `substitution-allowlist.ts` entirely) — same T01 finding, unchanged by
  #     gaps-4. So the search-contact endpoint is addressed the ONLY way
  #     `EndpointCallArgs` allows a manifest to express it: `adapterId` (the
  #     connector, substituted) + `url` as a RELATIVE PATH the connector-
  #     runtime joins with the adapter's own `baseUrl`
  #     (`workflow.interfaces.ts` `EndpointCallArgs` docstring) — a deliberate
  #     deviation from the script's literal `endpointId` wiring, not an
  #     approximation (same reasoning `http-fanout-telegram/manifest.yaml`'s
  #     endpointCall actions already establish as this schema's precedent).
  #   - `scoreContact.args.serviceId` / `createTicket.args.serviceId` —
  #     SUBSTITUTION_ALLOWLIST's `serviceId` -> `serviceRef` entry
  #     (substitution-allowlist.ts:57-63). `serviceSlug` is sent alongside as
  #     a PLAIN literal (not substituted — `ServiceCallArgs.serviceSlug` is an
  #     optional perf pre-population field, `workflow.interfaces.ts:125-137`),
  #     matching the deleted script's `serviceSlug: SCORER_SERVICE_NAME`.
  #   - `supportAgent.args.agentId` — SUBSTITUTION_ALLOWLIST's `agentId` ->
  #     `agentRef` entry (substitution-allowlist.ts:50-56).
  #   - `replyEscalated.args.accountId` / `replyStandard.args.accountId` —
  #     SUBSTITUTION_ALLOWLIST's `accountId` -> `channelRef` entry
  #     (substitution-allowlist.ts:36-42), same entry the trigger's ARRAY
  #     form mirrors (scalar sibling).
  #
  # EVERYTHING ELSE is a RUNTIME template, resolved by workflow-service at
  # EXECUTION time (never manifest-time substituted) — preserved VERBATIM
  # from the deleted script, including the two idempotency-key arguments the
  # SPEC flags as a known trap: `{{workflow.tenant}}` (the ONLY tenant path on
  # `WorkflowExecutionContext.workflow`, which is `{ name, tenant,
  # application }` — `packages/shared/src/workflow.interfaces.ts:30` — there
  # is NO `workflow.tenantId`) and `{{executionId}}` (a context-ROOT field set
  # per run from `workflow_executions.id`, NOT `workflow.startTime`, which
  # does not exist either). Using the wrong pair silently resolves to `""`
  # and collapses `createTicket`'s idempotencyKey — this manifest uses the
  # CORRECT pair, copied verbatim from `05-workflow.ts`'s own comment warning
  # about this exact trap. `{{request.from}}`/`{{request.text}}` (trigger
  # payload) and `{{results.<action>.<field>}}` (prior action's output) are
  # likewise verbatim runtime templates, never substituted.
  #
  # jsFunction bodies (`normalizeContact`/`buildAgentContext`/
  # `buildEscalationReply`) are embedded VERBATIM from the deleted script's
  # `NORMALIZE_CONTACT_CODE`/`BUILD_AGENT_CONTEXT_CODE`/
  # `BUILD_ESCALATION_REPLY_CODE` constants — byte-identical logic, including
  # the emoji/unicode escapes in the escalation notice (the TS source encodes
  # these as backtick-literal `\\uXXXX`/`\\n` escapes, which the OUTER TS
  # parser already resolves to single-backslash `\uXXXX`/`\n` sequences in the
  # resulting runtime string — reproduced here as literal single-backslash
  # text inside a YAML `|` block, exactly the string value `args.code` needs
  # so the WORKFLOW ENGINE's own JS parser applies that escape a second time
  # at execution).
  # ---------------------------------------------------------------------------
  workflows:
    - name: crm-support-telegram
      definition:
        application: crm-support
        actions:
          - name: searchContact
            activity: endpointCall
            args:
              method: POST
              url: /crm/v3/objects/contacts/search
              adapterId:
                connectorRef: demo-hubspot
              data:
                filterGroups:
                  - filters:
                      - propertyName: telegram_user_id
                        operator: EQ
                        value: "{{request.from}}"
                limit: 1
          - name: normalizeContact
            activity: jsFunction
            args:
              code: |
                (ctx) => {
                  var req = ctx.request || {};
                  var search = ctx.results.searchContact || {};
                  var hits = (search.data && search.data.results) || [];
                  var first = hits[0];
                  if (first && first.id) {
                    var props = first.properties || {};
                    return {
                      contactKnown: true,
                      contactId: first.id,
                      contactName: ((props.firstname || "") + " " + (props.lastname || "")).trim(),
                      contactEmail: props.email || ""
                    };
                  }
                  return {
                    contactKnown: false,
                    contactId: req.from || "unknown",
                    contactName: "",
                    contactEmail: ""
                  };
                }
          - name: scoreContact
            activity: serviceCall
            args:
              serviceId:
                serviceRef: priority-scorer
              serviceSlug: priority-scorer
              method: POST
              path: /score
              data:
                contactId: "{{results.normalizeContact.contactId}}"
          - name: buildAgentContext
            activity: jsFunction
            args:
              code: |
                (ctx) => {
                  var req = ctx.request || {};
                  var contact = ctx.results.normalizeContact || {};
                  var scoreResult = (ctx.results.scoreContact && ctx.results.scoreContact.data) || {};
                  var tier = scoreResult.tier || "standard";
                  var score = typeof scoreResult.score === "number" ? scoreResult.score : 0;
                  var reasons = scoreResult.reasons || [];
                  var lines = [];
                  lines.push("[CRM CONTEXT]");
                  lines.push("contact_known: " + (contact.contactKnown ? "yes" : "no"));
                  if (contact.contactKnown) {
                    lines.push("contact_name: " + contact.contactName);
                    lines.push("contact_email: " + contact.contactEmail);
                  }
                  lines.push("priority_tier: " + tier);
                  lines.push("priority_score: " + score);
                  lines.push("priority_reasons: " + reasons.join(", "));
                  lines.push("[/CRM CONTEXT]");
                  var message = lines.join("\n") + "\n\n" + (req.text || "");
                  return { message: message, tier: tier, score: score, reasons: reasons };
                }
          - name: supportAgent
            activity: agentCall
            args:
              agentId:
                agentRef: crm-support-agent
              message: "{{results.buildAgentContext.message}}"
              # Real per-user scoping (05-workflow.ts's own "IMPORTANT
              # deviation from the ai-call-center-supervisor reference" note)
              # — NOT hardcoded, so memory/skills stay scoped per real
              # Telegram user.
              conversationId: "{{request.from}}"
              userId: "{{request.from}}"
              channel: telegram
          - name: vipRoute
            activity: conditional
            branches:
              - label: VIP escalation
                condition:
                  variable: results.buildAgentContext.tier
                  comparator: eq
                  value: "vip"
                actions:
                  - name: buildEscalationReply
                    activity: jsFunction
                    args:
                      code: |
                        (ctx) => {
                          var agent = ctx.results.supportAgent || {};
                          var reply = (agent.data && agent.data.reply) || "";
                          var text = "\u26A0\uFE0F VIP escalation \u2014 a specialist will follow up shortly.\n\n" + reply;
                          return { text: text };
                        }
                  - name: createTicket
                    activity: serviceCall
                    args:
                      serviceId:
                        serviceRef: priority-scorer
                      serviceSlug: priority-scorer
                      method: POST
                      path: /tickets
                      data:
                        # `{{workflow.tenant}}` — the ONLY tenant path in the
                        # execution context; there is NO `workflow.tenantId`
                        # (see the header comment's "known trap" note above).
                        tenant: "{{workflow.tenant}}"
                        conversationId: "{{request.from}}"
                        # `{{executionId}}` — a context-ROOT field, unique per
                        # workflow execution (one execution == one
                        # conversational turn), giving create-ticket's
                        # idempotencyKey a distinct per-turn value with no
                        # separate counter. NOT `{{workflow.startTime}}`
                        # (does not exist — the SPEC's known trap).
                        turn: "{{executionId}}"
                        ticket:
                          properties:
                            subject: VIP escalation via Telegram support bot
                            content: "{{request.text}}"
                            hs_ticket_priority: HIGH
                            # Required by HubSpot's tickets API — creation
                            # fails with VALIDATION_ERROR without a stage.
                            # "0"/"1" = default Support Pipeline, stage "New".
                            hs_pipeline: "0"
                            hs_pipeline_stage: "1"
                  - name: replyEscalated
                    activity: channelSend
                    args:
                      accountId:
                        channelRef: crm-support-telegram-bot
                      channel: telegram
                      provider: telegram
                      to: "{{request.from}}"
                      type: text
                      text: "{{results.buildEscalationReply.text}}"
            default:
              - name: replyStandard
                activity: channelSend
                args:
                  accountId:
                    channelRef: crm-support-telegram-bot
                  channel: telegram
                  provider: telegram
                  to: "{{request.from}}"
                  type: text
                  text: "{{results.supportAgent.data.reply}}"
        trigger:
          type: message_received
          # Preserved verbatim from 05-workflow.ts's own `mode: "exclusive"`
          # (NOT "shared" — deliberately distinct from some sibling manifests'
          # triggers, e.g. ai-call-center-supervisor's, per the deleted
          # script's own configuration).
          mode: exclusive
          config:
            channels:
              - telegram
            providers:
              - telegram
            # Account-scoped ON PURPOSE — see the SUBSTITUTION SUMMARY above.
            accountIds:
              - channelRef: crm-support-telegram-bot

  # Bound to each resource's owner so the broker binding-match check passes
  # (scope kind/owner must match the referencing resource — channel/connector/
  # service respectively). The binding NAME is the env var `--secrets-from-env`
  # reads the VALUE from at apply time (no naming transform — same convention
  # as `telegram-transform-reply/manifest.yaml` and
  # `http-connectors/manifest.yaml`): `telegram-bot-token` <-
  # $telegram-bot-token, `hubspot-service-key` <- $hubspot-service-key,
  # `crm-support-telegram-openai-api-key` <-
  # $crm-support-telegram-openai-api-key (maps to OPENAI_API_KEY — see
  # README.md once written, T06/T07), `priority-scorer-yoizen-email`/
  # `priority-scorer-yoizen-password` <- $priority-scorer-yoizen-email/
  # $priority-scorer-yoizen-password (the scorer's own platform login,
  # scope `kind: service, owner: priority-scorer` — resolved k8s-natively per
  # gaps-4 T04, never a plaintext literal in this file). Per the yoizen CLI's
  # env-var mapping (secret binding names are slug-cased; invoke with `env
  # 'name=value' bunx yoizen ...` when the shell can't hold a hyphenated bare
  # env var name).
  secrets:
    - name: telegram-bot-token
      scope:
        kind: channel
        owner: crm-support-telegram-bot
    - name: hubspot-service-key
      scope:
        kind: connector
        owner: demo-hubspot
    - name: crm-support-telegram-openai-api-key
      scope:
        kind: connector
        owner: sample-openai-llm
    - name: priority-scorer-yoizen-email
      scope:
        kind: service
        owner: priority-scorer
    - name: priority-scorer-yoizen-password
      scope:
        kind: service
        owner: priority-scorer
