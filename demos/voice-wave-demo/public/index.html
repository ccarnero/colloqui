<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Wave Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Voice Wave Demo</h1>
        <p class="sub">Local Supertonic TTS · waveform visualisation via Web Audio API</p>
      </header>

      <section class="card">
        <label class="field">
          <span class="label">Text</span>
          <textarea
            id="text"
            rows="4"
            placeholder="Type at least 10 characters..."
          >This morning, I took a walk in the park, and the sound of the birds was so pleasant that I stopped just to listen.</textarea>
        </label>

        <div class="grid">
          <label class="field">
            <span class="label">Voice</span>
            <select id="voice">
              <option value="M1">Alex (M1)</option>
              <option value="M2">James (M2)</option>
              <option value="M3" selected>Robert (M3)</option>
              <option value="M4">Sam (M4)</option>
              <option value="M5">Daniel (M5)</option>
              <option value="F1">Sarah (F1)</option>
              <option value="F2">Lily (F2)</option>
              <option value="F3">Jessica (F3)</option>
              <option value="F4">Olivia (F4)</option>
              <option value="F5">Emily (F5)</option>
            </select>
          </label>

          <label class="field">
            <span class="label">Language</span>
            <select id="language">
              <option value="en" selected>English</option>
              <option value="ko">Korean</option>
              <option value="ja">Japanese</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="zh">Chinese</option>
            </select>
          </label>

          <label class="field">
            <span class="label">
              Total steps <output id="totalStepsValue">8</output>
            </span>
            <input
              id="totalSteps"
              type="range"
              min="2"
              max="16"
              step="1"
              value="8"
            />
          </label>

          <label class="field">
            <span class="label">
              Speed <output id="speedValue">1.0x</output>
            </span>
            <input
              id="speed"
              type="range"
              min="0.8"
              max="1.3"
              step="0.05"
              value="1.0"
            />
          </label>
        </div>

        <div class="actions">
          <button id="generate" type="button">Generate</button>
          <label class="mute">
            <input id="mute" type="checkbox" />
            <span>Mute audio (visual only)</span>
          </label>
          <span id="status" class="status"></span>
        </div>
      </section>

      <section class="card">
        <canvas id="wave" width="800" height="160"></canvas>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
