apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-namespace-manager
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/part-of: yoizen-arch
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  # `update`/`patch` are required by `MongoProvisioner.replaceConfigMap`,
  # `replaceStatefulSet`, and the secret reconcile path so redeploys of
  # tenant-service converge existing per-tenant resources on the new
  # template (see services/tenant-service/src/providers/mongo.provider.ts).
  # Without these verbs the second-run flow 403s on
  # `configmaps "mongo-config" is forbidden`.
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "list", "update", "patch", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-service-manager
  labels:
    app.kubernetes.io/name: registry-service
    app.kubernetes.io/part-of: yoizen-arch
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions"]
    verbs: ["create", "get", "list", "update", "patch", "delete", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
# manual-loops/declarative-provisioning.md T05 — grants provisioning-service
# read/write on Secrets across tenant namespaces (`<tenant>-<env>-ns`) for
# the write-only Secret API (`PUT /secrets/:name`) and the secrets broker's
# `readResourceSecret` reads. Cluster-scoped (not namespace-scoped) because
# provisioning-service must reach EVERY tenant namespace, not just one — the
# SAME shape registry-service already uses to create Knative services across
# tenant namespaces above. Per-resource isolation (one Secret per resource,
# `psec-<kind>-<owner>`) is APPLICATION-layer, enforced by
# `SecretsBrokerService` — k8s RBAC cannot filter by label or by Secret name,
# so this grant is intentionally broad at the k8s layer (consistent with the
# platform's no-NATS-ACLs stance, SPEC.md decision 5).
#
# `delete` (added 2026-08-12, PENDIENTES/12-undeploy.spec.md T01+T03): the
# teardown verb `POST /manifests/:name/undeploy` deletes each `secrets:`
# binding of the manifest it tears down through `DELETE /secrets/:name` —
# user decision 2 of that spec, "secrets die with the manifest". Removing a
# key while OTHER keys remain rewrites the Secret (`update`), but removing
# the LAST key deletes the Secret object itself (`deleteKey` in
# `k8s-secrets-store.ts`), which needs this verb. That supersedes the
# earlier "no `delete` verb, T05 is create-or-update only" rationale here:
# SPEC.md decision 8 stays TRUE for `apply` — the apply path still never
# deletes anything, and no writer on it gained delete behaviour — deletion
# is only ever reached through the separate, explicitly requested undeploy
# verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provisioning-service-secrets-manager
  labels:
    app.kubernetes.io/name: provisioning-service
    app.kubernetes.io/part-of: yoizen-arch
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
