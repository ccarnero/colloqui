apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cloud dev overlay. Inherits env-specific URLs from local/dev (single
# source of truth for service DNS) and re-applies the shared
# scale-to-zero component on top.
#
# Note: local/dev already pulls the same component, so re-applying it
# here is idempotent. We keep the explicit `components:` block to make
# the intent obvious in code review and to allow cloud/dev to diverge
# (e.g., add cloud-only patches) without touching local/dev.

namespace: platform-services-dev

resources:
  - ../../local/dev

components:
  - ../../_components/scale-to-zero-non-prod
