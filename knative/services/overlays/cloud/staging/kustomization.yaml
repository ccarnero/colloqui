apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cloud staging overlay. Inherits env-specific URLs from local/staging
# and the shared scale-to-zero-staging component (KEDA cooldown=300s).

namespace: platform-services-staging

resources:
  - ../../local/staging

components:
  - ../../_components/scale-to-zero-staging
