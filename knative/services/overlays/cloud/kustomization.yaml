apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregated entrypoint that stitches every cloud env together. Used
# by `kustomize build knative/services/overlays/cloud` for end-to-end
# diffing during PRs; CI / Argo apply each child overlay individually.

resources:
  - dev
  - qa
  - staging
  - production
