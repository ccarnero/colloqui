apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cloud production overlay.
#
# Phase 1 of the cost-efficiency plan deliberately leaves prod
# untouched: `min-scale` and `minReplicaCount` come straight from
# base manifests. This overlay exists so the env tree is complete
# (dev/qa/staging/production all live under cloud/) and so future
# phases (Phase 2: hybrid Postgres, Phase 4: consolidated consumers)
# can hang off the same root.

namespace: platform-services-production

resources:
  - ../../local/production
