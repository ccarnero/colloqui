apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cloud qa overlay. Inherits env-specific URLs from local/qa and the
# shared scale-to-zero-non-prod component already applied there.

namespace: platform-services-qa

resources:
  - ../../local/qa

components:
  - ../../_components/scale-to-zero-non-prod
