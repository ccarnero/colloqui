# Dev-only: keep ALL Knative Services at min 1 replica so every
# service is immediately available after bootstrap without waiting
# for KPA cold-start. Overrides the `scale-to-zero-non-prod`
# component which sets min-scale: "0" on all non-gateway services.
---


apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
---


