# Dev-only: keep ALL workers at min 1 replica so every service is
# immediately available after bootstrap without waiting for KEDA to
# detect Prometheus lag metrics and cold-start the pods.
#
# Overrides the `scale-to-zero-non-prod` component which sets
# minReplicaCount: 0 and idleReplicaCount: 0 on all workers.
#
# Both `idleReplicaCount` and `minReplicaCount` must be set to 1:
# KEDA scales to `idleReplicaCount` when no triggers are active, so
# leaving it at 0 would still drain the pods after the cooldown period.
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: channel-service-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-service-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connector-admin-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: audit-service-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connector-runtime-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: usage-aggregator-worker-scaler
spec:
  idleReplicaCount: 1
  minReplicaCount: 1
