---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: yoizenclaw-admin-service
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/yoizenclaw-admin-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: POSTGRES_USER
              value: "yoizen"
            - name: POSTGRES_PASSWORD
              value: "yoizen-dev-password"
            - name: POSTGRES_PORT
              value: "5432"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "yoizenclaw-admin-service"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
