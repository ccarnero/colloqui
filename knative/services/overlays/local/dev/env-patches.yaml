apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scheduler-service
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/scheduler-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: "postgres.support-services-dev.svc.cluster.local"
            - name: POSTGRES_DB
              value: "yoizen"
            - name: POSTGRES_USER
              value: "yoizen"
            - name: POSTGRES_PASSWORD
              value: "yoizen-dev-password"
            - name: POSTGRES_PORT
              value: "5432"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            # Maps tenant-id → tier for synchronous routing in
            # `TenantConnectionManager.resolveTenantTierSync`. Without this,
            # `acme-dedicated` falls back to `defaultTier=shared` and routes
            # to `postgres-shared` (where its DB does not exist) — every
            # CREATE/LIST then 500s. Keep the JSON in sync with the tenants
            # actually exercised by the e2e matrix.
            - name: TENANT_POSTGRES_TIER_OVERRIDES
              value: '{}'
            - name: TENANT_SERVICE_URL
              value: "http://tenant-service.platform-services-dev.svc.cluster.local"
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "scheduler-service"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
