# ----- workflow-service: split api ↔ worker (Phase 1.5) -----
# Note: previous K8s name was `workflow-api`; now `workflow-service-api`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workflow-service-api
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/workflow-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: ENTRYPOINT
              value: "dist/main.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: POSTGRES_USER
              value: "yoizen"
            - name: POSTGRES_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: POSTGRES_HOST
              value: "postgres.support-services-dev.svc.cluster.local"
            - name: POSTGRES_DB
              value: "yoizen"
            - name: TENANT_POSTGRES_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-service-api"
            - name: SERVICE_MODE
              value: "api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /health probes Temporal (gRPC getSystemInfo) + NATS + per-tenant
          # Postgres. Generous timeout/threshold prevent flickering NotReady
          # under load — flickering triggers SKS/Deployment 409 conflicts and
          # blocks scale-to-zero.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: ENTRYPOINT
              value: "dist/main.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: POSTGRES_USER
              value: "yoizen"
            - name: POSTGRES_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: TENANT_POSTGRES_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-service-worker"
            - name: SERVICE_MODE
              value: "worker"
---
# NOTE: workflow-worker / workflow-http-worker are plain Deployments
# (NOT Knative Services) — see knative/services/base/workflow-worker.yaml
# for the rationale. The patches below target `apps/v1.Deployment`
# accordingly; the env injection still happens here so the dev overlay
# remains the single place that wires service URLs / Temporal endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: ENTRYPOINT
              value: "dist/temporal/worker.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-worker"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-http-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: ADAPTER_SERVICE_URL
              value: "http://adapter-service.platform-services-dev.svc.cluster.local"
            - name: REDIS_HOST
              value: "redis.support-services-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-http-worker"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: proxy-service
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/proxy-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TENANT_SERVICE_URL
              value: "http://tenant-service.platform-services-dev.svc.cluster.local"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "proxy-service"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
