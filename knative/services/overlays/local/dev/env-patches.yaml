apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/api-gateway:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: REDIS_HOST
              value: "redis.support-services-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service.platform-services-dev.svc.cluster.local"
            - name: TENANT_SERVICE_URL
              value: "http://tenant-service.platform-services-dev.svc.cluster.local"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.platform-services-dev.svc.cluster.local"
            - name: CACHE_SERVICE_URL
              value: "http://cache-service.platform-services-dev.svc.cluster.local"
            - name: WEBHOOK_SERVICE_URL
              value: "http://webhook-service.platform-services-dev.svc.cluster.local"
            - name: EVENT_PROCESSOR_URL
              value: "http://event-processor.platform-services-dev.svc.cluster.local"
            - name: METRICS_SERVICE_URL
              value: "http://metrics-service.platform-services-dev.svc.cluster.local"
            - name: SCHEDULER_SERVICE_URL
              value: "http://scheduler-service.platform-services-dev.svc.cluster.local"
            - name: REGISTRY_SERVICE_URL
              value: "http://registry-service.platform-services-dev.svc.cluster.local"
            - name: WORKFLOW_SERVICE_URL
              value: "http://workflow-api.platform-services-dev.svc.cluster.local"
            - name: PROXY_SERVICE_URL
              value: "http://proxy-service.platform-services-dev.svc.cluster.local"
            - name: ADAPTER_SERVICE_URL
              value: "http://adapter-service.platform-services-dev.svc.cluster.local"
            - name: CHANNEL_SERVICE_URL
              value: "http://channel-service.platform-services-dev.svc.cluster.local"
            - name: ADMIN_SERVICE_URL
              value: "http://yoizenclaw-admin-service.platform-services-dev.svc.cluster.local"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
