apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from the
          # `postgres-credentials` Secret declared in base. We deliberately
          # do NOT redeclare them here: kustomize strategic-merge on a core
          # Deployment merges env entries field-by-field by `name`, leaving
          # both `value` AND `valueFrom` set, which kube-apiserver rejects.
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: POSTGRES_PORT
              value: "5432"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: TENANT_POSTGRES_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-worker"
            - name: SERVICE_MODE
              value: "worker"
---
