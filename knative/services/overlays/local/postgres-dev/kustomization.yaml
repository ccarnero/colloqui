apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Developer-mode overlay — the single configuration (Postgres storage engine).
# No autoscaling: KEDA ScaledObjects are removed from base and every Knative
# Service is pinned to one always-warm replica (min-scale = max-scale = 1).
# There is no scale-to-zero in developer mode.

namespace: platform-services-dev

resources:
  - ../../../base
  # postgres-credentials Secret lives in the postgres overlays (not in
  # base) so it only exists when the cluster runs storage-engine=postgres.
  - postgres-credentials.yaml

patches:
  - path: env-patches.yaml

  # Pin every Knative Service to a single always-warm replica: no KPA
  # autoscaling, no scale-to-zero. JSON-merge on the annotations map only,
  # so other annotations and the rest of the spec are preserved.
  - target:
      group: serving.knative.dev
      version: v1
      kind: Service
    patch: |-
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: pin-all
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "1"
              autoscaling.knative.dev/max-scale: "1"
