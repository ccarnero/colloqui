# NOTE: workflow-worker / connector-runtime are plain Deployments
# (NOT Knative Services) — see knative/services/base/workflow-worker.yaml
# for the rationale. The patches below target `apps/v1.Deployment`
# accordingly; the env injection still happens here so the local overlay
# remains the single place that wires service URLs / Temporal endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: ENTRYPOINT
              value: "dist/temporal/worker.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-production.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-production.svc.cluster.local:4222"
            # REDIS_HOST/REDIS_PORT are required by the executeAgentCall
            # activity (DistributedCircuitBreaker + YoizenClawExecutionClient
            # use Redis as a status cache). Without these, ioredis falls back
            # to localhost:6379 inside the pod and every agent call fails
            # with MaxRetriesPerRequestError.
            - name: REDIS_HOST
              value: "redis.support-services-production.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-production.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-worker"
---


