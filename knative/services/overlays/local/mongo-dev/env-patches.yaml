# ----- workflow-service: split api ↔ worker (Phase 1.5) -----
# Note: previous K8s name was `workflow-api`; now `workflow-service-api`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workflow-service-api
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/workflow-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: STORAGE_ENGINE
              value: "mongo"
            - name: ENTRYPOINT
              value: "dist/main.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: MONGO_USER
              value: "yoizen"
            - name: MONGO_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: MONGO_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: MONGO_DB
              value: "yoizen"
            - name: MONGO_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: TENANT_MONGO_SHARED_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_USER
              value: "yoizen"
            - name: TENANT_MONGO_SHARED_PASSWORD
              value: "yoizen-dev-password"
            - name: TENANT_MONGO_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-service-api"
            - name: SERVICE_MODE
              value: "api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /health probes Temporal (gRPC getSystemInfo) + NATS + per-tenant
          # Postgres. Generous timeout/threshold prevent flickering NotReady
          # under load — flickering triggers SKS/Deployment 409 conflicts and
          # blocks scale-to-zero.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
