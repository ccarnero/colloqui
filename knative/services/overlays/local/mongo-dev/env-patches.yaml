apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/api-gateway:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: REDIS_HOST
              value: "redis.support-services-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CLUSTER_MODE
              value: "false"
            # ----- DNS for split services (Phase 1.5): use *-api ------
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service-api.platform-services-dev.svc.cluster.local"
            - name: TENANT_SERVICE_URL
              value: "http://tenant-service.platform-services-dev.svc.cluster.local"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.platform-services-dev.svc.cluster.local"
            - name: CACHE_SERVICE_URL
              value: "http://cache-service.platform-services-dev.svc.cluster.local"
            - name: REGISTRY_SERVICE_URL
              value: "http://registry-service.platform-services-dev.svc.cluster.local"
            - name: WORKFLOW_SERVICE_URL
              value: "http://workflow-service-api.platform-services-dev.svc.cluster.local"
            - name: PROXY_SERVICE_URL
              value: "http://proxy-service.platform-services-dev.svc.cluster.local"
            - name: CONNECTOR_ADMIN_URL
              value: "http://connector-admin-api.platform-services-dev.svc.cluster.local"
            - name: CHANNEL_SERVICE_URL
              value: "http://channel-service-api.platform-services-dev.svc.cluster.local"
            - name: ADMIN_SERVICE_URL
              value: "http://agent-admin-service.platform-services-dev.svc.cluster.local"
            - name: AI_AGENT_GATEWAY_URL
              value: "http://ai-agent-gateway.platform-services-dev.svc.cluster.local"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
            - name: WEBHOOK_PUBLISH_TIMEOUT_MS
              value: "3000"
            - name: GATEWAY_AUDIT_SKIP_WEBHOOKS
              value: "true"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
    metadata:
      annotations:
        autoscaling.knative.dev/metric: rps
        autoscaling.knative.dev/target: "150"
        autoscaling.knative.dev/min-scale: "2"
        autoscaling.knative.dev/max-scale: "5"
---

