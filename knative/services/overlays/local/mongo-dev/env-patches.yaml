apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tenant-service
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/tenant-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: STORAGE_ENGINE
              value: "mongo"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: MONGO_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: MONGO_USER
              value: "yoizen"
            - name: MONGO_PASSWORD
              value: "yoizen-dev-password"
            - name: MONGO_DB
              value: "yoizen"
            - name: MONGO_PORT
              value: "27017"
            # tenant-service provisions per-tenant logical DBs + roles on the
            # shared cluster via `db.admin.command({createUser})`, so it needs
            # root credentials on the same cluster used for platform data. In
            # dev/local we collapse "platform" and "shared-tier" onto the
            # single `mongo-platform` StatefulSet.
            - name: MONGO_ROOT_USER
              value: "admin"
            - name: MONGO_ROOT_PASSWORD
              value: "admin-dev-password"
            - name: TENANT_MONGO_SHARED_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: TENANT_MONGO_SHARED_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_USER
              value: "yoizen"
            - name: TENANT_MONGO_SHARED_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: TENANT_MONGO_IMAGE
              value: "mongo:7.0"
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "tenant-service"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---

