apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: STORAGE_ENGINE
              value: "mongo"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: MONGO_DB
              value: "yoizen"
            - name: MONGO_USER
              value: "yoizen"
            - name: MONGO_PASSWORD
              value: "yoizen-dev-password"
            - name: MONGO_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: MONGO_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: TENANT_MONGO_SHARED_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_USER
              value: "yoizen"
            - name: TENANT_MONGO_SHARED_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: TENANT_MONGO_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-worker"
            - name: SERVICE_MODE
              value: "worker"
          # Trimmed for single-node minikube (2026-05-12 orchestrator-
          # throughput plan, Phase 1). Base requests 100m/128Mi; actual
          # steady-state ~30m/pod with 3 replicas. Reclaiming 150m of
          # node CPU budget (3 × 50m) for the workflow-* workers without
          # touching limits — burst capacity (500m/256Mi) is identical.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---

