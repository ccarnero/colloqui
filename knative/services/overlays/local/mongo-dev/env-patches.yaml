# NOTE: workflow-worker / connector-runtime are plain Deployments
# (NOT Knative Services) — see knative/services/base/workflow-worker.yaml
# for the rationale. The patches below target `apps/v1.Deployment`
# accordingly; the env injection still happens here so the dev overlay
# remains the single place that wires service URLs / Temporal endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: ENTRYPOINT
              value: "dist/temporal/worker.js"
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: REDIS_HOST
              value: "redis.support-services-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # The platform Redis is deployed as a 3-master + 3-replica
            # Cluster. Without REDIS_CLUSTER_MODE=true, ioredis opens a
            # standalone connection to the seed node and every command
            # whose key hashes off-shard returns a `MOVED <slot> <ip>`
            # ReplyError. `executeAgentCall` (circuit breaker +
            # YoizenClawExecutionClient cache) is the consumer here.
            - name: REDIS_CLUSTER_MODE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "workflow-worker"
          # Trimmed for single-node minikube. Base requests 250m / 512Mi
          # for stress-grade multi-node packing. On a 12-CPU local node
          # the cluster sits at ~99% CPU-request saturation when KEDA
          # tries to spawn the `maxReplicaCount: 20` ceiling, blocking
          # all new pods with `Insufficient cpu`. `kubectl top` shows
          # actual avg usage ~150m / 280Mi per replica even under the
          # stress-test workload, so 100m / 256Mi requests preserve
          # scheduler accuracy without changing burst capacity (limits
          # stay at 2 CPU / 1Gi from the base). Same precedent as
          # api-gateway above.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-runtime
spec:
  template:
    spec:
      containers:
        - name: user-container
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal.support-services-dev.svc.cluster.local:7233"
            - name: CONNECTOR_ADMIN_URL
              value: "http://connector-admin-api.platform-services-dev.svc.cluster.local"
            - name: REDIS_HOST
              value: "redis.support-services-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CLUSTER_MODE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "connector-runtime"
          # Trimmed for single-node minikube — same rationale as
          # workflow-worker above. The HTTP worker is I/O-bound
          # (outbound `tracedFetch`) so actual per-pod CPU is much
          # lower than the orchestrator: `kubectl top` shows ~70m /
          # 110Mi per replica under stress. Base requests 250m / 256Mi
          # so 75m / 128Mi here lets the scheduler pack the
          # `maxReplicaCount: 50` ceiling without oversubscribing the
          # 12-core node. Limits unchanged (2 CPU / 1Gi) so burst
          # capacity is identical.
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
---

apiVersion: serving.knative.dev/v1
