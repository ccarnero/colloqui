# ----- adapter-service: split api ↔ worker (Phase 1.5) -----
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: connector-admin-api
spec:
  template:
    metadata:
      # Re-scale annotations after the 2026-05 stress sprint where
      # adapter-service-api became the *actual* upstream ceiling for
      # connector-runtime:
      #
      # - metric: concurrency -> rps. Same lesson as api-gateway: the
      #   HTTP CRUD path is short (~30 ms p50 to the per-tenant DB),
      #   so concurrency stays well below any reasonable scale-up
      #   threshold even at multi-thousand RPS bursts. RPS scales out
      #   linearly and predictably.
      # - target: 50 -> 200 RPS per pod. With 2 CPU per pod (see
      #   resources below) and ~5 ms/req CPU budget, 200 RPS leaves
      #   ~50% headroom for tail latency.
      # - min-scale: 0 -> 2. Cold start (image fetch + Nest bootstrap
      #   + tenant pool warmup) is 8-15 s. During the 2026-05 run KPA
      #   scaled to 0 between bursts and the next 50 RPS wave found
      #   the service still cold-starting — every call timed out,
      #   connector-runtime breaker tripped, cascade. Always-on 2
      #   replicas absorbs the warmup without delay.
      # - max-scale: 3 -> 10. The 17 k-workflow drain backlog of the
      #   2026-05 stress test sustained ~1200 concurrent activities
      #   against this service; capping at 3 pods left each pod doing
      #   ~400 concurrent (8x the per-pod target). 10 pods x 200 RPS
      #   target = 2000 RPS aggregate headroom, matches the stress
      #   plan's spike phase ceiling.
      # - scale-down-delay: 60 s. Avoids the readiness-flap thrash we
      #   observed when KPA scaled down within seconds of a burst,
      #   then immediately scaled back up only to be marked unhealthy
      #   because the new pod hadn't warmed its tenant pools.
      annotations:
        autoscaling.knative.dev/metric: rps
        autoscaling.knative.dev/target: "200"
        autoscaling.knative.dev/min-scale: "2"
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containers:
        - name: user-container
          image: dev.local/connector-admin:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: STORAGE_ENGINE
              value: "mongo"
            - name: NATS_URL
              value: "nats://nats.support-services-dev.svc.cluster.local:4222"
            - name: MONGO_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: MONGO_USER
              value: "yoizen"
            - name: MONGO_PASSWORD
              value: "yoizen-dev-password"
            - name: MONGO_DB
              value: "yoizen"
            - name: MONGO_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_HOST
              value: "mongo-platform.support-services-dev.svc.cluster.local"
            - name: TENANT_MONGO_SHARED_PORT
              value: "27017"
            - name: TENANT_MONGO_SHARED_USER
              value: "yoizen"
            - name: TENANT_MONGO_SHARED_PASSWORD
              value: "yoizen-dev-password"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            - name: TENANT_MONGO_TIER_OVERRIDES
              value: '{}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-dev.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "connector-admin"
            - name: SERVICE_MODE
              value: "api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Bumped after the 2026-05 stress test exposed
          # adapter-service-api as the actual upstream ceiling. Old
          # 500m / 256Mi cap saturated at ~50 RPS — single Bun event
          # loop ran 100% on a 500 mCPU slice while resolving per-
          # tenant Postgres queries, /readyz timed out on the 1 s
          # default kubelet probe, pods were marked Unhealthy and
          # cycled. 2 CPU / 1Gi gives the event loop room and lets the
          # tenant connection pool grow without RSS pressure.
          #
          # Followup (2026-05-12 orchestrator-throughput plan, Phase 1):
          # requests trimmed 500m → 300m because steady-state actual usage
          # is ~120m/pod (`kubectl top`). At min-scale 2 this reclaims
          # 400m of node budget for the workflow-* workers without
          # touching the 2 CPU limit (burst capacity unchanged).
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Relaxed from kubelet defaults (timeout 1s / failures 3).
          # /readyz hits the per-tenant `AdapterTenantConnectionManager`
          # which under load can take >1 s to acquire a pool slot —
          # the previous 1 s cutoff was flapping pods Unhealthy during
          # stress even though they were perfectly able to serve real
          # traffic. 5 s timeout x 5 failures = 25 s of true badness
          # before kubelet removes a pod from the LB.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
---

