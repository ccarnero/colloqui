apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/api-gateway:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-qa.svc.cluster.local:4222"
            - name: REDIS_HOST
              value: "redis.support-services-qa.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CLUSTER_MODE
              value: "true"
            # ----- DNS for split services (Phase 1.5): use *-api ------
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service-api.platform-services-qa.svc.cluster.local"
            - name: TENANT_SERVICE_URL
              value: "http://tenant-service.platform-services-qa.svc.cluster.local"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.platform-services-qa.svc.cluster.local"
            - name: CACHE_SERVICE_URL
              value: "http://cache-service.platform-services-qa.svc.cluster.local"
            - name: REGISTRY_SERVICE_URL
              value: "http://registry-service.platform-services-qa.svc.cluster.local"
            - name: WORKFLOW_SERVICE_URL
              value: "http://workflow-service-api.platform-services-qa.svc.cluster.local"
            - name: PROXY_SERVICE_URL
              value: "http://proxy-service.platform-services-qa.svc.cluster.local"
            - name: CHANNEL_SERVICE_URL
              value: "http://channel-service-api.platform-services-qa.svc.cluster.local"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: PLATFORM_ENVIRONMENT
              value: "qa"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-qa.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
# ----- audit-service: split api ↔ worker (Phase 1.5) -----
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audit-service-api
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/audit-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "yoizen"
            - name: POSTGRES_PASSWORD
              value: "yoizen-dev-password"
            - name: NATS_URL
              value: "nats://nats.support-services-qa.svc.cluster.local:4222"
            - name: POSTGRES_PORT
              value: "5432"
            - name: PLATFORM_ENVIRONMENT
              value: "qa"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-qa.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-api"
            - name: SERVICE_MODE
              value: "api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service-worker
spec:
  template:
    spec:
      containers:
        - name: user-container
          # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from the
          # `postgres-credentials` Secret declared in base. We deliberately
          # do NOT redeclare them here: kustomize strategic-merge on a core
          # Deployment merges env entries field-by-field by `name`, leaving
          # both `value` AND `valueFrom` set, which kube-apiserver rejects.
          env:
            - name: NATS_URL
              value: "nats://nats.support-services-qa.svc.cluster.local:4222"
            - name: POSTGRES_PORT
              value: "5432"
            - name: PLATFORM_ENVIRONMENT
              value: "qa"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-qa.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-worker"
            - name: SERVICE_MODE
              value: "worker"
---
