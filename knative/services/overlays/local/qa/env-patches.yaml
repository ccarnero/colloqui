apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
spec:
  template:
    spec:
      containers:
        - name: user-container
          image: dev.local/auth-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ADMIN_PASSWORD
            - name: POSTGRES_HOST
              value: "postgres.support-services-qa.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis.support-services-qa.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CLUSTER_MODE
              value: "true"
            - name: PLATFORM_ENVIRONMENT
              value: "qa"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.support-services-qa.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
