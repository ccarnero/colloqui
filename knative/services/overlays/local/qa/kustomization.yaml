apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local qa overlay. Mirrors cloud/qa scale-to-zero policy.

namespace: platform-services-qa

resources:
  - ../../../base
  # postgres-credentials Secret lives in the postgres overlays (not in
  # base) so it only exists when the cluster runs storage-engine=postgres.
  - postgres-credentials.yaml

components:
  - ../../_components/scale-to-zero-non-prod

patches:
  - path: env-patches.yaml
