apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local staging overlay. Mirrors cloud/staging policy: scale-to-zero
# with longer KEDA cooldown (300s) to avoid pod churn during canary /
# nightly suites.

namespace: platform-services-staging

resources:
  - ../../../base
  # postgres-credentials Secret lives in the postgres overlays (not in
  # base) so it only exists when the cluster runs storage-engine=postgres.
  - postgres-credentials.yaml

components:
  - ../../_components/scale-to-zero-staging

patches:
  - path: env-patches.yaml
