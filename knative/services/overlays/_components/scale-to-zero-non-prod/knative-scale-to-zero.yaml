# Strategic-merge patches shared by every non-prod overlay
# (local/{dev,qa,staging} + cloud/{dev,qa,staging}).
#
# Forces `min-scale: 0` on every Knative Service that does NOT need
# always-on capacity. `api-gateway` is intentionally excluded — it is
# the entry point used by devs + automation; cold-starting it on
# every poke kills DX.
#
# `initial-scale: 0` is intentionally NOT set: vanilla Knative gates
# zero-initial-scale behind the cluster-wide flag
# `allow-zero-initial-scale=true` (config-autoscaler ConfigMap),
# which our minikube/orbstack/cloud clusters do not enable. New
# revisions therefore boot at 1 replica and KPA drains them after
# `scale-down-delay`. The savings of `initial-scale=0` are marginal
# (one pod for ~30-60s per deploy) and not worth fighting the
# admission webhook for.
#
# Services NOT included here (kept at `min-scale: 1` from base):
#   • `api-gateway`             — DX entry point, cold-start hostile.
#   • `audit-service`           — runs an internal NATS durable consumer
#   • `event-processor`           (`audit-events` / `event-processor` /
#   • `metrics-service`           `metrics` / `webhook-dispatcher` /
#   • `webhook-service`           `workflow-triggers` / `channel-egress`
#   • `workflow-api`              + `auto-reply` / `agg-INGRESS` +
#   • `channel-service`           `agg-DLQ`). Going to zero would block
#   • `usage-aggregator-service`  message processing while idle, since
#                                 KPA only wakes the pod on HTTP
#                                 traffic. Splitting the consumer side
#                                 off into a separate `apps/v1.Deployment`
#                                 + KEDA scaler is tracked as follow-up.
#
# `workflow-worker` and `workflow-http-worker` are NOT in this file —
# they were converted from Knative Services to plain `apps/v1.Deployment`
# resources because Knative Service does not expose `/scale` and KEDA
# could not drive scaling. The KEDA Temporal scaler now owns those two
# directly. See `keda-scale-to-zero.yaml` for their min/idle override.
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/scale-down-delay: "30s"
        autoscaling.knative.dev/window: "60s"
---
