# KEDA ScaledObject patches shared by dev/qa overlays (local + cloud).
# Drops `minReplicaCount` and `idleReplicaCount` to 0 so KEDA can fully
# drain the deployment when the upstream backlog is empty.
#
# Scope: every Phase 1.5 `*-worker` (NATS JetStream-driven) plus the
# pre-existing Temporal workers. All targets are plain
# `apps/v1.Deployment` resources (NOT Knative Services). KEDA cannot
# scale Knative Services because they don't expose a `/scale`
# subresource — see `knative/services/base/scaledobjects/kustomization.yaml`
# and `knative/services/overlays/cloud/README.md` for the full
# rationale.
#
# Temporal persists task state server-side; NATS durables persist
# pending+unacked counts, so scaled-down workers rebind on the next
# pending message without losing work. The base ScaledObjects keep
# `cooldownPeriod` at 180-300s to protect in-flight work from
# premature SIGTERM.
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-worker-scaler
spec:
  minReplicaCount: 0
  idleReplicaCount: 0
---


apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connector-runtime-scaler
spec:
  minReplicaCount: 0
  idleReplicaCount: 0
---


