# Strategic-merge patches shared by staging overlays (local + cloud).
#
# Same `min-scale: 0` shape as `scale-to-zero-non-prod`; the difference
# lives in the sibling `keda-scale-to-zero.yaml` which uses a longer
# `cooldownPeriod: 300` to absorb overlapping canary releases without
# pod churn.
#
# `api-gateway` is intentionally excluded — entry point for devs +
# automation; cold-starting it on every poke kills DX.
#
# `initial-scale: 0` is intentionally NOT set: vanilla Knative gates
# zero-initial-scale behind the cluster-wide flag
# `allow-zero-initial-scale=true` (config-autoscaler ConfigMap),
# which our minikube/orbstack/cloud clusters do not enable.
#
# Phase 1.5 (split api ↔ worker):
#   • Every `*-api` Knative Service now scales to zero — the worker
#     pair handles NATS durable consumers / RPC subjects, so dropping
#     HTTP replicas to zero no longer blocks message processing.
#   • Every `*-worker` is a plain `apps/v1.Deployment` driven by KEDA
#     (see `keda-scale-to-zero.yaml`); not patched here.
#
# Services NOT included here (kept at `min-scale: 1` from base):
#   • `api-gateway` — DX entry point, cold-start hostile.
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/scale-down-delay: "30s"
        autoscaling.knative.dev/window: "60s"
---
