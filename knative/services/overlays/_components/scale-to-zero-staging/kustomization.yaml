apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared scale-to-zero policy for `staging`.
# Identical Knative annotations as non-prod, but KEDA `cooldownPeriod`
# is bumped to 300s to avoid pod churn during canary / nightly suites.
#
# Composed by `local/staging` and `cloud/staging` via:
#
#   components:
#     - ../../_components/scale-to-zero-staging

patches:
  - path: knative-scale-to-zero.yaml
  - path: keda-scale-to-zero.yaml
