apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-agent-gateway
  labels:
    app.kubernetes.io/name: ai-agent-gateway
    app.kubernetes.io/component: runtime-gateway
    app.kubernetes.io/part-of: yoizen-arch
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      # Long-lived SSE relay (runtime token streaming — the @Sse relay held
      # open by ai-agent-gateway for POST /runtime/executions/stream,
      # DOCS/architecture/runtime-streaming.md §6) needs a request timeout
      # well beyond Knative's 300s default. Cluster
      # max-revision-timeout-seconds must also be >= this value (ops/infra
      # prerequisite, not set here).
      timeoutSeconds: 3600
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/ai-agent-gateway:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: AGENT_AI_SERVICE_URL
              value: "http://agent-ai-service.platform-services.svc.cluster.local"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
