# adapter-service worker pod (NATS JetStream consumer).
#
# Plain `apps/v1.Deployment` (NOT a Knative Service) because:
#   1. The worker doesn't receive inbound HTTP — KPA / activator have
#      no signal to wake it from zero.
#   2. KEDA cannot scale a Knative Service (no `/scale` subresource on
#      `serving.knative.dev/v1.Service`); plain Deployment exposes
#      `/scale` natively so the KEDA HPA shim can drive replicas based
#      on JetStream consumer lag.
#
# Runs `SERVICE_MODE=worker` so the same Docker image as
# adapter-service-api skips Fastify bootstrap (no public HTTP listener)
# and only wires the `MultiTenantConsumerManager` for the
# `adapter-internal-sync` durable on every `INGRESS-<TENANT>` stream.
# The Node-native worker-health-server still binds port 3000 to expose
# `/healthz` (liveness) and `/readyz` (gates on NATS + DB + ≥1 healthy
# runner). See `services/adapter-service/src/main.ts`.
#
# `replicas: 1` is the base default; the matching ScaledObject in
# `scaledobjects/connector-admin-worker.yaml` is the actual authority
# on replica count at runtime, and non-prod overlays drop both
# `minReplicaCount` and `idleReplicaCount` to 0 for full scale-to-zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-admin-worker
  labels:
    app.kubernetes.io/name: connector-admin-worker
    app.kubernetes.io/component: adapter-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-admin-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-admin-worker
        app.kubernetes.io/component: adapter-persistence
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/connector-admin:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "connector-admin-worker"
            # Storage-engine credentials (MONGO_* or POSTGRES_*) are injected
            # by the active overlay (local/mongo-dev or local/postgres-dev),
            # never here — the base stays engine-agnostic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
