# adapter-service worker pod (NATS JetStream consumer).
#
# Plain `apps/v1.Deployment` (NOT a Knative Service) because the worker
# doesn't receive inbound HTTP — it only consumes NATS JetStream
# durables. Knative's activator/KPA model is built around HTTP request
# traffic, so it has no signal to drive this workload and adds nothing
# here. A plain Deployment is the simple, correct fit.
#
# Runs `SERVICE_MODE=worker` so the same Docker image as
# adapter-service-api skips Fastify bootstrap (no public HTTP listener)
# and only wires the `MultiTenantConsumerManager` for the
# `adapter-internal-sync` durable on every `INGRESS-<TENANT>` stream.
# The Node-native worker-health-server still binds port 3000 to expose
# `/healthz` (liveness) and `/readyz` (gates on NATS + DB + ≥1 healthy
# runner). See `services/adapter-service/src/main.ts`.
#
# Fixed single replica in developer mode — no autoscaling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-admin-worker
  labels:
    app.kubernetes.io/name: connector-admin-worker
    app.kubernetes.io/component: adapter-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-admin-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-admin-worker
        app.kubernetes.io/component: adapter-persistence
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/connector-admin:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "connector-admin-worker"
            # Storage-engine credentials (MONGO_* or POSTGRES_*) are injected
            # by the active overlay (local/mongo-dev or local/postgres-dev),
            # never here — the base stays engine-agnostic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
