apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: registry-service
  labels:
    app.kubernetes.io/name: registry-service
    app.kubernetes.io/component: service-registry
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      serviceAccountName: registry-service
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/registry-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
