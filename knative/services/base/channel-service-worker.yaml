# channel-service worker pod. Phase 1.5 split.
#
# Runs `SERVICE_MODE=worker` — bootstraps the three consumer
# services that handle the inbound→outbound message pipeline:
#   - channel-webhook-ingress  (parse provider webhooks, publish ingress)
#   - channel-egress           (send outbound messages to providers)
#   - auto-reply               (rule-driven dispatcher, with rules cache)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-service-worker
  labels:
    app.kubernetes.io/name: channel-service-worker
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: channel-service-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: channel-service-worker
        app.kubernetes.io/component: messaging
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/channel-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "channel-service-worker"
            # Storage-engine credentials (MONGO_* or POSTGRES_*) are injected
            # by the active overlay (local/mongo-dev or local/postgres-dev),
            # never here — the base stays engine-agnostic.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
