apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - auth-secret.yaml
  - tenant-service-sa.yaml
  - api-gateway.yaml
  - auth-service.yaml
  # ----- Phase 1.5 split services (api ↔ worker pairs) -----
  # Each pair shares one Docker image and branches on `SERVICE_MODE`
  # at startup. *-api pods host HTTP controllers (Knative Service,
  # KPA-managed); *-worker pods host JetStream durable consumers
  # (apps/v1.Deployment, fixed 1 replica in developer mode).
  - connector-admin-api.yaml
  - connector-admin-worker.yaml
  - audit-service-api.yaml
  - audit-service-worker.yaml
  - channel-service-api.yaml
  - channel-service-worker.yaml
  - usage-aggregator-api.yaml
  - usage-aggregator-worker.yaml
  # tracking-ingester is worker-only (no api KSVC): a NATS JetStream ingester
  # that persists message-tracking events to Postgres. No SERVICE_MODE split.
  - tracking-ingester-worker.yaml
  # ClusterIP Service (T02 trace-console) — exposes the worker's :3000 HTTP
  # port (chains read endpoint) so the api-gateway proxy can reach it.
  - tracking-ingester-worker-svc.yaml
  # Daily payload-retention scrub (T03 payload-capture) — same image, plain
  # batch/v1.CronJob (no HTTP surface, so no Knative Service/KSVC here).
  - tracking-payload-scrub-cronjob.yaml
  - workflow-service-api.yaml
  - workflow-service-worker.yaml
  # ----- Single-pod Knative-only services (HTTP-only or stateful) -----
  - cache-service.yaml
  - tenant-service.yaml
  - proxy-service.yaml
  - registry-service.yaml
  - registry-service-sa.yaml
  - admin-console.yaml
  - agent-admin-service.yaml
  - agent-admin-service-worker.yaml
  - ai-agent-gateway.yaml
  # ----- Agent services (AI + scheduling) -----
  - agent-memory-service.yaml
  - agent-ai-service.yaml
  - agent-scheduler-service.yaml
  # ----- Plain Deployments (Temporal workers, fixed 1 replica) -----
  - workflow-worker.yaml
  - connector-runtime.yaml
  # T07 (connector-invoke-api) — HTTP invoke facade + async invoke consumer,
  # same image as connector-runtime, different entrypoints via command
  # override. See connector-runtime-http.yaml / connector-runtime-invoke.yaml
  # module-header comments for the deployment-shape rationale.
  - connector-runtime-http.yaml
  - connector-runtime-http-svc.yaml
  - connector-runtime-invoke.yaml
