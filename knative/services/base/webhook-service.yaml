apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: webhook-service
  labels:
    app.kubernetes.io/name: webhook-service
    app.kubernetes.io/component: webhook
spec:
  template:
    metadata:
      annotations:
        # HPA class: KEDA owns replica count based on JetStream
        # webhook-dispatcher consumer lag (see
        # knative/services/base/scaledobjects/webhook-service.yaml).
        autoscaling.knative.dev/class: hpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: cpu
        autoscaling.knative.dev/target: "80"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "15"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/webhook-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
