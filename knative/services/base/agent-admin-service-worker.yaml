# agent-admin-service worker pod (NATS JetStream consumer for document ingestion).
#
# Plain `apps/v1.Deployment` (NOT a Knative Service) because the worker
# doesn't receive inbound HTTP — it only consumes a NATS JetStream
# durable. Knative's activator/KPA model is built around HTTP request
# traffic, so it has no signal to drive this workload and adds nothing
# here. A plain Deployment is the simple, correct fit.
#
# Runs `SERVICE_MODE=worker` so the same Docker image as
# agent-admin-service skips Fastify bootstrap (no public HTTP listener)
# and only starts the `IngestionWorkerService` (OnModuleInit) which
# subscribes to ingestion events on the INGESTION-<ENV> stream.
#
# Fixed single replica in developer mode — no autoscaling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-admin-service-worker
  labels:
    app.kubernetes.io/name: agent-admin-service-worker
    app.kubernetes.io/component: document-ingestion
    app.kubernetes.io/part-of: yoizen-arch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-admin-service-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-admin-service-worker
        app.kubernetes.io/component: document-ingestion
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/agent-admin-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "agent-admin-service-worker"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
