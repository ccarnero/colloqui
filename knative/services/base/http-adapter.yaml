# Plain Kubernetes Deployment (NOT a Knative Service). Same rationale
# as `workflow-worker.yaml`:
#   • Temporal pull-based worker, no inbound HTTP traffic.
#   • KEDA cannot scale a Knative Service (no /scale subresource).
#   • Deployment exposes /scale natively → KEDA Temporal scaler works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-adapter
  labels:
    app.kubernetes.io/name: http-adapter
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: http-adapter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-adapter
        app.kubernetes.io/component: workflow
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-container
          image: dev.local/http-adapter:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
