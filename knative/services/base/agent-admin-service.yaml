apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent-admin-service
  labels:
    app.kubernetes.io/name: agent-admin-service
    app.kubernetes.io/component: admin-configuration
    app.kubernetes.io/part-of: yoizen-arch
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/agent-admin-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: NATS_URL
              value: "nats://nats:4222"
            # MONGO_* credentials are injected by the active mongo overlay
            # (local/mongo-dev); the base stays free of mongo credentials.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: MONGO_PORT
              value: "27017"
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
            # Per-tool MCP feature flags (manual-loops/provisioning-manifest-gaps-2.md
            # T07). Enabled in the dev deployment so the mcp-connections sample's
            # manifest-declared toolDescriptionOverrides actually lands here at
            # agent-admin-service (the PATCH /admin/agents/:id/tool-descriptions
            # handler returns HTTP 400 when this flag is off — provisioning's
            # agents-writer then correctly skips it, but the override would never
            # persist and the agent plan verdict would be a forever `update`).
            - name: AGENT_TOOL_DESCRIPTION_OVERRIDES_ENABLED
              value: "true"
            # Fallback API key for the Structured KB LLM path (NL->SQL).
            # The secret is created out-of-band (kubectl create secret) and
            # never committed; optional so the service starts without it.
            # Per-container connector credentials (provider_config.
            # provider_connector_id) take precedence over this env var.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: OPENAI_API_KEY
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
