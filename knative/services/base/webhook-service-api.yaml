# webhook-service API pod (HTTP, management). Phase 1.5 split.
#
# Hosts management endpoints (subscriptions CRUD). Runs `SERVICE_MODE=api`
# so the JetStream `webhook-dispatcher` durable consumer (egress side)
# stays disabled — see `services/webhook-service/src/modules/webhook/webhook.service.ts`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: webhook-service-api
  labels:
    app.kubernetes.io/name: webhook-service-api
    app.kubernetes.io/component: webhook
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-service-api
        app.kubernetes.io/component: webhook
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "15"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/webhook-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "api"
            - name: OTEL_SERVICE_NAME
              value: "webhook-service-api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
