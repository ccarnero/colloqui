apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: usage-aggregator-service
  labels:
    app.kubernetes.io/name: usage-aggregator-service
    app.kubernetes.io/component: billing-metrics
spec:
  template:
    metadata:
      annotations:
        # Long-lived NATS JetStream consumer loop — scale-to-zero would
        # drop the pull durable. Pin min-scale=1. Concurrency lives in
        # the aggregator engine (one worker per tenant/stream) so we keep
        # the replica count low.
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/usage-aggregator-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
