apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: authentication
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/auth-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ADMIN_PASSWORD
            - name: TENANT_ADMIN_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: TENANT_ADMIN_TENANT_ID
            - name: TENANT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: TENANT_ADMIN_EMAIL
            - name: TENANT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: TENANT_ADMIN_PASSWORD
            - name: TENANT_ADMIN_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: TENANT_ADMIN_DISPLAY_NAME
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
