# audit-service worker pod (NATS JetStream consumers).
#
# Plain `apps/v1.Deployment` (NOT a Knative Service) because:
#   1. The worker doesn't receive inbound HTTP — KPA / activator have
#      no signal to wake it from zero.
#   2. KEDA cannot scale a Knative Service (no `/scale` subresource on
#      `serving.knative.dev/v1.Service`); plain Deployment exposes
#      `/scale` natively so the KEDA HPA shim can drive replicas based
#      on JetStream consumer lag.
#
# Runs `SERVICE_MODE=worker` so the same Docker image as
# audit-service-api skips Fastify bootstrap (no HTTP listener) and only
# wires durable consumers (`gateway-audit`, `channel-audit`,
# `audit-events`). See `services/audit-service/src/main.ts`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service-worker
  labels:
    app.kubernetes.io/name: audit-service-worker
    app.kubernetes.io/component: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service-worker
        app.kubernetes.io/component: audit
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/audit-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-worker"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
