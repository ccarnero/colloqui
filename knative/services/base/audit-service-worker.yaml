# audit-service worker pod (NATS JetStream consumers).
#
# Plain `apps/v1.Deployment` (NOT a Knative Service) because the worker
# doesn't receive inbound HTTP — it only consumes NATS JetStream
# durables. Knative's activator/KPA model is built around HTTP request
# traffic, so it has no signal to drive this workload and adds nothing
# here. A plain Deployment is the simple, correct fit.
#
# Runs `SERVICE_MODE=worker` so the same Docker image as
# audit-service-api skips Fastify bootstrap (no HTTP listener) and only
# wires durable consumers (`gateway-audit`, `channel-audit`,
# `audit-events`). See `services/audit-service/src/main.ts`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service-worker
  labels:
    app.kubernetes.io/name: audit-service-worker
    app.kubernetes.io/component: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service-worker
        app.kubernetes.io/component: audit
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/audit-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "audit-service-worker"
            # Storage-engine credentials (MONGO_* or POSTGRES_*) are injected
            # by the active overlay (local/mongo-dev or local/postgres-dev),
            # never here — the base stays engine-agnostic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
