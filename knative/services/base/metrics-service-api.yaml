# metrics-service API pod (HTTP, query side). Phase 1.5 split.
#
# Hosts `MetricsController` (read-side, queries Postgres metrics tables).
# Runs `SERVICE_MODE=api` so the JetStream `metrics` durable consumer
# (services/metrics-service/src/modules/metrics/metrics.service.ts)
# stays disabled.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: metrics-service-api
  labels:
    app.kubernetes.io/name: metrics-service-api
    app.kubernetes.io/component: metrics
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-service-api
        app.kubernetes.io/component: metrics
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/metrics-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "api"
            - name: OTEL_SERVICE_NAME
              value: "metrics-service-api"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
