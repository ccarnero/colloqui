# Plain Kubernetes Deployment (NOT a Knative Service) — same rationale as
# `connector-runtime.yaml`'s header comment did NOT apply here: this pod
# DOES serve inbound HTTP (the invoke facade, `src/http-main.ts`), so a
# Knative Service would be the more natural fit long-term. Kept as a plain
# Deployment for T07 to match the human-approved deployment shape (three
# separate Deployments from the same image, see
# `manual-loops/connector-invoke-api.md` T07): `connector-runtime` (worker),
# `connector-runtime-http` (this file, invoke facade), and
# `connector-runtime-invoke` (async invoke consumer). Revisit Knative once
# the facade's autoscaling story is defined.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-runtime-http
  labels:
    app.kubernetes.io/name: connector-runtime-http
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-runtime-http
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-runtime-http
        app.kubernetes.io/component: workflow
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/connector-runtime:local
          imagePullPolicy: IfNotPresent
          # Same image as `connector-runtime` (worker.ts's Temporal pull
          # worker) and `connector-runtime-invoke` (invoke-consumer-main.ts).
          # The command override selects the HTTP invoke facade entrypoint
          # (`manual-loops/connector-invoke-api.md` T02/T07).
          command: ["bun", "dist/http-main.js"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: HTTP_FACADE_PORT
              value: "3100"
            # HTTP-response cache backend (SPEC 01-bugs-group-b T11/E36b) —
            # same rationale as `connector-runtime.yaml`: only the
            # per-endpoint `cache` strategy moves to cache-service, the rest
            # of this image's Redis use is untouched.
            - name: CACHE_SERVICE_URL
              value: http://cache-service.platform-services-dev.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
