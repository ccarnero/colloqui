# event-processor API pod (HTTP). Phase 1.5 split.
#
# Runs `SERVICE_MODE=api` — the EVENTS-stream durable consumer
# (services/event-processor/src/modules/processor/processor.service.ts)
# stays disabled. Only the HealthController and any future query
# controllers are exposed.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: event-processor-api
  labels:
    app.kubernetes.io/name: event-processor-api
    app.kubernetes.io/component: processor
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-processor-api
        app.kubernetes.io/component: processor
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/event-processor:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "api"
            - name: OTEL_SERVICE_NAME
              value: "event-processor-api"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
