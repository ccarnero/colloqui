apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: event-processor
  labels:
    app.kubernetes.io/name: event-processor
    app.kubernetes.io/component: processor
spec:
  template:
    metadata:
      annotations:
        # HPA class: KEDA owns replica count based on JetStream
        # event-processor consumer lag (see
        # knative/services/base/scaledobjects/event-processor.yaml).
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/event-processor:local
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
