apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: event-processor-worker-scaler
  labels:
    app.kubernetes.io/name: event-processor-worker
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-processor-worker
  pollingInterval: 15
  cooldownPeriod: 120
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  # event-processor is the enrichment + fan-out pipeline — hot path.
  # Tight threshold so a backlog blip immediately scales out.
  triggers:
    - type: prometheus
      name: event-processor-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: event_processor_lag
        threshold: "1000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="event-processor"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="event-processor"})
