apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-worker-scaler
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/component: autoscaler
spec:
  # Plain Deployment (not Knative Service) — see
  # knative/services/base/workflow-worker.yaml for why. Knative Service
  # does not expose `/scale`, so KEDA can't manage its replicas.
  # Deployment exposes `/scale` natively and KEDA scales it directly.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-worker
  # 15s polling matches the e2e test budget — first pending workflow task
  # waits ≤15s before activation fires and the pod boots from cold.
  pollingInterval: 15
  # Long cooldown protects in-flight activities. The Temporal worker holds
  # `maxConcurrentActivityTaskExecutions: 100` slots; a mid-execution
  # SIGTERM would forfeit unacked activities until heartbeat-timeout
  # reassignment (~30s default), which costs latency. 5 min covers most
  # workflow durations without leaving pods around forever.
  cooldownPeriod: 300
  # Base keeps min=1 so production has hot capacity; non-prod overlays
  # patch this to 0 + idleReplicaCount: 0 for full scale-to-zero. KEDA
  # constraint: when idleReplicaCount is set it must be < minReplicaCount,
  # but setting both to 0 in patches is the conventional way to express
  # "scale fully to zero between bursts" (HPA still respects the floor of
  # 1 once activation fires; idle/min-zero just removes the always-on
  # replica).
  idleReplicaCount: 0
  # Stress-grade floor: 2 hot replicas keep the orchestrator responsive
  # for the first burst (the cold-start of a Bun + Temporal worker is
  # 3-5s, which alone breaches schedule-to-start budgets at 200+
  # workflows/s).
  minReplicaCount: 2
  # Bumped from 10 → 20. With 200 concurrent activity slots × 150
  # workflow task slots per pod (worker.ts), 20 replicas can absorb
  # ~3000 concurrent workflows before the queue grows.
  maxReplicaCount: 12
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # Scale out aggressively: workflow latency is cumulative, every
          # second a pending task waits is a second the calling client
          # waits. No stabilization window so the first poll-after-spike
          # immediately bumps replicas.
          #
          # Bumped (2026-05-12 orchestrator-throughput plan, Phase 3):
          # Percent 100→200, Pods 2→6. The new slot-utilization triggers
          # measure ACTUAL backpressure (not queue depth), so we can
          # safely scale faster — the metric will stabilize once enough
          # replicas exist. 3→9→12 trajectory now takes one polling
          # window (15 s) for typical bursts.
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 200
              periodSeconds: 15
            - type: Pods
              value: 6
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          # 5-min stabilization mirrors `cooldownPeriod`; both have to
          # agree before HPA actually drops a pod. This is the main
          # safeguard against premature shutdown of pods with in-flight
          # activities (KEDA Temporal scaler sees only backlog, not
          # in-flight work — see KEDA scaler docs note on scale-to-zero).
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  # Trigger redesign (2026-05-12 orchestrator-throughput plan, Phase 2):
  #
  # Why not Temporal queue depth: the previous `temporal` scaler measured
  # `workflow-orchestrator` queue depth, but Temporal queue depth counts
  # ONLY unassigned tasks. A worker pod with 350 in-flight tasks (150
  # workflow + 200 activity slots full) shows `queue_depth=0` to KEDA —
  # blind to the actual saturation. The 2026-05 stress run hit 17k
  # workflows in `Running` state while queue depth stayed near zero;
  # KEDA never scaled past min-replicas and workflows timed out.
  #
  # New design: scale on `temporal_worker_task_slots_used` exported by
  # the Temporal Core SDK on each worker pod's :9464 endpoint (already
  # scraped by the `workflow-worker-sdk` Prometheus job in
  # infrastructure/base/observability/prometheus/configmap.yaml). This
  # metric DIRECTLY counts in-flight slots — exactly the signal that
  # was missing.
  #
  # Three triggers (KEDA takes the MAX recommendation):
  #   1. WorkflowWorker slot utilization (primary)
  #   2. ActivityWorker slot utilization (catches activity-heavy bursts)
  #   3. workflow-task schedule-to-start p95 latency (safety net for
  #      when slot metrics misbehave or telemetry briefly stops)
  #
  # KEDA Prometheus uses AverageValue mode by default: HPA divides the
  # query result by the current replica count, so the threshold is the
  # PER-POD target. We target ~30 % utilization of the worker slot cap
  # so scale-up fires before the activity / workflow queue actually
  # backs up.
  #
  # Per-pod thresholds (`worker.ts`):
  #   maxConcurrentWorkflowTaskExecutions: 150 → 30 % = 45
  #   maxConcurrentActivityTaskExecutions: 200 → 30 % = 60
  #
  # `activationThreshold: 5` (per-pod) keeps the ScaledObject in the
  # "active" state under any real workload but ignores the ~2 long-
  # poll reservations every worker holds at literal idle. Without
  # this, KEDA scales the deployment to `idleReplicaCount` between
  # bursts because slots_used is technically > 0 every single scrape.
  #
  # CRITICAL filter: `job="workflow-worker-sdk"` scopes the query to
  # the Prometheus scrape job that targets the actual worker pods on
  # :9464. Without this filter the same metric name is also exported
  # by the Temporal SERVER's internal system-worker for OUR user task
  # queues (Temporal Server polls user queues for sticky executions),
  # double-counting and lying to the autoscaler.
  triggers:
    # Primary: workflow-task slot utilization across all replicas.
    # AverageValue mode: HPA wants `current × (perPod / 45)` replicas.
    # At 60 / pod avg (40 %), HPA bumps replicas to ceil(N × 60 / 45).
    - type: prometheus
      name: workflow-worker-workflow-task-load
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: workflow_worker_workflow_task_load
        threshold: "45"
        activationThreshold: "5"
        query: |
          sum(temporal_worker_task_slots_used{job="workflow-worker-sdk",worker_type="WorkflowWorker",task_queue="workflow-orchestrator"})

    # Secondary: activity-task slot utilization on the same pods.
    # threshold=60 ≈ 30 % of maxConcurrentActivityTaskExecutions(200).
    - type: prometheus
      name: workflow-worker-activity-task-load
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: workflow_worker_activity_task_load
        threshold: "60"
        activationThreshold: "5"
        query: |
          sum(temporal_worker_task_slots_used{job="workflow-worker-sdk",worker_type="ActivityWorker",task_queue="workflow-orchestrator"})

    # Safety net: workflow-task schedule-to-start p95 latency in ms.
    # Scales out if the slot metrics misbehave (e.g. SDK telemetry
    # restart, scrape gap). threshold=2000ms means "1 replica per 2 s
    # of latency"; at 6s p95, KEDA wants ceil(6000/2000)=3 replicas.
    # The 1m rate() window dampens single-pod spikes.
    - type: prometheus
      name: workflow-worker-schedule-to-start
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: workflow_worker_schedule_to_start_p95_ms
        threshold: "2000"
        activationThreshold: "100"
        query: |
          1000 * histogram_quantile(0.95,
            sum by (le) (
              rate(temporal_workflow_task_schedule_to_start_latency_bucket{job="workflow-worker-sdk",task_queue="workflow-orchestrator"}[1m])
            )
          )
