apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: channel-service-worker-scaler
  labels:
    app.kubernetes.io/name: channel-service-worker
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel-service-worker
  pollingInterval: 15
  cooldownPeriod: 120
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  # channel-egress is the hot path (every outbound provider call is an
  # in-flight message); auto-reply is batched rule evaluation so its
  # threshold is looser. webhook-ingress lag is rolled into channel-egress
  # because every ingress eventually generates an egress (event-processor
  # → workflow-http-worker → channel-egress).
  triggers:
    - type: prometheus
      name: channel-egress-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: channel_egress_lag
        threshold: "500"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="channel-egress"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="channel-egress"})
    - type: prometheus
      name: channel-webhook-ingress-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: channel_webhook_ingress_lag
        threshold: "1000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="channel-webhook-ingress"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="channel-webhook-ingress"})
    - type: prometheus
      name: auto-reply-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: auto_reply_lag
        threshold: "2000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="auto-reply"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="auto-reply"})
