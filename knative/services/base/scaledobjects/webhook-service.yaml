apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webhook-service-scaler
  labels:
    app.kubernetes.io/name: webhook-service
    app.kubernetes.io/component: autoscaler
  annotations:
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
spec:
  scaleTargetRef:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: webhook-service
  pollingInterval: 15
  cooldownPeriod: 120
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 15
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    # webhook-dispatcher: outbound HTTP fan-out; slow customer endpoints
    # inflate in-flight counters → scale eagerly to absorb tail latency.
    - type: prometheus
      name: webhook-dispatcher-lag
      metadata:
        serverAddress: http://prometheus.default.svc:9090
        metricName: webhook_dispatcher_lag
        threshold: "500"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="webhook-dispatcher"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="webhook-dispatcher"})
