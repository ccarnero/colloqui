apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: event-processor-scaler
  labels:
    app.kubernetes.io/name: event-processor
    app.kubernetes.io/component: autoscaler
  annotations:
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
spec:
  scaleTargetRef:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: event-processor
  pollingInterval: 15
  cooldownPeriod: 120
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    # event-processor: enrichment + fan-out pipeline, hot path.
    - type: prometheus
      name: event-processor-lag
      metadata:
        serverAddress: http://prometheus.default.svc:9090
        metricName: event_processor_lag
        threshold: "1000"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="event-processor"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="event-processor"})
