apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workflow-service-worker-scaler
  labels:
    app.kubernetes.io/name: workflow-service-worker
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-service-worker
  pollingInterval: 15
  cooldownPeriod: 180
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 8
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  # Two durables on this worker — `workflow-triggers` (event → Temporal
  # startWorkflow) and `workflow-projector` (Temporal execution
  # projection). Triggers is the more time-sensitive one (a backed-up
  # trigger queue delays workflow starts visible to clients), so it has
  # the tighter threshold. Consumer names mirror `DURABLE_NAME`
  # constants in `services/workflow-service/src/modules/{triggers,
  # executions-projector}/*.ts`.
  triggers:
    - type: prometheus
      name: workflow-triggers-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: workflow_triggers_lag
        threshold: "1000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="workflow-triggers"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="workflow-triggers"})
    - type: prometheus
      name: workflow-projector-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: workflow_projector_lag
        threshold: "5000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="workflow-projector"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="workflow-projector"})
