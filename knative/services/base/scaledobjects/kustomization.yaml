apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ScaledObjects live in the Knative services overlay so they are
# deployed + torn down together with the services they scale.
# See ../../../infrastructure/base/keda/README.md for install notes
# (the KEDA operator itself is installed via Helm, not kustomize).
#
# IMPORTANT: KEDA cannot scale Knative Services directly because
# `serving.knative.dev/v1.Service` does not expose a `/scale`
# subresource — KEDA's HPA shim fails with
# `Target resource doesn't expose /scale subresource`. Only plain
# `apps/v1.Deployment` workloads are listed here.
#
# Two families of ScaledObjects:
#
#   1. Temporal task-queue workers (Phase 1):
#        - workflow-worker        (orchestrator pull queue)
#        - workflow-http-worker   (activity-only pull queue)
#      Trigger: `temporal` scaler reading task-queue depth.
#
#   2. NATS JetStream consumer workers (Phase 1.5 split):
#        - audit-service-worker      (gateway-audit + channel-audit)
#        - channel-service-worker    (egress + auto-reply + webhook-ingress)
#        - event-processor-worker    (event-processor on EVENTS stream)
#        - metrics-service-worker    (metrics persistence)
#        - usage-aggregator-worker   (agg-ingress + agg-dlq)
#        - webhook-service-worker    (webhook-dispatcher)
#        - workflow-service-worker   (workflow-triggers + workflow-executions)
#      Trigger: `prometheus` scaler aggregating
#      `jetstream_consumer_num_pending + num_ack_pending` per consumer.
#
# Each *-worker pod runs `SERVICE_MODE=worker`; the *-api side
# (Knative Service, KPA-managed) runs `SERVICE_MODE=api` and skips
# `onModuleInit` for every consumer (see
# `packages/observability/src/runtime-mode.ts` `isWorkerMode()`).

resources:
  - workflow-worker.yaml
  - workflow-http-worker.yaml
  - audit-service-worker.yaml
  - channel-service-worker.yaml
  - event-processor-worker.yaml
  - metrics-service-worker.yaml
  - usage-aggregator-worker.yaml
  - webhook-service-worker.yaml
  - workflow-service-worker.yaml
