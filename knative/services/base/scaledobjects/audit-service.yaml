apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: audit-service-scaler
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: autoscaler
  annotations:
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
spec:
  scaleTargetRef:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: audit-service
  pollingInterval: 30
  cooldownPeriod: 180
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  triggers:
    # gateway-audit: persists every platform event. High tolerance — audit
    # is best-effort bounded-latency, not sub-second critical.
    - type: prometheus
      name: gateway-audit-lag
      metadata:
        serverAddress: http://prometheus.default.svc:9090
        metricName: gateway_audit_lag
        threshold: "5000"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="audit-events"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="audit-events"})
    - type: prometheus
      name: channel-audit-lag
      metadata:
        serverAddress: http://prometheus.default.svc:9090
        metricName: channel_audit_lag
        threshold: "5000"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="channel-audit"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="channel-audit"})
