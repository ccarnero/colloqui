apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: usage-aggregator-worker-scaler
  labels:
    app.kubernetes.io/name: usage-aggregator-worker
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usage-aggregator-worker
  pollingInterval: 30
  cooldownPeriod: 300
  idleReplicaCount: 0
  minReplicaCount: 1
  # Aggregation has tight stateful invariants (per-window counters held
  # in-memory); a low ceiling keeps redistribution simple.
  maxReplicaCount: 3
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  # Aggregator durables span all tenant `INGRESS-*` streams; the
  # consumer name is constant (`agg-INGRESS` / `agg-DLQ` — uppercase
  # per `usageAggregatorServiceConfig.{ingressDurableName,dlqDurableName}`)
  # so a single filtered query sums lag across tenants.
  triggers:
    - type: prometheus
      name: agg-ingress-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: agg_ingress_lag
        threshold: "5000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="agg-INGRESS"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="agg-INGRESS"})
    - type: prometheus
      name: agg-dlq-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: agg_dlq_lag
        threshold: "100"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="agg-DLQ"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="agg-DLQ"})
