apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: metrics-service-worker-scaler
  labels:
    app.kubernetes.io/name: metrics-service-worker
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-service-worker
  pollingInterval: 30
  cooldownPeriod: 180
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
  # Metrics persistence aggregates counters/histograms — it tolerates a
  # seconds-level lag, so threshold is loose.
  triggers:
    - type: prometheus
      name: metrics-lag
      metadata:
        serverAddress: http://prometheus.support-services-dev.svc.cluster.local:9090
        metricName: metrics_lag
        threshold: "5000"
        activationThreshold: "0"
        query: |
          sum(jetstream_consumer_num_pending{consumer_name="metrics"})
          +
          sum(jetstream_consumer_num_ack_pending{consumer_name="metrics"})
