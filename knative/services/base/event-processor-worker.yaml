# event-processor worker pod (NATS JetStream consumer). Phase 1.5 split.
#
# Runs `SERVICE_MODE=worker` — Fastify is never bootstrapped, only the
# `event-processor` durable consumer on the EVENTS stream
# (`services/event-processor/src/modules/processor/processor.service.ts`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-processor-worker
  labels:
    app.kubernetes.io/name: event-processor-worker
    app.kubernetes.io/component: processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-processor-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-processor-worker
        app.kubernetes.io/component: processor
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-container
          image: dev.local/event-processor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_MODE
              value: "worker"
            - name: OTEL_SERVICE_NAME
              value: "event-processor-worker"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
