# Plain Kubernetes Deployment (NOT a Knative Service).
#
# Why not Knative?
#   Knative Service expects HTTP traffic for its activator-based
#   scale-from-zero. workflow-worker is a Temporal worker — it pulls
#   tasks from Temporal frontend over a long-lived gRPC connection and
#   never receives inbound HTTP. KPA / activator have no signal to wake
#   it from 0; KEDA can't scale a Knative Service because Knative does
#   not expose the `/scale` subresource on `serving.knative.dev/v1.Service`
#   (KEDA logs `ScaledObjectCheckFailed: target resource doesn't expose
#   /scale subresource`). Plain Deployment exposes `/scale` natively, so
#   KEDA's Temporal scaler can drive replicas based on
#   `workflow-orchestrator` task-queue depth — see
#   `scaledobjects/workflow-worker.yaml`.
#
# What we lose vs Knative:
#   - No Kourier/Knative Route → no external `*.example.com` URL.
#     Acceptable: nobody calls this worker over HTTP.
#   - No automatic Revision history.
#     Acceptable: standard Deployment rollout (RollingUpdate) works fine.
#
# What we keep:
#   - Same image, env, securityContext, resources as before.
#   - readinessProbe on `/health` (3000) — driven by `temporal-worker-health.ts`,
#     same as before. Protects rolling updates from sending traffic to a
#     not-yet-connected worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/component: workflow
spec:
  # Default 1; non-prod overlays set `idleReplicaCount: 0` on the
  # ScaledObject so KEDA scales this down once the Temporal queue
  # is drained for the cooldownPeriod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
        app.kubernetes.io/component: workflow
    spec:
      # 30s grace period matches `shutdownGraceTime: "30s"` in
      # services/workflow-service/src/temporal/worker.ts so SIGTERM
      # gives the worker time to drain in-flight activities before the
      # kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-container
          image: dev.local/workflow-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: ENTRYPOINT
              value: "dist/temporal/worker.js"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
