# Plain Kubernetes Deployment (NOT a Knative Service).
#
# Why not Knative?
#   workflow-worker is a Temporal worker — it pulls tasks from the
#   Temporal frontend over a long-lived gRPC connection and never
#   receives inbound HTTP. Knative's activator/KPA model is built around
#   HTTP request traffic, so it has no signal to drive this workload and
#   adds nothing here. A plain Deployment with a RollingUpdate strategy
#   is the simple, correct fit.
#
# What we lose vs Knative:
#   - No Kourier/Knative Route → no external `*.example.com` URL.
#     Acceptable: nobody calls this worker over HTTP.
#   - No automatic Revision history.
#     Acceptable: standard Deployment rollout (RollingUpdate) works fine.
#
# What we keep:
#   - readinessProbe on `/health` (3000) — driven by `temporal-worker-health.ts`.
#     Protects rolling updates from sending traffic to a not-yet-connected
#     worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/component: workflow
spec:
  # Fixed single replica in developer mode — no autoscaling.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
        app.kubernetes.io/component: workflow
    spec:
      # The worker's `shutdownGraceTime: "30s"` in
      # services/workflow-service/src/temporal/worker.ts is the in-process
      # budget to drain in-flight activities on SIGTERM; this 60s pod
      # grace period leaves headroom on top of it before the kubelet
      # sends SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-container
          image: dev.local/workflow-service:local
          imagePullPolicy: IfNotPresent
          command: ["bun", "dist/temporal/worker.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            # Temporal Core SDK Prometheus metrics. The bootstrap reads
            # `PROMETHEUS_BIND_ADDRESS` and calls `Runtime.install` once
            # before the worker starts. Scraped via the
            # `workflow-worker-sdk` Prometheus job.
            - name: temporal-sdk
              containerPort: 9464
              protocol: TCP
          env:
            - name: PROMETHEUS_BIND_ADDRESS
              value: "0.0.0.0:9464"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Stress-grade sizing. With 200 concurrent activities + 150
          # concurrent workflow tasks (worker.ts) the orchestrator is
          # CPU-bound on workflow replays. 1Gi memory accommodates the
          # workflow cache for sticky executions; 1 CPU request lets
          # multiple pods coexist on the same node without fighting.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
