apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workflow-worker
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/component: workflow
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/workflow-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: ENTRYPOINT
              value: "dist/temporal/worker.js"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
