apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: provisioning-service
  labels:
    app.kubernetes.io/name: provisioning-service
    app.kubernetes.io/component: provisioning
    app.kubernetes.io/part-of: yoizen-arch
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "50"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 0
      serviceAccountName: provisioning-service
      containers:
        - name: user-container
          image: dev.local/provisioning-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            # The @kubernetes/client-node v1 fetch client validates the
            # cluster API server's serving cert against the trust store. Under
            # Bun the serviceaccount CA is NOT trusted by default, so the first
            # HTTPS call that reaches the API server (the T05 secrets broker's
            # Secret read/write) fails with "self signed certificate in
            # certificate chain". Point NODE_EXTRA_CA_CERTS at the mounted
            # serviceaccount CA so the CA is trusted — the SAME fix
            # tenant-service and registry-service already carry (they hit the
            # K8s API too). Never disable TLS verification.
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PLATFORM_ENVIRONMENT
              value: "dev"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
