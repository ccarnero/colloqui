# channel-service API pod (HTTP). Phase 1.5 split.
#
# Hosts the webhook ingress endpoint (called by Telegram/WhatsApp/etc.
# providers — these post inbound messages and verification challenges
# over HTTP), the streams admin controller, accounts CRUD, and
# auto-reply CRUD.
#
# Runs `SERVICE_MODE=api` so the four NATS consumer services keep their
# `onModuleInit` no-op:
#   - WebhookIngressConsumerService (channel-webhook-ingress durable)
#   - SendCommandConsumerService    (channel-egress durable)
#   - AutoReplyService              (auto-reply durable + cache)
#   - WebhookVerifyRpcServer        (NATS RPC server)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: channel-service-api
  labels:
    app.kubernetes.io/name: channel-service-api
    app.kubernetes.io/component: messaging
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: channel-service-api
        app.kubernetes.io/component: messaging
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containerConcurrency: 0
      containers:
        - name: user-container
          image: dev.local/channel-service:local
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: SERVICE_MODE
              value: "api"
            - name: OTEL_SERVICE_NAME
              value: "channel-service-api"
            # Storage-engine credentials (MONGO_* or POSTGRES_*) are injected
            # by the active overlay (local/mongo-dev or local/postgres-dev),
            # never here — the base stays engine-agnostic.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
