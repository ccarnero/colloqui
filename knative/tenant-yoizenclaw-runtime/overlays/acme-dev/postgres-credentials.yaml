# Backstop for shared-tier tenants whose namespace has not been reconciled
# by `tenant-service` yet (e.g. when running `rebuild-redeploy.sh
# yoizenclaw-runtime` in a fresh dev cluster, or when the tenant was created
# out-of-band of the provisioning pipeline).
#
# tenant-service's `TenantPostgresProvisioner.provisionShared` writes the
# same two objects on a real provision flow; declaring them here keeps the
# Knative Service deployable in isolation. `kubectl apply -k` is idempotent
# against tenant-service's outputs as long as the keys/externalName below
# stay aligned with `packages/shared/src/tenant-database-tier.ts`
# (`tenant_<id>` / `tenant_<id>_app`).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: acme-dev-ns
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: tenant-yoizenclaw-runtime-overlay
    yoizen.io/postgres-tier: shared
type: Opaque
stringData:
  POSTGRES_DB: tenant_acme
  POSTGRES_USER: tenant_acme_app
  POSTGRES_PASSWORD: yoizen-dev-password
---
# DNS alias so `POSTGRES_HOST=postgres` (the tier-agnostic env contract used
# by the base manifest) resolves to the platform's shared CloudNativePG
# cluster instead of a non-existent per-namespace StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: acme-dev-ns
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: tenant-yoizenclaw-runtime-overlay
    yoizen.io/postgres-tier: shared
spec:
  type: ExternalName
  externalName: postgres-shared.support-services-dev.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
