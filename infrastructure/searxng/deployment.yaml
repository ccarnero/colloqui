apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: platform-services-dev
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: BASE_URL
          value: "http://searxng.platform-services-dev.svc.cluster.local:8080/"
        - name: INSTANCE_NAME
          value: "yoizen-research"
        volumeMounts:
        - name: searxng-config
          mountPath: /etc/searxng
        livenessProbe:
          httpGet:
            path: /search
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /search
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: searxng-config
        emptyDir: {}
