apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default OLTP stack: Postgres platform + usage + Temporal CNPG.
# Mongo manifests in `infrastructure/base/mongo/` are removed here.
# Layer environment overlays (e.g. `overlays/local/dev`) on top of this.

resources:
  - ../../base

patches:
  - path: patches/exclude-mongo.yaml
