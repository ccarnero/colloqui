apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Postgres OLTP (default): `../../postgres` drops Mongo from base.
# For Mongo OLTP use `../mongo-local-base` via `--storage-engine=mongo`.
resources:
  - ../../postgres

patches:
  - path: patches/nats-resources.yaml
  - path: patches/nats-config.yaml
  - path: patches/redis-resources.yaml
  - path: patches/postgres-resources.yaml
  - path: patches/postgres-temporal-resources.yaml
  - path: patches/postgres-temporal-visibility-resources.yaml
  - path: patches/observability-resources.yaml
