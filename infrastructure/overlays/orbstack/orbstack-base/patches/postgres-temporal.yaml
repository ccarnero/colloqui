# OrbStack override for `postgres-temporal` CNPG cluster.
# Keeps the local single-instance + `local-path` storage profile, but
# uses the stress-grade resource/Postgres sizing from local-base. The
# 200 rps webhook stress run saturated the previous 1 CPU / 1Gi cap and
# left Temporal draining workflows behind the ingress phase.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-temporal
spec:
  instances: 1
  resources:
    requests:
      cpu: 500m
      memory: 1500Mi
    limits:
      cpu: "4"
      memory: 3Gi
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  postgresql:
    parameters:
      shared_buffers: "1GB"
      effective_cache_size: "2GB"
      work_mem: "24MB"
      maintenance_work_mem: "320MB"
      huge_pages: "off"
      max_connections: "300"
      # CNPG validates max_wal_size < walStorage (2Gi here). 1.5GB
      # leaves headroom for bursts without rejecting the manifest.
      max_wal_size: "1500MB"
      min_wal_size: "512MB"
      wal_buffers: "32MB"
      autovacuum_max_workers: "6"
      autovacuum_naptime: "10s"
      # Single-instance local dev: trade the last few hundred ms of
      # durability on pod/host loss for much lower commit latency under
      # Temporal's write-heavy stress workload. Do not propagate to HA.
      synchronous_commit: "off"
---
# OrbStack resource sizing for the single auto-setup Deployment.
# Replaces the 4-role HA patches (temporal-frontend/history/matching/worker)
# now that base collapsed to a single `temporalio/auto-setup` pod.
# Trimmed for the OrbStack profile which competes with Docker workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  template:
    spec:
      containers:
        - name: temporal
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
