apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Postgres OLTP (default): excludes Mongo from base (see overlays/postgres).
resources:
  - ../../postgres

patches:
  - path: patches/nats.yaml
  - path: patches/nats-config.yaml
  - path: patches/redis.yaml
  - path: patches/postgres.yaml
  - path: patches/postgres-temporal.yaml
  - path: patches/postgres-temporal-visibility.yaml
