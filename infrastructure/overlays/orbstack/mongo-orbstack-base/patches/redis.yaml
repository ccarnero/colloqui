apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          # 6 pods × small footprint = 300m/384Mi req total. Orbstack
          # tends to have less CPU headroom than minikube, hence the
          # tighter cap.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 96Mi
