# OrbStack override for `postgres-temporal` CNPG cluster.
# Same shrink as `local-base/patches/postgres-temporal-resources.yaml`
# plus explicit `storageClass: local-path` (orbstack default storage
# class). PVCs and WAL PVCs both use it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-temporal
spec:
  instances: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      huge_pages: "off"
      max_connections: "150"
      max_wal_size: "1GB"
      min_wal_size: "256MB"
      wal_buffers: "16MB"
      autovacuum_max_workers: "3"
      # 2026-05-22 post-mortem: align naptime with base/local (10s) so
      # the orbstack profile doesn't fall behind on `executions`
      # autovacuum and start cascading `update-wf-execution` timeouts.
      autovacuum_naptime: "10s"
---
# OrbStack resource sizing for the single auto-setup Deployment.
# Replaces the 4-role HA patches (temporal-frontend/history/matching/worker)
# now that base collapsed to a single `temporalio/auto-setup` pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  template:
    spec:
      containers:
        - name: temporal
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
