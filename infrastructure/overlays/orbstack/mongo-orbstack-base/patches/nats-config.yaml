apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data/jetstream
      max_mem: 128MB
      max_file: 2GB
    }

    ping_interval: 20s
    ping_max: 3

    max_payload: 1MB
    max_pending: 64MB
    write_deadline: 10s
