# OrbStack uses rancher.io/local-path as its default StorageClass.
# These aliases allow PVCs from other clusters (Minikube, EKS, GKE, AKS)
# that hardcode a storageClassName to bind correctly on OrbStack without
# modifying the original manifests.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
# AWS EKS gp2 / gp3 alias
apiVersion: storage.k8s.io/v1
