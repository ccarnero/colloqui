apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
data:
  development-sql.yaml: |
    frontend.workerHeartbeatsEnabled:
      - value: true
    # Optional: make the listing endpoint richer too. Both keys have the same
    # one-liner format — a list of { value, constraints? } entries.
    frontend.listWorkersEnabled:
      - value: true
