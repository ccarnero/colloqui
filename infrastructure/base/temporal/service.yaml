apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      protocol: TCP
    - name: web
      port: 8233
      targetPort: web
      protocol: TCP
    # Prometheus metrics endpoint. Scraped by the `temporal-server`
    # job in the prometheus ConfigMap; the Service is in the same
    # namespace as Prometheus so a static `temporal:9090` target works.
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
