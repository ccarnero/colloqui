apiVersion: batch/v1
kind: Job
metadata:
  # Name pinned to the Temporal version so every image bump produces a
  # fresh Job (Kubernetes treats Jobs as immutable — `kubectl apply`
  # on an existing same-name Job is a no-op even if `spec.template`
  # changed). Convention: replace dots with dashes so it's a valid
  # DNS-1123 name. On bump, update BOTH this name and every
  # `image: temporalio/server:<version>` reference under
  # `infrastructure/base/temporal/deployment-*.yaml`.
  name: temporal-schema-setup-1-28-4
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: schema-bootstrap
spec:
  # Keep the Job around for 10 minutes after completion so operators
  # can `kubectl logs` it during incident triage. After that
  # kube-controller-manager garbage-collects it.
  ttlSecondsAfterFinished: 600
  # 3 retries cover transient network / postgres-not-quite-ready
  # blips. Schema operations are idempotent so re-runs are safe.
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: schema-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-tool
          # `temporalio/admin-tools` bundles `temporal-sql-tool` AND
          # the versioned schema files at
          # `/etc/temporal/schema/postgresql/v12/{temporal,visibility}/versioned`.
          # The tag scheme is compound:
          #   <serverVersion>-tctl-<tctlVersion>-cli-<cliVersion>
          # There is NO short `1.28.4` tag — the closest match for our
          # Temporal server `1.28.4` (see `deployment-*.yaml`
          # `image: temporalio/server:<version>`) is the fully-pinned
          # `1.28.4-tctl-1.18.4-cli-1.6.2` (latest patch for that
          # server release as of 2026-05). The `1.28.4` prefix is what
          # matters for schema-file compatibility; tctl/cli versions
          # are auxiliary tools we don't invoke from this Job.
          # On server bump: list tags at
          # https://hub.docker.com/v2/repositories/temporalio/admin-tools/tags?name=<newVersion>
          # and pick the highest patch (no rolling tags — those float).
          image: temporalio/admin-tools:1.28.4-tctl-1.18.4-cli-1.6.2
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: password
            - name: VIS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: username
            - name: VIS_POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            # `setup-schema -v 0.0` is idempotent — it uses
            # `CREATE TABLE IF NOT EXISTS schema_version`. `update-schema`
            # is also idempotent — it reads `schema_version.curr_version`
            # and applies only pending migrations. Same pattern the
            # upstream `auto-setup.sh` uses (no special idempotency
            # handling needed).
            #
            # `set -euo pipefail` would abort on the first non-zero
            # exit; we only want -e so individual `sql-tool` errors
            # propagate.
            - |
              set -eu
              echo "[schema] Waiting for postgres-temporal-rw..."
              until nc -z postgres-temporal-rw 5432; do
                sleep 1
              done
              echo "[schema] Waiting for postgres-temporal-visibility-rw..."
              until nc -z postgres-temporal-visibility-rw 5432; do
                sleep 1
              done

              echo "[schema] Bootstrapping default datastore (temporal)..."
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres-temporal-rw \
                --port 5432 \
                --user "${POSTGRES_USER}" \
                --password "${POSTGRES_PWD}" \
                --db temporal \
                setup-schema -v 0.0
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres-temporal-rw \
                --port 5432 \
                --user "${POSTGRES_USER}" \
                --password "${POSTGRES_PWD}" \
                --db temporal \
                update-schema \
                -d /etc/temporal/schema/postgresql/v12/temporal/versioned

              echo "[schema] Bootstrapping visibility datastore (temporal_visibility)..."
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres-temporal-visibility-rw \
                --port 5432 \
                --user "${VIS_POSTGRES_USER}" \
                --password "${VIS_POSTGRES_PWD}" \
                --db temporal_visibility \
                setup-schema -v 0.0
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres-temporal-visibility-rw \
                --port 5432 \
                --user "${VIS_POSTGRES_USER}" \
                --password "${VIS_POSTGRES_PWD}" \
                --db temporal_visibility \
                update-schema \
                -d /etc/temporal/schema/postgresql/v12/visibility/versioned

              echo "[schema] Bootstrap complete."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
