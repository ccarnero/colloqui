apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-server-config
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
# Hand-rolled `config_template.yaml` consumed by `dockerize` (the
# `temporalio/server:<version>` entrypoint). On boot the entrypoint runs:
#
#   dockerize -template /etc/temporal/config/config_template.yaml:
#                       /etc/temporal/config/docker.yaml
#   temporal-server --env docker start --service=$SERVICES
#
# This file replaces the bundled template (which carries Cassandra +
# MySQL + Elasticsearch branches plus TLS/Auth boilerplate we do not
# use) with a slimmer Postgres-only variant. Trade-offs:
#   + Auditable: every line is something we actually deploy.
#   + Hard-coded ports + numHistoryShards keep dev/prod consistent
#     and decouple the value from env-var typos.
#   - Must be re-validated against upstream on every `temporalio/server`
#     bump (`infrastructure/base/temporal/deployment-*.yaml` image
#     tag) — diff against
#     https://github.com/temporalio/temporal/blob/v$VERSION/docker/config_template.yaml
#     before merging.
data:
  config_template.yaml: |
    log:
      stdout: true
      level: {{ default .Env.LOG_LEVEL "info" }}

    persistence:
      # Pinned via the configmap because changing this AFTER bootstrap
      # orphans history (workflows route to the wrong shard). Same
      # invariant as the previous `NUM_HISTORY_SHARDS` env var on the
      # auto-setup Deployment — kept at 16 so the existing schema
      # remains compatible.
      numHistoryShards: 16
      defaultStore: default
      visibilityStore: visibility
      datastores:
        # Default datastore — workflow state (`executions`, `history_node`,
        # `tasks`, `queue_messages`, `cluster_membership`, ...).
        # Lives on the dedicated `postgres-temporal` CNPG cluster
        # (`infrastructure/base/postgres/postgres-temporal-cluster.yaml`).
        default:
          sql:
            pluginName: "postgres12"
            databaseName: "{{ default .Env.DBNAME "temporal" }}"
            connectAddr: "{{ default .Env.POSTGRES_SEEDS "" }}:{{ default .Env.DB_PORT "5432" }}"
            connectProtocol: "tcp"
            user: "{{ default .Env.POSTGRES_USER "" }}"
            password: "{{ default .Env.POSTGRES_PWD "" }}"
            maxConns: {{ default .Env.SQL_MAX_CONNS "20" }}
            maxIdleConns: {{ default .Env.SQL_MAX_IDLE_CONNS "20" }}
            maxConnLifetime: {{ default .Env.SQL_MAX_CONN_TIME "1h" }}
        # Visibility datastore — `executions_visibility` + 50-ish
        # secondary indexes. Lives on its OWN CNPG cluster
        # (`infrastructure/base/postgres/postgres-temporal-visibility-cluster.yaml`)
        # since the 2026-05-22 split (post-mortem §P0.2).
        visibility:
          sql:
            pluginName: "postgres12"
            databaseName: "{{ default .Env.VISIBILITY_DBNAME "temporal_visibility" }}"
            connectAddr: "{{ default .Env.VISIBILITY_POSTGRES_SEEDS "" }}:{{ default .Env.VISIBILITY_DB_PORT "5432" }}"
            connectProtocol: "tcp"
            user: "{{ default .Env.VISIBILITY_POSTGRES_USER "" }}"
            password: "{{ default .Env.VISIBILITY_POSTGRES_PWD "" }}"
            maxConns: {{ default .Env.SQL_VIS_MAX_CONNS "10" }}
            maxIdleConns: {{ default .Env.SQL_VIS_MAX_IDLE_CONNS "10" }}
            maxConnLifetime: {{ default .Env.SQL_VIS_MAX_CONN_TIME "1h" }}

    global:
      membership:
        # ringpop join window. 30s is the upstream default — leave it
        # alone, the cascade case from post-mortem §10.2 needs hands-on
        # `kubectl delete pod` regardless of this knob.
        maxJoinDuration: 30s
        # Peers reach this pod via this address (BIND_ON_IP if =0.0.0.0
        # is resolved to the pod IP by the entrypoint).
        broadcastAddress: "{{ default .Env.TEMPORAL_BROADCAST_ADDRESS "" }}"
      pprof:
        port: {{ default .Env.PPROF_PORT "0" }}
      metrics:
        prometheus:
          # `histogram` lets PromQL compute proper p50/p95/p99 via
          # `histogram_quantile` (see
          # `infrastructure/base/observability/prometheus/alerts.yaml`
          # `TemporalScheduleToStartHigh`, `TemporalPersistenceLatencyHigh`).
          # The `summary` timer type would break those alerts.
          timerType: "histogram"
          listenAddress: "{{ default .Env.PROMETHEUS_ENDPOINT "0.0.0.0:9090" }}"

    # Each role exposes its own gRPC + ringpop ports. Even with
    # SERVICES=frontend (single role per Deployment), the bundled
    # config has to define ALL 4 because the server self-discovers
    # peers via ringpop and needs to know where to call them.
    #
    # Port allocation (matches upstream defaults and is documented in
    # `service-internode.yaml`):
    #   frontend  grpc=7233  membership=6933  http=7243
    #   history   grpc=7234  membership=6934
    #   matching  grpc=7235  membership=6935
    #   worker    grpc=7239  membership=6939
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnIP: "{{ default .Env.BIND_ON_IP "0.0.0.0" }}"
          httpPort: 7243
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: "{{ default .Env.BIND_ON_IP "0.0.0.0" }}"
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: "{{ default .Env.BIND_ON_IP "0.0.0.0" }}"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: "{{ default .Env.BIND_ON_IP "0.0.0.0" }}"

    clusterMetadata:
      # Single-cluster setup; no cross-region replication. The rest of
      # the fields are required-but-vestigial when
      # `enableGlobalNamespace=false`.
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          # Points at the in-cluster `temporal` Service (the one
          # `service-frontend.yaml` defines — selector pinned to
          # `temporal.io/role=frontend`). This is what the internal
          # worker uses to call the frontend for system workflows.
          rpcAddress: "{{ default .Env.PUBLIC_FRONTEND_ADDRESS "temporal:7233" }}"

    dcRedirectionPolicy:
      policy: "noop"

    # Archival turned off. We never enabled it on auto-setup either
    # and turning it on requires a writeable `filestore` URI per
    # namespace — out of scope for the HA migration.
    archival:
      history:
        state: "disabled"
      visibility:
        state: "disabled"

    namespaceDefaults:
      archival:
        history:
          state: "disabled"
        visibility:
          state: "disabled"

    # Worker role + internal-frontend-less setups need a publicClient
    # to reach the frontend. Same address as `clusterInformation.active.rpcAddress`
    # — both point at the `temporal` Service in the same namespace.
    publicClient:
      hostPort: "{{ default .Env.PUBLIC_FRONTEND_ADDRESS "temporal:7233" }}"

    # Mounted by every Deployment from the `temporal-dynamic-config`
    # ConfigMap (`configmap-dynamic-config.yaml`). Keys today are
    # `frontend.workerHeartbeatsEnabled` + `frontend.listWorkersEnabled`.
    dynamicConfigClient:
      filepath: "{{ default .Env.DYNAMIC_CONFIG_FILE_PATH "/etc/temporal/config/dynamicconfig/production-sql.yaml" }}"
      pollInterval: "60s"
