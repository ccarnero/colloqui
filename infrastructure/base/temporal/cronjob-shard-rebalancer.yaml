apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-shard-rebalancer
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: shard-rebalancer
# Auto-remediation for the history shard imbalance hazard
# (post-mortem §10.2 / 2026-05-23 stress §3). The remediation itself
# is a `kubectl rollout restart deployment/temporal-history` — the
# same thing the bootstrap script does at deploy time, and the same
# thing a human SRE would do manually if alerted.
#
# WHY A CRONJOB OVER PERIODIC POD-KILLS
# --------------------------------------
# The naive "kill the most-loaded pod every 5 min" CronJob is a
# bad pattern because it acts on weak evidence (instant CPU sample)
# and creates restart churn during legitimate stress bursts. THIS
# CronJob is different:
#
#   1. The decision logic ("is the cluster actually imbalanced?") is
#      OWNED by the `TemporalHistoryShardImbalance` Prometheus alert
#      (`alerts.yaml`) — that alert already has the right guards:
#      `for: 5m` sustained, `total_rate > 10` ops/s, hash-based skew
#      computed across the full window.
#   2. This CronJob is JUST A THIN EXECUTOR of the alert's intent.
#      If the alert is `inactive`, this Job exits in <1s with "no
#      action". The decision and the action are decoupled.
#   3. There is no AlertManager in the platform yet, so we cannot
#      use a webhook receiver. The CronJob is the alternative — it
#      polls the same alert state AlertManager would consume.
#
# Result: if the alert never fires, this Job spends ~5s/2min querying
# Prometheus and exits clean. Only when the alert is genuinely firing
# (5m sustained, >10 ops/s, one pod >75% of load) does it act.
#
# Cooldown enforced in-script: after a successful rollout, refuse to
# trigger another for COOLDOWN_SECONDS (default 900s = 15min). This
# protects against the rate-window contamination bug:
#
#   - `rate(persistence_latency_count[5m])` averages over a 5-min
#     window. Post-restart, the ring is balanced immediately, but the
#     metric's 5-min window still includes pre-restart skewed samples.
#   - Result: the alert stays `firing` for ~5 min AFTER the restart,
#     even though the cluster is already balanced.
#   - Without cooldown, the cron tick at T+2min sees `firing` and
#     restarts AGAIN → restart storm (observed 10x in 54min on the
#     2026-05-24 stress run, dropped SDK throughput by 60%).
#
# 15min cooldown > 5min rate window + buffer. After cooldown the
# metric has rolled forward and represents the post-restart state.
# If skew genuinely persists past cooldown, restart happens — that's
# the second-line defense for a truly broken cluster.
spec:
  # Every 2 min: tight enough that the worst-case mean time to
  # remediate is alert-window (5m) + cron-window (1m avg) + restart
  # (~30s) ≈ 6.5 min total from imbalance start to balanced cluster.
  schedule: "*/2 * * * *"
  # Forbid concurrency: if a previous run is still doing the rollout
  # restart, skip this tick. The next tick will catch up if needed.
  concurrencyPolicy: Forbid
  # Keep only the most recent 3 successful + 3 failed Job records so
  # operators can `kubectl logs` recent runs without etcd bloat.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/component: shard-rebalancer
        spec:
          serviceAccountName: temporal-shard-rebalancer
          restartPolicy: Never
          containers:
            - name: rebalancer
              # Same alpine/k8s image used by the wait-for-schema
              # init containers — bundles kubectl + wget + jq. Pin
              # to a specific patch for version-lock; the schema-
              # wait initContainers are on the same tag so any bump
              # touches both at once.
              image: alpine/k8s:1.31.13
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  PROM="${PROMETHEUS_URL:-http://prometheus:9090}"
                  ALERT="TemporalHistoryShardImbalance"
                  DEPLOY="${TEMPORAL_HISTORY_DEPLOYMENT:-temporal-history}"
                  COOLDOWN="${REBALANCER_COOLDOWN_SECONDS:-900}"

                  # COOLDOWN CHECK — exit early if the deployment was
                  # restarted recently. `kubectl rollout restart`
                  # writes the `kubectl.kubernetes.io/restartedAt`
                  # annotation on `spec.template.metadata`; we read
                  # it and compare against the cooldown window.
                  # Bypasses the rate-window contamination loop (see
                  # the long comment block above).
                  #
                  # We use Python (bundled in alpine/k8s via awscli)
                  # for the ISO 8601 timestamp arithmetic — busybox
                  # `date -d` does NOT support ISO 8601 with timezone
                  # offsets (`-03:00`, `Z`, etc.), which is what
                  # kubectl writes. Python's `datetime.fromisoformat`
                  # handles all three forms (`+TZ`, `-TZ`, `Z`).
                  LAST_RESTART="$(kubectl get deploy/"${DEPLOY}" \
                    -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' \
                    2>/dev/null || true)"
                  if [ -n "${LAST_RESTART}" ]; then
                    # Single-line Python invocation — multi-line breaks
                    # YAML block-scalar indentation. Catches parse errors
                    # at the shell level via `2>/dev/null || echo -1`.
                    AGE_SEC="$(python3 -c "from datetime import datetime, timezone; last = datetime.fromisoformat('${LAST_RESTART}'.replace('Z', '+00:00')); print(int((datetime.now(timezone.utc) - last).total_seconds()))" 2>/dev/null || echo -1)"
                    if [ "${AGE_SEC}" -ge 0 ] && [ "${AGE_SEC}" -lt "${COOLDOWN}" ]; then
                      REMAINING=$(( COOLDOWN - AGE_SEC ))
                      echo "[rebalancer] Last restart ${AGE_SEC}s ago (cooldown=${COOLDOWN}s). ${REMAINING}s remaining — skipping."
                      exit 0
                    fi
                  fi

                  echo "[rebalancer] Polling ${PROM} for alert '${ALERT}' state..."

                  # `/api/v1/alerts` returns ONLY currently firing
                  # alerts (state: 'firing' or 'pending'). If the
                  # alert is not in the list, it's inactive — exit.
                  ALERTS_JSON="$(wget -qO- "${PROM}/api/v1/alerts" 2>&1 || echo '{}')"
                  if [ -z "${ALERTS_JSON}" ] || [ "${ALERTS_JSON}" = "{}" ]; then
                    echo "[rebalancer] FATAL: could not reach Prometheus at ${PROM}"
                    exit 1
                  fi

                  # Parse the alert array. State 'firing' = act.
                  # State 'pending' = wait (the `for: 5m` clause is
                  # still counting down).
                  FIRING_COUNT="$(echo "${ALERTS_JSON}" \
                    | jq -r --arg name "${ALERT}" \
                      '[.data.alerts[]? | select(.labels.alertname == $name and .state == "firing")] | length')"

                  if [ "${FIRING_COUNT}" -eq 0 ]; then
                    echo "[rebalancer] '${ALERT}' is inactive — no action."
                    exit 0
                  fi

                  echo "[rebalancer] '${ALERT}' is FIRING (${FIRING_COUNT} instance(s))."
                  echo "[rebalancer] Firing labels:"
                  echo "${ALERTS_JSON}" \
                    | jq -r --arg name "${ALERT}" \
                      '.data.alerts[]? | select(.labels.alertname == $name and .state == "firing") | "  - " + (.labels | tostring)'

                  # Trigger the rolling restart. This patches
                  # `spec.template.metadata.annotations.kubectl.kubernetes.io/restartedAt`
                  # which causes a graceful rolling update of all
                  # pods in the Deployment. With 2 history pods,
                  # the rollout takes ~60-90s end-to-end.
                  echo "[rebalancer] Triggering: kubectl rollout restart deployment/${DEPLOY}"
                  kubectl rollout restart deployment/"${DEPLOY}"
                  echo "[rebalancer] Waiting for rollout to complete (timeout 5m)..."
                  kubectl rollout status deployment/"${DEPLOY}" --timeout=300s
                  echo "[rebalancer] Rollout complete. Alert should clear within ~1m."
              env:
                # Override targets at the overlay level if needed
                # (e.g., a production overlay might point to a
                # dedicated Prometheus shard).
                - name: PROMETHEUS_URL
                  value: "http://prometheus:9090"
                - name: TEMPORAL_HISTORY_DEPLOYMENT
                  value: "temporal-history"
                # Cooldown between restarts. Must be > the rate
                # window used by the alert (`[5m]`) — otherwise
                # post-restart contamination of the rate metric
                # causes restart-storms (see 2026-05-24 stress §3).
                # 15min = 5m window + 10m safety margin.
                - name: REBALANCER_COOLDOWN_SECONDS
                  value: "900"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
