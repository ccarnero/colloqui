apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-schema-wait
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
# Minimal SA used by the `wait-for-schema` initContainer on every
# Temporal role Deployment (frontend, history, matching, worker). It
# polls the `temporal-schema-setup-<version>` Job until it succeeds
# before the main container starts — guards against the race where
# a server pod tries to read `schema_version` while the Job is still
# applying migrations.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-schema-wait
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
# Read-only on batch Jobs. Locked to verbs needed by `kubectl wait`:
# `get` + `list` for the initial query, `watch` for the long-poll.
# Cannot create, delete, or patch Jobs.
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-schema-wait
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: temporal-schema-wait
subjects:
  - kind: ServiceAccount
    name: temporal-schema-wait
