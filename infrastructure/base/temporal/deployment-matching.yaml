apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-matching
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
    temporal.io/role: matching
# Matching role — dispatches workflow + activity tasks to SDK workers
# (workflow-worker, connector-runtime) over long-poll gRPC. Owns task
# queue partitions via ringpop; like history but on a different
# membership ring with looser locality (a partition migrating mid-
# poll is cheap — at most one re-poll on the worker side).
#
# Sizing: medium. Most CPU is spent serializing/deserializing task
# payloads + matching workers against queues. Memory dominated by
# the per-task-queue partition cache.
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      temporal.io/role: matching
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow-engine
        temporal.io/role: matching
    spec:
      serviceAccountName: temporal-schema-wait
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    temporal.io/role: matching
                topologyKey: kubernetes.io/hostname
      initContainers:
        # See `deployment-frontend.yaml` for the full rationale on
        # why we use `registry.k8s.io/kubectl` (distroless, official,
        # version-pinned) instead of `bitnami/kubectl` (moved to
        # paid Secure Images registry in 2025).
        # Conditional get-then-wait tolerates Job GC (ttl=600s) — see
        # `deployment-frontend.yaml` for the full rationale.
        - name: wait-for-schema
          image: alpine/k8s:1.31.13
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get job/temporal-schema-setup-1-28-4 -o name 2>/dev/null | grep -q .; then
                echo "[wait-for-schema] Job present — waiting for condition=complete (timeout 600s)..."
                kubectl wait --for=condition=complete --timeout=600s \
                  job/temporal-schema-setup-1-28-4
                echo "[wait-for-schema] OK: Job completed."
              else
                echo "[wait-for-schema] Job not present (ttl GC'd); schema must already be applied."
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: temporal
          image: temporalio/server:1.28.4
          ports:
            - name: grpc
              containerPort: 7235
              protocol: TCP
            - name: membership
              containerPort: 6935
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICES
              value: "matching"
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: PROMETHEUS_ENDPOINT
              value: "0.0.0.0:9090"
            - name: PUBLIC_FRONTEND_ADDRESS
              value: "temporal:7233"
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: DBNAME
              value: "temporal"
            - name: VISIBILITY_DBNAME
              value: "temporal_visibility"
            - name: VISIBILITY_DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: "postgres-temporal-rw"
            - name: VISIBILITY_POSTGRES_SEEDS
              value: "postgres-temporal-visibility-rw"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: password
            - name: VISIBILITY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: username
            - name: VISIBILITY_POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: password
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "/etc/temporal/config/dynamicconfig/production-sql.yaml"
          volumeMounts:
            - name: config-template
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
              readOnly: true
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-template
          configMap:
            name: temporal-server-config
            items:
              - key: config_template.yaml
                path: config_template.yaml
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
