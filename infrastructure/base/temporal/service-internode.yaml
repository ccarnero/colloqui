apiVersion: v1
kind: Service
metadata:
  name: temporal-internode
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
# Headless Service that gives every Temporal pod a stable per-pod DNS
# record under `<pod-hash>.temporal-internode.<ns>.svc.cluster.local`.
#
# Why this exists when ringpop already discovers peers via Postgres
# (`cluster_membership` table): the per-pod DNS is a debugging aid +
# a stable handle for `kubectl exec` and `tctl admin cluster
# get-membership` smoke checks. Membership traffic itself flows pod-IP
# → pod-IP on the membership ports below; no kube-proxy hop.
#
# Published ports mirror the rpc + membership ports declared in
# `configmap-docker.yaml` services.{frontend,history,matching,worker}.
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: frontend-grpc
      port: 7233
      targetPort: 7233
      protocol: TCP
    - name: frontend-http
      port: 7243
      targetPort: 7243
      protocol: TCP
    - name: history-grpc
      port: 7234
      targetPort: 7234
      protocol: TCP
    - name: matching-grpc
      port: 7235
      targetPort: 7235
      protocol: TCP
    - name: worker-grpc
      port: 7239
      targetPort: 7239
      protocol: TCP
    - name: frontend-memb
      port: 6933
      targetPort: 6933
      protocol: TCP
    - name: history-memb
      port: 6934
      targetPort: 6934
      protocol: TCP
    - name: matching-memb
      port: 6935
      targetPort: 6935
      protocol: TCP
    - name: worker-memb
      port: 6939
      targetPort: 6939
      protocol: TCP
