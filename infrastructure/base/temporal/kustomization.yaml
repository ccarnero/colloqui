apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single-node dev topology: one `temporalio/auto-setup` pod runs all
# 4 internal services (frontend, history, matching, worker) in one
# process. Reverts the 4-role HA split introduced for stress testing
# (see DOCS/runbooks/temporal-ha-migration.md) — dev mode does not
# need HA topology.
#
# Recovered from git commit e05c543 (pre-HA single Deployment),
# reconciled with the current postgres-temporal DB env/secret layout.
resources:
  # Dynamic config mount (used by auto-setup to load dynamic config file).
  - configmap-dynamic-config.yaml
  # Namespace bootstrap: registers 'default' namespace + TenantId search
  # attribute after the server is SERVING. auto-setup creates 'default'
  # but does NOT register custom search attributes, so this Job is still
  # required. It polls the frontend gRPC independently — no RBAC or
  # schema-wait dependency.
  - job-namespace-bootstrap.yaml
  # Services. `temporal` (service-frontend.yaml) preserves the legacy
  # name so all clients need no env-var change.
  - service-frontend.yaml
  - service-metrics.yaml
  # Single auto-setup Deployment.
  - deployment-autosetup.yaml
