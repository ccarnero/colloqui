apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-history
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
    temporal.io/role: history
# History role — owns the 16 shards (`numHistoryShards` in
# `configmap-docker.yaml`). Stateful by virtue of ringpop ownership:
# each shard is exclusively claimed by one history pod at a time.
# This is the HOT path for Temporal — every `UpdateWorkflowExecution`,
# `RecordActivityTask*`, `update-wf-execution` hits a history pod
# first, then Postgres.
#
# Replicas tuned to 3 (bumped from 2 on 2026-05-24 after the stress
# §3 root-cause). Rationale:
#
#   - 16 shards / 3 pods = 5-6 shards per pod (vs 8/8 with 2 pods)
#   - Max possible skew under ringpop hash imbalance: 6/5/5 = 37.5%
#     ownership concentration. STRUCTURALLY below the 75% threshold of
#     `TemporalHistoryShardImbalance` alert → the auto-healer restart
#     storm (10 restarts in 54 min observed on 2026-05-24) becomes
#     impossible by construction.
#   - Per-pod CPU pressure halves: each pod processes ~5 shards × queue
#     workload instead of ~8. Single-pod saturation under stress went
#     from 3+ CPU at peak (2-pod setup) to ~1.5-2 CPU at peak (3-pod).
#   - Overlay total CPU budget unchanged: where local-base was 2 ×
#     {req 500m, lim 3} = 1 CPU req / 6 CPU lim total, this becomes
#     3 × {req 350m, lim 2} = 1.05 CPU req / 6 CPU lim total.
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      temporal.io/role: history
  strategy:
    # Rolling 1-at-a-time. Avoid surge because every new history pod
    # joining the ring triggers a shard rebalance — surge would
    # rebalance twice (new pod up, old pod down) per replica.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow-engine
        temporal.io/role: history
    spec:
      serviceAccountName: temporal-schema-wait
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    temporal.io/role: history
                topologyKey: kubernetes.io/hostname
      initContainers:
        # See `deployment-frontend.yaml` for the full rationale on
        # why we use `registry.k8s.io/kubectl` (distroless, official,
        # version-pinned) instead of `bitnami/kubectl` (moved to
        # paid Secure Images registry in 2025).
        # Conditional get-then-wait tolerates Job GC (ttl=600s) — see
        # `deployment-frontend.yaml` for the full rationale.
        - name: wait-for-schema
          image: alpine/k8s:1.31.13
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get job/temporal-schema-setup-1-28-4 -o name 2>/dev/null | grep -q .; then
                echo "[wait-for-schema] Job present — waiting for condition=complete (timeout 600s)..."
                kubectl wait --for=condition=complete --timeout=600s \
                  job/temporal-schema-setup-1-28-4
                echo "[wait-for-schema] OK: Job completed."
              else
                echo "[wait-for-schema] Job not present (ttl GC'd); schema must already be applied."
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: temporal
          image: temporalio/server:1.28.4
          ports:
            - name: grpc
              containerPort: 7234
              protocol: TCP
            - name: membership
              containerPort: 6934
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICES
              value: "history"
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: PROMETHEUS_ENDPOINT
              value: "0.0.0.0:9090"
            - name: PUBLIC_FRONTEND_ADDRESS
              value: "temporal:7233"
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: DBNAME
              value: "temporal"
            - name: VISIBILITY_DBNAME
              value: "temporal_visibility"
            - name: VISIBILITY_DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: "postgres-temporal-rw"
            - name: VISIBILITY_POSTGRES_SEEDS
              value: "postgres-temporal-visibility-rw"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: password
            - name: VISIBILITY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: username
            - name: VISIBILITY_POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: password
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "/etc/temporal/config/dynamicconfig/production-sql.yaml"
          volumeMounts:
            - name: config-template
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
              readOnly: true
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
          # History is the heaviest role: it serves the shard queue
          # processors (timer, transfer, visibility) plus the
          # `UpdateWorkflowExecution` write path. Post-mortem §10.2
          # showed a single saturated pod hitting 1248m CPU + 12 890
          # `context deadline exceeded` in 5 min with the original
          # 2-pod setup serving all 16 shards on one pod.
          #
          # 3-pod base (2026-05-24): each pod owns 5-6 shards. Per-pod
          # saturation under stress is ~1.5-2 CPU peak. 750m req / 3
          # CPU lim gives 2× headroom over peak observed throughput
          # while keeping aggregate budget at 2.25 CPU req / 9 CPU lim
          # (vs the old 2-pod baseline of 2 req / 8 lim — slight bump
          # to absorb the 3rd replica's persistent connection pool).
          resources:
            requests:
              cpu: "750m"
              memory: 1500Mi
            limits:
              cpu: "3"
              memory: 3Gi
          # History needs longer startup than frontend because shard
          # ownership claim requires SQL roundtrips per shard. 90 ×
          # 5s = 7.5 min for cold cluster boot.
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 90
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-template
          configMap:
            name: temporal-server-config
            items:
              - key: config_template.yaml
                path: config_template.yaml
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
