# Single metrics Service for the temporal auto-setup pod.
#
# Post-HA collapse: the 4-role HA deployment (frontend, history, matching,
# worker as separate Deployments) was replaced with a single
# `temporalio/auto-setup` Deployment named `temporal` that carries both
# labels:
#   app.kubernetes.io/name=temporal
#   temporal.io/role=frontend
#
# The history/matching/worker metrics Services that previously existed here
# were deleted — those workloads no longer exist.
#
# This headless Service lets an operator curl the metrics endpoint directly:
#
#   kubectl run -it --rm tmp --image=curlimages/curl:8.10.1 \
#     --restart=Never -- curl temporal-metrics:9090/metrics
#
# Prometheus scrapes via pod-level kubernetes_sd (see
# infrastructure/base/observability/prometheus/configmap.yaml job
# `temporal-server`) rather than through this Service, so removing the
# per-role Services does not affect metric collection.
apiVersion: v1
kind: Service
metadata:
  name: temporal-metrics
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
    temporal.io/role: frontend
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: temporal
    temporal.io/role: frontend
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
