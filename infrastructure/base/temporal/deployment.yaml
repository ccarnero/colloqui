apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
spec:
  # 2 replicas under the SAME `temporalio/auto-setup` image. The setup
  # script is idempotent (schema_version row-level lock serializes
  # concurrent migrations); transient `tuple update concurrently` PG
  # errors are retried internally. PodAntiAffinity below spreads the
  # replicas across nodes when capacity allows. Local/orbstack overlays
  # patch this back to 1 to save resources.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  strategy:
    # RollingUpdate with maxUnavailable: 0 keeps the gRPC frontend
    # reachable during rollouts. With 2 replicas and surge=1 this
    # rolls one pod at a time without ever dropping below 2 ready.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow-engine
    spec:
      terminationGracePeriodSeconds: 30
      # Spread temporal pods across nodes when possible. `preferred`
      # so single-node clusters (orbstack/kind) still schedule both
      # replicas on the same node without blocking.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                topologyKey: kubernetes.io/hostname
      containers:
        - name: temporal
          # Pinned to a specific patch (NOT `:latest`) so schema migrations
          # of the bundled `auto-setup` script don't run unexpectedly on
          # pod restart after an upstream image push. Bump intentionally
          # in a separate change.
          image: temporalio/auto-setup:1.28.4
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
            - name: web
              containerPort: 8233
              protocol: TCP
            # Prometheus metrics endpoint exposed by Temporal Server when
            # PROMETHEUS_ENDPOINT is set. Scraped by the
            # `temporal-server` job in
            # `infrastructure/base/observability/prometheus/configmap.yaml`.
            # Auto-setup runs all 4 services in one process so a single
            # endpoint exports `temporal_*` metrics for frontend, history,
            # matching and internal-worker — `service_name` label
            # disambiguates them.
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            # Bind Prometheus exporter on all interfaces. Without this
            # Temporal binds metrics on the gRPC interface IP only and
            # cluster scrapes silently miss everything.
            - name: PROMETHEUS_ENDPOINT
              value: "0.0.0.0:9090"
            # History shard count. Default is 4 — too low for stress
            # tests at 200+ workflow starts/sec because each shard
            # serializes its history queue. 16 shards gives ~4×
            # parallelism on persistence writes without exploding the
            # memory footprint.
            #
            # CRITICAL: changing this value AFTER schema bootstrap
            # leaves orphaned history (workflows can route to the
            # wrong shard). Only safe on a clean DB. The CNPG split
            # cutover-in-cold provided that clean slate.
            - name: NUM_HISTORY_SHARDS
              value: "16"
            # Force temporal to bind on all interfaces (0.0.0.0) instead of
            # auto-detecting the pod IP via 'hostname -I'. Without this, in
            # dual-stack clusters (e.g. OrbStack) the auto-setup script picks
            # the IPv6 pod address as BIND_ON_IP, making gRPC unreachable via
            # IPv4 — causing all TCP health probes to fail permanently.
            - name: BIND_ON_IP
              value: "0.0.0.0"
            # Credentials for the dedicated `postgres-temporal` CNPG cluster
            # (default datasource — `executions`, `history_node`, `tasks`,
            # `queue_messages`, etc.). The `temporal` role is created by
            # CNPG via `managed.roles` with `createdb: true` so that
            # auto-setup can run the schema migrations on first boot.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: password
            # CNPG-generated rw service: always points to the current primary.
            - name: POSTGRES_SEEDS
              value: "postgres-temporal-rw"
            # Visibility datasource: split out of the default cluster in
            # the 2026-05-22 stress-test remediation (see
            # `post-mortem/POST-MORTEM.md` §P0.2 and
            # `DOCS/RUNBOOK-TEMPORAL-VISIBILITY-SPLIT.md`).
            # `temporalio/auto-setup` honours `VISIBILITY_POSTGRES_*` to
            # route `temporal_visibility` to a different host/credentials.
            # Cutover requires the visibility cluster to be empty — see
            # the runbook for cold (drop+rebootstrap) and hot
            # (pg_dump+restore) paths.
            - name: VISIBILITY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: username
            - name: VISIBILITY_POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: password
            - name: VISIBILITY_POSTGRES_SEEDS
              value: "postgres-temporal-visibility-rw"
            - name: VISIBILITY_DB_PORT
              value: "5432"
            # Explicit DB names: auto-setup defaults to `temporal` /
            # `temporal_visibility` but pinning them avoids drift if upstream
            # ever changes the defaults.
            - name: DBNAME
              value: "temporal"
            - name: VISIBILITY_DBNAME
              value: "temporal_visibility"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "config/dynamicconfig/development-sql.yaml"
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
          # Stress-grade sizing for the all-in-one auto-setup container
          # (frontend + history + matching + internal-worker in one
          # process). With 16 history shards and HA, persistence layer
          # is the gating factor — give each replica enough CPU to
          # match CNPG IO and enough memory for the workflow cache.
          # Local/orbstack overlays may scale this down.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          # startupProbe protects the container during auto-setup (DB migrations).
          # On first boot, temporalio/auto-setup can take 2-4 minutes before
          # port 7233 is available. 60 × 5s = 5 minutes maximum startup window.
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
