apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow-engine
    temporal.io/role: worker
# Internal worker role — runs Temporal's SYSTEM workflows (replication,
# scanner, parent-close, archival, etc.). NOT to be confused with our
# `workflow-worker` Knative service, which polls user task queues.
#
# Lightest of the four roles in terms of throughput. 2 replicas for
# HA only — system workflows have no need for parallelism beyond
# failover.
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      temporal.io/role: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow-engine
        temporal.io/role: worker
    spec:
      serviceAccountName: temporal-schema-wait
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    temporal.io/role: worker
                topologyKey: kubernetes.io/hostname
      initContainers:
        # See `deployment-frontend.yaml` for the full rationale on
        # why we use `registry.k8s.io/kubectl` (distroless, official,
        # version-pinned) instead of `bitnami/kubectl` (moved to
        # paid Secure Images registry in 2025).
        # Conditional get-then-wait tolerates Job GC (ttl=600s) — see
        # `deployment-frontend.yaml` for the full rationale.
        - name: wait-for-schema
          image: alpine/k8s:1.31.13
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get job/temporal-schema-setup-1-28-4 -o name 2>/dev/null | grep -q .; then
                echo "[wait-for-schema] Job present — waiting for condition=complete (timeout 600s)..."
                kubectl wait --for=condition=complete --timeout=600s \
                  job/temporal-schema-setup-1-28-4
                echo "[wait-for-schema] OK: Job completed."
              else
                echo "[wait-for-schema] Job not present (ttl GC'd); schema must already be applied."
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: temporal
          image: temporalio/server:1.28.4
          ports:
            - name: grpc
              containerPort: 7239
              protocol: TCP
            - name: membership
              containerPort: 6939
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: SERVICES
              value: "worker"
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: PROMETHEUS_ENDPOINT
              value: "0.0.0.0:9090"
            - name: PUBLIC_FRONTEND_ADDRESS
              value: "temporal:7233"
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: DBNAME
              value: "temporal"
            - name: VISIBILITY_DBNAME
              value: "temporal_visibility"
            - name: VISIBILITY_DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: "postgres-temporal-rw"
            - name: VISIBILITY_POSTGRES_SEEDS
              value: "postgres-temporal-visibility-rw"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-credentials
                  key: password
            - name: VISIBILITY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: username
            - name: VISIBILITY_POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-temporal-visibility-credentials
                  key: password
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "/etc/temporal/config/dynamicconfig/production-sql.yaml"
          volumeMounts:
            - name: config-template
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
              readOnly: true
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
          # Smallest of the four — system workflows aren't bandwidth-
          # heavy. Bursts (archival, scanner) covered by the limit.
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # The internal `worker` role is the odd one out among the
          # four roles: it does NOT open a gRPC server on its declared
          # `services.worker.rpc.grpcPort` (7239) — that port is
          # reserved in config but never bound. The worker is a pure
          # SDK CLIENT against the frontend (it polls system task
          # queues like `temporal-sys-tq-scanner-taskqueue-0`). The
          # only listener it actually opens, besides ringpop on
          # membership :6939, is the prometheus exporter on :9090
          # (mandatory because we set PROMETHEUS_ENDPOINT). So we
          # probe that — successful HTTP GET on /metrics means the
          # process is alive AND the metrics exporter (which is the
          # last init step on every role) is up.
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-template
          configMap:
            name: temporal-server-config
            items:
              - key: config_template.yaml
                path: config_template.yaml
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
