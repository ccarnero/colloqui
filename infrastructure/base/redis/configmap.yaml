apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no

    # Standalone mode for single-node dev. Cluster mode dropped:
    # no cluster-enabled, no nodes.conf, no cluster-bus port.
    cluster-enabled no

    dir /data

    # Pure cache mode: no persistence
    save ""
    appendonly no

    # Memory management.
    # Headroom for process overhead, client buffers, slab fragmentation.
    maxmemory 384mb
    maxmemory-policy allkeys-lru

    # Performance
    tcp-backlog 511
    tcp-keepalive 300
    timeout 0

    # Disable slow-log overhead in production
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # Lazy freeing for non-blocking deletes
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
