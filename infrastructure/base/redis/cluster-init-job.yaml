apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cluster-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cluster-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: cluster-init
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          # Idempotent: ping-loop waits for all 6 nodes, then checks
          # cluster_state:ok before issuing CLUSTER CREATE. Re-running
          # the Job on an already-initialized cluster is a no-op.
          args:
            - |
              set -eu
              NODES="redis-0 redis-1 redis-2 redis-3 redis-4 redis-5"
              DOMAIN="redis-headless"

              echo "waiting for all 6 redis nodes to respond to PING..."
              for n in ${NODES}; do
                attempt=0
                until redis-cli -h "${n}.${DOMAIN}" -p 6379 ping 2>/dev/null \
                  | grep -q PONG; do
                  attempt=$((attempt+1))
                  if [ ${attempt} -ge 90 ]; then
                    echo "ERROR: ${n}.${DOMAIN} did not respond after 180s"
                    exit 1
                  fi
                  echo "waiting ${n}.${DOMAIN} (attempt ${attempt})"
                  sleep 2
                done
                echo "${n}.${DOMAIN} OK"
              done

              echo "checking current cluster state..."
              INFO=$(redis-cli -h "redis-0.${DOMAIN}" -p 6379 cluster info \
                2>/dev/null || true)
              if echo "${INFO}" | grep -q "cluster_state:ok"; then
                ASSIGNED=$(echo "${INFO}" \
                  | grep "cluster_slots_assigned" \
                  | tr -d "\r")
                echo "cluster already initialized (${ASSIGNED}); nothing to do"
                exit 0
              fi

              echo "forming cluster (3 masters + 3 replicas)..."
              redis-cli --cluster create \
                "redis-0.${DOMAIN}:6379" \
                "redis-1.${DOMAIN}:6379" \
                "redis-2.${DOMAIN}:6379" \
                "redis-3.${DOMAIN}:6379" \
                "redis-4.${DOMAIN}:6379" \
                "redis-5.${DOMAIN}:6379" \
                --cluster-replicas 1 \
                --cluster-yes

              echo "verifying cluster..."
              sleep 2
              redis-cli -h "redis-0.${DOMAIN}" -p 6379 cluster info
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
