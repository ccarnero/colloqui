apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  clusterIP: None
  # Required during bootstrap: cluster-init Job needs to resolve every
  # pod (redis-0..redis-5.redis-headless) BEFORE the first CLUSTER MEET
  # makes them ready. Without this, headless DNS only returns Ready
  # endpoints and the init script deadlocks waiting for itself.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: cluster-bus
      port: 16379
      targetPort: cluster-bus
      protocol: TCP
