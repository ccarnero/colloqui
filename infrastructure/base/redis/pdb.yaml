apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  # 3 masters + 3 replicas: tolerate the loss of exactly 1 pod at a
  # time. Losing 2 from the same shard would leave that slot range
  # unavailable; maxUnavailable: 1 lets a node drain proceed serially
  # while preserving cluster_state:ok.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
