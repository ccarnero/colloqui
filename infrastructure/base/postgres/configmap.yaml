apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432

    # Connection tuning
    max_connections = 100

    # Memory
    shared_buffers = 128MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    effective_cache_size = 256MB

    # WAL
    wal_level = replica
    max_wal_size = 256MB
    min_wal_size = 64MB

    # Checkpoints
    checkpoint_completion_target = 0.9

    # Logging
    log_min_duration_statement = 500
    log_connections = on
    log_disconnections = on
    log_lock_waits = on

    # Performance
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 100

  init.sql: |
    CREATE TABLE IF NOT EXISTS events (
      id          TEXT        PRIMARY KEY,
      type        TEXT        NOT NULL,
      payload     JSONB       NOT NULL DEFAULT '{}',
      metadata    JSONB       NOT NULL DEFAULT '{}',
      subject     TEXT        NOT NULL DEFAULT '',
      created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_events_type ON events (type);
    CREATE INDEX IF NOT EXISTS idx_events_created_at ON events (created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_events_type_created ON events (type, created_at DESC);

    CREATE TABLE IF NOT EXISTS metrics (
      id          TEXT             PRIMARY KEY,
      source      TEXT             NOT NULL,
      name        TEXT             NOT NULL,
      value       DOUBLE PRECISION NOT NULL DEFAULT 0,
      tags        JSONB            NOT NULL DEFAULT '{}',
      metadata    JSONB            NOT NULL DEFAULT '{}',
      created_at  TIMESTAMPTZ      NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_metrics_source ON metrics (source);
    CREATE INDEX IF NOT EXISTS idx_metrics_name ON metrics (name);
    CREATE INDEX IF NOT EXISTS idx_metrics_source_created ON metrics (source, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_metrics_created_at ON metrics (created_at DESC);

    CREATE TABLE IF NOT EXISTS platform_users (
      id            TEXT        PRIMARY KEY,
      email         TEXT        UNIQUE NOT NULL,
      password_hash TEXT        NOT NULL,
      role          TEXT        NOT NULL DEFAULT 'operator',
      is_active     BOOLEAN     NOT NULL DEFAULT true,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_platform_users_email ON platform_users (email);

    CREATE TABLE IF NOT EXISTS api_clients (
      id                 TEXT        PRIMARY KEY,
      client_id          TEXT        UNIQUE NOT NULL,
      client_secret_hash TEXT        NOT NULL,
      name               TEXT        NOT NULL,
      scope              TEXT        NOT NULL,
      is_active          BOOLEAN     NOT NULL DEFAULT true,
      created_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at         TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_api_clients_client_id ON api_clients (client_id);
    CREATE INDEX IF NOT EXISTS idx_api_clients_scope ON api_clients (scope);

    CREATE TABLE IF NOT EXISTS public_routes (
      id            TEXT        PRIMARY KEY,
      method        TEXT        NOT NULL,
      path_pattern  TEXT        NOT NULL,
      scope         TEXT        NOT NULL,
      environment   TEXT        NOT NULL,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_public_routes_scope_env ON public_routes (scope, environment);
    CREATE INDEX IF NOT EXISTS idx_public_routes_env ON public_routes (environment);

    CREATE TABLE IF NOT EXISTS registered_services (
      id                  TEXT        PRIMARY KEY,
      tenant_id           TEXT        NOT NULL,
      name                TEXT        NOT NULL,
      image               TEXT        NOT NULL,
      port                INTEGER     NOT NULL DEFAULT 3000,
      min_scale           INTEGER     NOT NULL DEFAULT 0,
      max_scale           INTEGER     NOT NULL DEFAULT 10,
      concurrency_target  INTEGER     NOT NULL DEFAULT 100,
      env_vars            JSONB       NOT NULL DEFAULT '{}',
      status              TEXT        NOT NULL DEFAULT 'pending',
      knative_name        TEXT,
      namespace           TEXT,
      created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_reg_svc_tenant ON registered_services (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_reg_svc_status ON registered_services (status);

    CREATE TABLE IF NOT EXISTS service_routes (
      id              TEXT        PRIMARY KEY,
      service_id      TEXT        NOT NULL REFERENCES registered_services(id) ON DELETE CASCADE,
      path_prefix     TEXT        NOT NULL,
      methods         TEXT[]      NOT NULL DEFAULT '{GET,POST,PUT,PATCH,DELETE}',
      is_public       BOOLEAN     NOT NULL DEFAULT false,
      strip_prefix    BOOLEAN     NOT NULL DEFAULT true,
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(service_id, path_prefix)
    );

    CREATE INDEX IF NOT EXISTS idx_svc_routes_service ON service_routes (service_id);

    CREATE TABLE IF NOT EXISTS canary_deployments (
      id              TEXT        PRIMARY KEY,
      service_id      TEXT        NOT NULL REFERENCES registered_services(id) ON DELETE CASCADE,
      stable_revision TEXT        NOT NULL,
      canary_revision TEXT        NOT NULL,
      canary_percent  INTEGER     NOT NULL DEFAULT 0 CHECK (canary_percent BETWEEN 0 AND 100),
      status          TEXT        NOT NULL DEFAULT 'progressing',
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_canary_service ON canary_deployments (service_id);

    CREATE TABLE IF NOT EXISTS tenants (
      id            TEXT        PRIMARY KEY,
      name          TEXT        UNIQUE NOT NULL,
      configuration JSONB       NOT NULL DEFAULT '{}',
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      provisioning_status         TEXT        NOT NULL DEFAULT 'pending',
      provisioning_error          TEXT,
      provisioning_started_at     TIMESTAMPTZ,
      provisioning_completed_at   TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_tenants_name ON tenants (name);
    ALTER TABLE tenants ADD COLUMN IF NOT EXISTS provisioning_status
      TEXT NOT NULL DEFAULT 'ready';
    ALTER TABLE tenants ADD COLUMN IF NOT EXISTS provisioning_error TEXT;
    ALTER TABLE tenants ADD COLUMN IF NOT EXISTS provisioning_started_at TIMESTAMPTZ;
    ALTER TABLE tenants ADD COLUMN IF NOT EXISTS provisioning_completed_at TIMESTAMPTZ;
    ALTER TABLE tenants ALTER COLUMN provisioning_status SET DEFAULT 'pending';
    CREATE INDEX IF NOT EXISTS idx_tenants_provisioning_incomplete
      ON tenants (provisioning_status)
      WHERE provisioning_status IN ('pending', 'provisioning', 'failed');

    CREATE TABLE IF NOT EXISTS tenant_roles (
      id          TEXT        PRIMARY KEY,
      tenant_id   TEXT        NOT NULL,
      name        VARCHAR(64) NOT NULL,
      description TEXT,
      is_system   BOOLEAN     NOT NULL DEFAULT false,
      is_active   BOOLEAN     NOT NULL DEFAULT true,
      created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_tenant_roles_tenant ON tenant_roles (tenant_id);

    CREATE TABLE IF NOT EXISTS tenant_role_permissions (
      id          TEXT        PRIMARY KEY,
      role_id     TEXT        NOT NULL REFERENCES tenant_roles(id) ON DELETE CASCADE,
      resource    VARCHAR(64) NOT NULL,
      action      VARCHAR(32) NOT NULL,
      created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(role_id, resource, action)
    );

    CREATE INDEX IF NOT EXISTS idx_tenant_role_permissions_role ON tenant_role_permissions (role_id);

    CREATE TABLE IF NOT EXISTS tenant_users (
      id            TEXT        PRIMARY KEY,
      tenant_id     TEXT        NOT NULL,
      email         TEXT        NOT NULL,
      password_hash TEXT        NOT NULL,
      role_id       TEXT        NOT NULL REFERENCES tenant_roles(id),
      display_name  TEXT,
      is_active     BOOLEAN     NOT NULL DEFAULT true,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, email)
    );

    CREATE INDEX IF NOT EXISTS idx_tenant_users_tenant ON tenant_users (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_tenant_users_email ON tenant_users (email);
    CREATE INDEX IF NOT EXISTS idx_tenant_users_role ON tenant_users (role_id);

    -- Workflow definitions and executions moved to per-tenant
    -- Postgres instances (see `@yoizen/shared` WORKFLOW_SCHEMA_SQL and
    -- tenant-service `init.sql`). Any leftover tables in an existing
    -- platform DB are dropped on bootstrap as a fresh cut-over.
    DROP TABLE IF EXISTS workflow_executions CASCADE;
    DROP TABLE IF EXISTS workflow_definitions CASCADE;

    -- HTTP adapters and endpoints moved to per-tenant Postgres
    -- instances (see `@yoizen/shared` ADAPTER_SCHEMA_SQL and
    -- tenant-service `init.sql`). Any leftover tables in an existing
    -- platform DB are dropped on bootstrap as a fresh cut-over.
    DROP TABLE IF EXISTS adapter_endpoints CASCADE;
    DROP TABLE IF EXISTS http_adapters CASCADE;

    -- Channel Service tables
    CREATE TABLE IF NOT EXISTS channel_accounts (
      id                TEXT        PRIMARY KEY,
      tenant_id         TEXT        NOT NULL,
      channel           TEXT        NOT NULL CHECK (channel IN ('whatsapp', 'instagram')),
      provider          TEXT        NOT NULL DEFAULT 'meta',
      name              TEXT        NOT NULL,
      external_id       TEXT        NOT NULL,
      phone_number_id   TEXT,
      waba_id           TEXT,
      ig_user_id        TEXT,
      access_token      TEXT        NOT NULL,
      app_id            TEXT,
      app_secret        TEXT,
      verify_token      TEXT,
      is_active         BOOLEAN     NOT NULL DEFAULT true,
      created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, channel, external_id)
    );

    CREATE INDEX IF NOT EXISTS idx_channel_accounts_tenant
      ON channel_accounts (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_channel_accounts_channel
      ON channel_accounts (tenant_id, channel);
    CREATE INDEX IF NOT EXISTS idx_channel_accounts_external
      ON channel_accounts (external_id);

    CREATE TABLE IF NOT EXISTS channel_messages (
      id                  TEXT        PRIMARY KEY,
      tenant_id           TEXT        NOT NULL,
      account_id          TEXT        NOT NULL REFERENCES channel_accounts(id) ON DELETE CASCADE,
      channel             TEXT        NOT NULL,
      provider            TEXT        NOT NULL DEFAULT 'meta',
      direction           TEXT        NOT NULL CHECK (direction IN ('inbound', 'outbound')),
      provider_message_id TEXT,
      contact_id          TEXT        NOT NULL,
      message_type        TEXT        NOT NULL,
      content             JSONB       NOT NULL DEFAULT '{}',
      status              TEXT        NOT NULL DEFAULT 'received',
      raw_payload         JSONB,
      created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, provider_message_id)
    );

    CREATE INDEX IF NOT EXISTS idx_channel_messages_tenant
      ON channel_messages (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_channel_messages_account
      ON channel_messages (account_id);
    CREATE INDEX IF NOT EXISTS idx_channel_messages_contact
      ON channel_messages (tenant_id, contact_id);
    CREATE INDEX IF NOT EXISTS idx_channel_messages_created
      ON channel_messages (tenant_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS auto_reply_rules (
      id              TEXT        PRIMARY KEY,
      tenant_id       TEXT        NOT NULL,
      account_id      TEXT        NOT NULL REFERENCES channel_accounts(id) ON DELETE CASCADE,
      channel         TEXT        NOT NULL,
      trigger_pattern TEXT        NOT NULL,
      reply_text      TEXT        NOT NULL,
      is_active       BOOLEAN     NOT NULL DEFAULT true,
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_auto_reply_rules_account
      ON auto_reply_rules (account_id);
    CREATE INDEX IF NOT EXISTS idx_auto_reply_rules_tenant
      ON auto_reply_rules (tenant_id);
