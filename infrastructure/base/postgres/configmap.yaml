apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432

    # Connection tuning
    max_connections = 100

    # Memory
    shared_buffers = 128MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    effective_cache_size = 256MB

    # WAL
    wal_level = replica
    max_wal_size = 256MB
    min_wal_size = 64MB

    # Checkpoints
    checkpoint_completion_target = 0.9

    # Logging
    log_min_duration_statement = 500
    log_connections = on
    log_disconnections = on
    log_lock_waits = on

    # Performance
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 100

  init.sql: |
    CREATE TABLE IF NOT EXISTS events (
      id          TEXT        PRIMARY KEY,
      type        TEXT        NOT NULL,
      payload     JSONB       NOT NULL DEFAULT '{}',
      metadata    JSONB       NOT NULL DEFAULT '{}',
      subject     TEXT        NOT NULL DEFAULT '',
      created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_events_type ON events (type);
    CREATE INDEX IF NOT EXISTS idx_events_created_at ON events (created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_events_type_created ON events (type, created_at DESC);

    CREATE TABLE IF NOT EXISTS metrics (
      id          TEXT             PRIMARY KEY,
      source      TEXT             NOT NULL,
      name        TEXT             NOT NULL,
      value       DOUBLE PRECISION NOT NULL DEFAULT 0,
      tags        JSONB            NOT NULL DEFAULT '{}',
      metadata    JSONB            NOT NULL DEFAULT '{}',
      created_at  TIMESTAMPTZ      NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_metrics_source ON metrics (source);
    CREATE INDEX IF NOT EXISTS idx_metrics_name ON metrics (name);
    CREATE INDEX IF NOT EXISTS idx_metrics_source_created ON metrics (source, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_metrics_created_at ON metrics (created_at DESC);

    CREATE TABLE IF NOT EXISTS platform_users (
      id            TEXT        PRIMARY KEY,
      email         TEXT        UNIQUE NOT NULL,
      password_hash TEXT        NOT NULL,
      role          TEXT        NOT NULL DEFAULT 'operator',
      is_active     BOOLEAN     NOT NULL DEFAULT true,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_platform_users_email ON platform_users (email);

    CREATE TABLE IF NOT EXISTS api_clients (
      id                 TEXT        PRIMARY KEY,
      client_id          TEXT        UNIQUE NOT NULL,
      client_secret_hash TEXT        NOT NULL,
      name               TEXT        NOT NULL,
      scope              TEXT        NOT NULL,
      is_active          BOOLEAN     NOT NULL DEFAULT true,
      created_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at         TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_api_clients_client_id ON api_clients (client_id);
    CREATE INDEX IF NOT EXISTS idx_api_clients_scope ON api_clients (scope);

    CREATE TABLE IF NOT EXISTS public_routes (
      id            TEXT        PRIMARY KEY,
      method        TEXT        NOT NULL,
      path_pattern  TEXT        NOT NULL,
      scope         TEXT        NOT NULL,
      environment   TEXT        NOT NULL,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_public_routes_scope_env ON public_routes (scope, environment);
    CREATE INDEX IF NOT EXISTS idx_public_routes_env ON public_routes (environment);

    CREATE TABLE IF NOT EXISTS registered_services (
      id                  TEXT        PRIMARY KEY,
      tenant_id           TEXT        NOT NULL,
      name                TEXT        NOT NULL,
      image               TEXT        NOT NULL,
      port                INTEGER     NOT NULL DEFAULT 3000,
      min_scale           INTEGER     NOT NULL DEFAULT 0,
      max_scale           INTEGER     NOT NULL DEFAULT 10,
      concurrency_target  INTEGER     NOT NULL DEFAULT 100,
      env_vars            JSONB       NOT NULL DEFAULT '{}',
      status              TEXT        NOT NULL DEFAULT 'pending',
      knative_name        TEXT,
      namespace           TEXT,
      created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_reg_svc_tenant ON registered_services (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_reg_svc_status ON registered_services (status);

    CREATE TABLE IF NOT EXISTS service_routes (
      id              TEXT        PRIMARY KEY,
      service_id      TEXT        NOT NULL REFERENCES registered_services(id) ON DELETE CASCADE,
      path_prefix     TEXT        NOT NULL,
      methods         TEXT[]      NOT NULL DEFAULT '{GET,POST,PUT,PATCH,DELETE}',
      is_public       BOOLEAN     NOT NULL DEFAULT false,
      strip_prefix    BOOLEAN     NOT NULL DEFAULT true,
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(service_id, path_prefix)
    );

    CREATE INDEX IF NOT EXISTS idx_svc_routes_service ON service_routes (service_id);

    CREATE TABLE IF NOT EXISTS canary_deployments (
      id              TEXT        PRIMARY KEY,
      service_id      TEXT        NOT NULL REFERENCES registered_services(id) ON DELETE CASCADE,
      stable_revision TEXT        NOT NULL,
      canary_revision TEXT        NOT NULL,
      canary_percent  INTEGER     NOT NULL DEFAULT 0 CHECK (canary_percent BETWEEN 0 AND 100),
      status          TEXT        NOT NULL DEFAULT 'progressing',
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_canary_service ON canary_deployments (service_id);

    CREATE TABLE IF NOT EXISTS tenants (
      id            TEXT        PRIMARY KEY,
      name          TEXT        UNIQUE NOT NULL,
      configuration JSONB       NOT NULL DEFAULT '{}',
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_tenants_name ON tenants (name);

    CREATE TABLE IF NOT EXISTS tenant_users (
      id            TEXT        PRIMARY KEY,
      tenant_id     TEXT        NOT NULL,
      email         TEXT        NOT NULL,
      password_hash TEXT        NOT NULL,
      role          TEXT        NOT NULL DEFAULT 'tenant_viewer',
      display_name  TEXT,
      is_active     BOOLEAN     NOT NULL DEFAULT true,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE(tenant_id, email)
    );

    CREATE INDEX IF NOT EXISTS idx_tenant_users_tenant ON tenant_users (tenant_id);
    CREATE INDEX IF NOT EXISTS idx_tenant_users_email ON tenant_users (email);

    CREATE TABLE IF NOT EXISTS workflow_definitions (
      id          TEXT        PRIMARY KEY,
      tenant_id   TEXT        NOT NULL,
      name        VARCHAR(128) NOT NULL,
      application VARCHAR(64)  NOT NULL,
      actions     JSONB       NOT NULL,
      created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      deleted_at  TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_wf_def_tenant
      ON workflow_definitions (tenant_id) WHERE deleted_at IS NULL;

    CREATE TABLE IF NOT EXISTS workflow_executions (
      id                    TEXT        PRIMARY KEY,
      definition_id         TEXT        NOT NULL REFERENCES workflow_definitions(id),
      tenant_id             TEXT        NOT NULL,
      temporal_workflow_id  TEXT        NOT NULL,
      temporal_run_id       TEXT        NOT NULL,
      request               JSONB      NOT NULL,
      status                TEXT        NOT NULL DEFAULT 'RUNNING',
      created_at            TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at            TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_wf_exec_definition
      ON workflow_executions (definition_id);
    CREATE INDEX IF NOT EXISTS idx_wf_exec_tenant
      ON workflow_executions (tenant_id);
