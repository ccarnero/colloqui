apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  labels:
    app.kubernetes.io/name: postgres-shared
    app.kubernetes.io/component: shared-oltp-database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-trixie
  # Exposes Secret `postgres-shared-superuser` so tenant-service can CREATE ROLE / CREATE DATABASE on the shared cluster.
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: yoizen
      owner: yoizen
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  postgresql:
    parameters:
      timezone: "UTC"
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      effective_cache_size: "512MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_min_duration_statement: "500"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 20Gi
  managed:
    # `roles` declaratively reconciles the `yoizen` application user's
    # password to the value in `postgres-shared-yoizen-credentials`
    # (basic-auth Secret committed in `secret.yaml`). Without this, CNPG
    # auto-generates a random password into `postgres-shared-app` that
    # platform services don't know — every shared-tenant single-database
    # connect path falls back to `POSTGRES_PASSWORD=yoizen-dev-password`
    # and fails with `password authentication failed for user "yoizen"`.
    roles:
      - name: yoizen
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-shared-yoizen-credentials
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-shared
              labels:
                app.kubernetes.io/name: postgres-shared
                app.kubernetes.io/component: shared-oltp-database
            spec:
              type: ClusterIP
