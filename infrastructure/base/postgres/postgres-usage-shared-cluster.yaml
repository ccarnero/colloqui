apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-usage-shared
  labels:
    app.kubernetes.io/name: postgres-usage-shared
    app.kubernetes.io/component: shared-usage-database
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: timescaledb-ha
    major: 17
  postgresUID: 1000
  postgresGID: 1000
  bootstrap:
    initdb:
      database: yoizen_usage
      owner: yoizen
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      timescaledb.telemetry_level: "off"
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      effective_cache_size: "512MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_min_duration_statement: "500"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 20Gi
  managed:
    # `roles` declaratively reconciles the `yoizen` application user's
    # password to the value in `postgres-shared-yoizen-credentials`
    # (basic-auth Secret committed in `secret.yaml`). The TimescaleDB
    # cluster is reached in single-database mode by channel-service and
    # usage-aggregator-service; without this both fall back to
    # `POSTGRES_PASSWORD=yoizen-dev-password` and fail with `password
    # authentication failed for user "yoizen"`.
    roles:
      - name: yoizen
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: postgres-shared-yoizen-credentials
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgres-usage-shared
              labels:
                app.kubernetes.io/name: postgres-usage-shared
                app.kubernetes.io/component: shared-usage-database
            spec:
              type: ClusterIP
