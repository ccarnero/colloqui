apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: yoizen
  POSTGRES_USER: yoizen
  POSTGRES_PASSWORD: yoizen-dev-password
---
# Deterministic credentials for the `yoizen` application role on the
# CloudNativePG-managed shared OLTP and shared usage clusters. CNPG
# normally generates a random password for the `<cluster>-app` Secret;
# referenced through `spec.managed.roles[].passwordSecret`, this Secret
# overrides that random value so platform services can authenticate with
# the same `POSTGRES_PASSWORD` they use everywhere else (see
# `postgres-credentials.POSTGRES_PASSWORD` above).
#
# Required keys for CNPG `passwordSecret`: `username` + `password`
# (Secret type must be `kubernetes.io/basic-auth`).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-shared-yoizen-credentials
  labels:
    app.kubernetes.io/name: postgres-shared
    app.kubernetes.io/component: shared-oltp-database
type: kubernetes.io/basic-auth
stringData:
  username: yoizen
  password: yoizen-dev-password
---
# Deterministic credentials for the dedicated `postgres-temporal` CNPG
# cluster (Temporal Server's persistence backend). Same pattern as
# `postgres-shared-yoizen-credentials` above: CNPG `managed.roles[].
# passwordSecret` reconciles this value into the `temporal` role on
# the cluster, and the Temporal Deployment reads `username` + `password`
# from here (mapped to `POSTGRES_USER` / `POSTGRES_PWD`).
#
# Required keys for CNPG `passwordSecret`: `username` + `password`
# (Secret type must be `kubernetes.io/basic-auth`).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-temporal-credentials
  labels:
    app.kubernetes.io/name: postgres-temporal
    app.kubernetes.io/component: temporal-database
type: kubernetes.io/basic-auth
stringData:
  username: temporal
  password: temporal-dev-password
---
# Deterministic credentials for the dedicated `postgres-temporal-
# visibility` CNPG cluster (split out of the shared Temporal Postgres
# in the 2026-05-22 stress-test remediation — see
# `post-mortem/POST-MORTEM.md` §P0.2 and
# `DOCS/RUNBOOK-TEMPORAL-VISIBILITY-SPLIT.md`).
#
# Used by the Temporal Deployment's `VISIBILITY_POSTGRES_USER` /
# `VISIBILITY_POSTGRES_PWD` env vars. Kept in lock-step with the
# default `postgres-temporal-credentials` so an operator only has
# to know a single password during local dev / orbstack runs.
#
# Required keys for CNPG `passwordSecret`: `username` + `password`
# (Secret type must be `kubernetes.io/basic-auth`).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-temporal-visibility-credentials
  labels:
    app.kubernetes.io/name: postgres-temporal-visibility
    app.kubernetes.io/component: temporal-visibility-database
type: kubernetes.io/basic-auth
stringData:
  username: temporal
  password: temporal-dev-password
