apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nats
  - redis
  - mongo
  # Both mongo and postgres are declared in base; environment overlays pick one:
  #   `overlays/postgres/` (default) — deletes Mongo, keeps OLTP + Temporal Postgres
  #   `overlays/mongo/` — deletes non-temporal Postgres, keeps Mongo + Temporal
  - postgres
  - temporal
  - temporal-ui
  - observability
# NOTE: KEDA is installed via Helm (`helm install keda kedacore/keda
# --namespace keda --create-namespace`). Do NOT include a kustomize
# resource for its namespace here: an overlay-level `namespace:` directive
# would rename the KEDA Namespace object to the target namespace and leak
# its `pod-security.kubernetes.io/enforce: restricted` labels onto it,
# which would reject every non-PSS-compliant workload (NATS, Postgres,
# Temporal, Promtail, ...). See `infrastructure/base/keda/README.md`.
