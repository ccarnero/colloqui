apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 1GB
    }

    # Liveness / readiness endpoint
    ping_interval: 20s
    ping_max: 3

    # Performance tuning
    max_payload: 1MB
    max_pending: 64MB
    write_deadline: 10s
