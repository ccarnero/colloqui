apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    app: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/**/*.log
        pipeline_stages:
          - regex:
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*\.log'
              source: filename
          - labels:
              namespace:
              pod:
              container:
          - match:
              selector: '{container="queue-proxy"}'
              action: drop
          - docker: {}
          - json:
              expressions:
                level: level
                traceId: traceId
                spanId: spanId
                context: context
                msg: msg
                name: name
          - labels:
              level:
              traceId:
              name:
