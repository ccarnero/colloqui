apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceId":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"

      - name: NATS Monitoring
        uid: nats-monitor
        type: yesoreyeram-infinity-datasource
        access: proxy
        editable: false
        jsonData:
          url: "http://nats:8222"

      # Message-tracking Postgres (tracking.tracked_events). Grafana runs in the
      # same namespace as the platform Postgres (support-services-dev), so the
      # cross-namespace FQDN resolves and the existing `postgres-credentials`
      # Secret is reachable without replication. Credentials are NOT inlined
      # here: `$PG_TRACKING_USER` / `$PG_TRACKING_PASSWORD` are expanded by
      # Grafana from env vars injected in the Deployment via secretKeyRef
      # (see deployment.yaml). Single `$` triggers Grafana env interpolation,
      # matching the `$$`-escaped literal used by the Loki derivedField above.
      - name: Tracking Postgres
        uid: tracking-postgres
        type: postgres
        access: proxy
        url: postgres.support-services-dev.svc.cluster.local:5432
        user: $PG_TRACKING_USER
        editable: false
        jsonData:
          database: yoizen
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $PG_TRACKING_PASSWORD
