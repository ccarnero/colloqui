apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-message-tracking
  labels:
    app: grafana
data:
  message-traces.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": false,
          "title": "Connector detail",
          "type": "link",
          "url": "/d/connector-detail"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Tempo Explore",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22:%22tempo%22%7D"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Temporal UI",
          "type": "link",
          "url": "$${temporal_ui_base}"
        }
      ],
      "panels": [
        {
          "title": "Trace waterfall (Tempo)",
          "description": "Native Tempo trace waterfall for the trace whose id equals $correlation_id with dashes stripped (see the $trace_id hidden variable). Paste a correlation_id (with or without dashes) into the $correlation_id variable above.",
          "type": "traces",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [
            {
              "refId": "A",
              "queryType": "traceql",
              "query": "${trace_id}"
            }
          ]
        },
        {
          "title": "Causal node graph",
          "description": "Nodes = tracked_events rows for this correlation_id; edges link causation_id -> event_id. Events with no causation_id (root events, and drift with a lost causal parent) render as detached roots — this makes causal-chain drift visually obvious instead of hiding it.",
          "type": "nodeGraph",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "nodes",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  event_id AS id,\n  coalesce(kind, subject) AS title,\n  producer AS \"subTitle\",\n  to_char(occurred_at, 'HH24:MI:SS.MS') AS \"mainStat\",\n  CASE business_fn\n    WHEN 'ingress' THEN '#3391FF'\n    WHEN 'channel-processing' THEN '#33CC99'\n    WHEN 'channel-egress' THEN '#FFB833'\n    WHEN 'workflow-execution' THEN '#B266FF'\n    WHEN 'connector-invocation' THEN '#FF6666'\n    WHEN 'agent-execution' THEN '#66CCFF'\n    WHEN 'dlq' THEN '#FF3333'\n    WHEN 'audit' THEN '#999999'\n    ELSE '#CCCCCC'\n  END AS color,\n  workflow_id AS \"detail__workflow_id\",\n  run_id AS \"detail__run_id\",\n  connector_id AS \"detail__connector_id\"\nFROM tracking.tracked_events\nWHERE correlation_id = '$correlation_id'\nORDER BY occurred_at"
            },
            {
              "refId": "edges",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  e.event_id AS id,\n  s.event_id AS source,\n  e.event_id AS target\nFROM tracking.tracked_events e\nJOIN tracking.tracked_events s ON s.event_id = e.causation_id\nWHERE e.correlation_id = '$correlation_id'"
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "detail__workflow_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open in Temporal",
                        "url": "${temporal_ui_base}/namespaces/default/workflows/${__data.fields.detail__workflow_id}/${__data.fields.detail__run_id}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "detail__connector_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Connector detail",
                        "url": "/d/connector-detail?var-connector=${__data.fields.detail__connector_id}",
                        "targetBlank": false
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "title": "Trace events (detail)",
          "description": "All events of this trace ordered by occurred_at. `payload` column is a PLACEHOLDER — see Open decision 1 in .sdd/changes/trace-visualization/tasks.md (payload display policy: as-is / truncated / masked; claim-check reference-vs-resolved). Connector endpoint-call events already ship redacted headers + truncated bodies via .sdd/changes/connector-call-detail; this decision covers the remaining event families.",
          "type": "table",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  occurred_at,\n  event_id,\n  subject,\n  tech,\n  business_fn,\n  rule,\n  is_claim_check,\n  compliance,\n  workflow_id,\n  run_id,\n  connector_id,\n  cache_status,\n  -- TODO(open decision 1, .sdd/changes/trace-visualization/tasks.md): payload\n  -- display policy is UNRESOLVED (as-is / truncated / masked; claim-check\n  -- reference-vs-resolved). Placeholder NULL until decided.\n  NULL::text AS payload\nFROM tracking.tracked_events\nWHERE correlation_id = '$correlation_id'\nORDER BY occurred_at"
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "workflow_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open in Temporal",
                        "url": "${temporal_ui_base}/namespaces/default/workflows/${__data.fields.workflow_id}/${__data.fields.run_id}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "connector_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Connector detail",
                        "url": "/d/connector-detail?var-connector=${__data.fields.connector_id}",
                        "targetBlank": false
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "event_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open trace in Tempo",
                        "url": "/d/message-traces?var-correlation_id=$correlation_id",
                        "targetBlank": false
                      }
                    ]
                  }
                ]
              }
            ]
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["message-tracking", "tracing", "observability"],
      "templating": {
        "list": [
          {
            "name": "correlation_id",
            "type": "textbox",
            "label": "Correlation ID",
            "query": "",
            "current": { "text": "", "value": "" },
            "hide": 0
          },
          {
            "name": "trace_id",
            "type": "query",
            "label": "Trace ID (derived)",
            "hide": 2,
            "datasource": { "type": "postgres", "uid": "tracking-postgres" },
            "query": "SELECT replace('$correlation_id', '-', '') AS trace_id",
            "refresh": 2
          },
          {
            "name": "tenant",
            "type": "query",
            "label": "Tenant",
            "datasource": { "type": "postgres", "uid": "tracking-postgres" },
            "query": "SELECT DISTINCT tenant FROM tracking.tracked_events WHERE tenant IS NOT NULL ORDER BY tenant",
            "refresh": 2,
            "includeAll": true,
            "multi": true
          },
          {
            "name": "temporal_ui_base",
            "type": "textbox",
            "label": "Temporal UI base URL",
            "query": "",
            "current": { "text": "", "value": "" },
            "hide": 0,
            "description": "e.g. http://temporal-ui.dev.local — base URL as a variable, never hardcoded."
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Message traces",
      "uid": "message-traces",
      "refresh": ""
    }
  connector-detail.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": false,
          "title": "Message traces",
          "type": "link",
          "url": "/d/message-traces"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Tempo Explore",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22:%22tempo%22%7D"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": true,
          "title": "Temporal UI",
          "type": "link",
          "url": "$${temporal_ui_base}"
        }
      ],
      "panels": [
        {
          "title": "Invocations/hour",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT $__timeGroupAlias(occurred_at, '1h'), count(*) AS invocations FROM tracking.tracked_events WHERE $__timeFilter(occurred_at) AND connector_id = '$connector' GROUP BY 1 ORDER BY 1"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 40 } }
          }
        },
        {
          "title": "Latency p50/p95",
          "description": "DEVIATION from tasks.md's suggested source: connector-runtime's event-publisher.ts emits ONE endpoint_call_completed point event per call (not a started/completed pair — no entity id field span-pairs.sql can key on either), so tracking.tracked_event_spans always returns duration_ms=0 for connector calls. The real per-call duration IS available, inline, as envelope.data.payload.durationMs (IEndpointCallEvent.durationMs) — reading it directly is CORRECT, not a workaround. See apply-progress.md T8 discovery.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT\n  $__timeGroupAlias(occurred_at, '1h'),\n  percentile_cont(0.5) WITHIN GROUP (ORDER BY (envelope #>> '{data,payload,durationMs}')::numeric) AS p50,\n  percentile_cont(0.95) WITHIN GROUP (ORDER BY (envelope #>> '{data,payload,durationMs}')::numeric) AS p95\nFROM tracking.tracked_events\nWHERE $__timeFilter(occurred_at) AND connector_id = '$connector'\nGROUP BY 1\nORDER BY 1"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "fillOpacity": 10 } }
          }
        },
        {
          "title": "Error rate (HTTP status >= 400)",
          "description": "status is read from envelope.data.payload.status (IEndpointCallEvent — connector-call-detail change), not a dedicated column.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT\n  $__timeGroupAlias(occurred_at, '1h'),\n  count(*) FILTER (WHERE (envelope #>> '{data,payload,status}')::int >= 400)::float\n    / NULLIF(count(*), 0) AS error_rate\nFROM tracking.tracked_events\nWHERE $__timeFilter(occurred_at) AND connector_id = '$connector'\nGROUP BY 1\nORDER BY 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.05 },
                  { "color": "red", "value": 0.2 }
                ]
              }
            }
          }
        },
        {
          "title": "Cache hit-rate",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  count(*) FILTER (WHERE cache_status = 'hit')::float\n    / NULLIF(count(*) FILTER (WHERE cache_status IS NOT NULL), 0) AS cache_hit_rate\nFROM tracking.tracked_events\nWHERE $__timeFilter(occurred_at) AND connector_id = '$connector'"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.3 },
                  { "color": "green", "value": 0.6 }
                ]
              }
            }
          }
        },
        {
          "title": "Last 50 calls",
          "description": "correlation_id links back to the Message traces dashboard (Tempo waterfall + node graph for the owning message). raw_envelope is inspectable via the JSON-view cell (click to expand) — no separate redaction here, connector-call-detail already ships redacted headers + truncated bodies inside the envelope payload.",
          "type": "table",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "postgres", "uid": "tracking-postgres" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT\n  occurred_at,\n  event_id,\n  correlation_id,\n  cache_status,\n  (envelope #>> '{data,payload,method}') AS method,\n  (envelope #>> '{data,payload,status}')::int AS status,\n  (envelope #>> '{data,payload,resolvedUrl}') AS url,\n  envelope AS raw_envelope\nFROM tracking.tracked_events\nWHERE connector_id = '$connector'\nORDER BY occurred_at DESC\nLIMIT 50"
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "correlation_id" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open trace",
                        "url": "/d/message-traces?var-correlation_id=${__data.fields.correlation_id}",
                        "targetBlank": false
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "raw_envelope" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "json-view" } }
                ]
              }
            ]
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["message-tracking", "tracing", "connector", "observability"],
      "templating": {
        "list": [
          {
            "name": "connector",
            "type": "query",
            "label": "Connector",
            "datasource": { "type": "postgres", "uid": "tracking-postgres" },
            "query": "SELECT DISTINCT connector_id FROM tracking.tracked_events WHERE connector_id IS NOT NULL ORDER BY connector_id",
            "refresh": 2
          },
          {
            "name": "temporal_ui_base",
            "type": "textbox",
            "label": "Temporal UI base URL",
            "query": "",
            "current": { "text": "", "value": "" },
            "hide": 0,
            "description": "e.g. http://temporal-ui.dev.local — base URL as a variable, never hardcoded."
          }
        ]
      },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Connector detail",
      "uid": "connector-detail",
      "refresh": ""
    }
