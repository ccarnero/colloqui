apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  api-gateway-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total{service_name=\"api-gateway\"}[5m])) by (method, status_code)",
              "legendFormat": "{{method}} {{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total{service_name=\"api-gateway\", status_code=~\"4..|5..\"}[5m]))",
              "legendFormat": "errors/s"
            },
            {
              "expr": "sum(rate(http_server_request_total{service_name=\"api-gateway\"}[5m]))",
              "legendFormat": "total/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Request Duration P50 / P95 / P99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_milliseconds_bucket{service_name=\"api-gateway\"}[5m])) by (le))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_milliseconds_bucket{service_name=\"api-gateway\"}[5m])) by (le))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_milliseconds_bucket{service_name=\"api-gateway\"}[5m])) by (le))",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Rate Limited Requests (429)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total{service_name=\"api-gateway\", status_code=\"429\"}[5m]))",
              "legendFormat": "429 rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "bars", "fillOpacity": 50 }
            }
          }
        },
        {
          "title": "Active Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(http_server_active_requests{service_name=\"api-gateway\"})",
              "legendFormat": "active"
            }
          ]
        },
        {
          "title": "Requests by Route Type",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total{service_name=\"api-gateway\"}[5m])) by (route)",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["api-gateway", "observability"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "API Gateway Overview",
      "uid": "api-gateway-overview"
    }
  nats-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(gnatsd_varz_connections{job=\"nats\"})",
              "legendFormat": "connections"
            }
          ],
          "fieldConfig": {
            "defaults": { "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 1000 }] } }
          }
        },
        {
          "title": "Subscriptions",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(gnatsd_varz_subscriptions{job=\"nats\"})",
              "legendFormat": "subscriptions"
            }
          ]
        },
        {
          "title": "Slow Consumers",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(gnatsd_varz_slow_consumers{job=\"nats\"})",
              "legendFormat": "slow consumers"
            }
          ],
          "fieldConfig": {
            "defaults": { "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }
          }
        },
        {
          "title": "Server CPU",
          "type": "stat",
          "gridPos": { "h": 4, "w": 5, "x": 15, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "avg(gnatsd_varz_cpu{job=\"nats\"})",
              "legendFormat": "cpu %"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent" }
          }
        },
        {
          "title": "Server Memory",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(gnatsd_varz_mem{job=\"nats\"})",
              "legendFormat": "memory"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        },
        {
          "title": "Messages In / Out Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(gnatsd_varz_in_msgs{job=\"nats\"}[5m]))",
              "legendFormat": "msgs in/s"
            },
            {
              "expr": "sum(rate(gnatsd_varz_out_msgs{job=\"nats\"}[5m]))",
              "legendFormat": "msgs out/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Bytes In / Out Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(gnatsd_varz_in_bytes{job=\"nats\"}[5m]))",
              "legendFormat": "bytes in/s"
            },
            {
              "expr": "sum(rate(gnatsd_varz_out_bytes{job=\"nats\"}[5m]))",
              "legendFormat": "bytes out/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "JetStream Streams",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jetstream_server_total_streams{job=\"nats\"})",
              "legendFormat": "streams"
            }
          ]
        },
        {
          "title": "JetStream Consumers",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jetstream_server_total_consumers{job=\"nats\"})",
              "legendFormat": "consumers"
            }
          ]
        },
        {
          "title": "JetStream Stored Messages",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jetstream_server_total_messages{job=\"nats\"})",
              "legendFormat": "messages"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "JetStream Storage Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jetstream_server_total_message_bytes{job=\"nats\"})",
              "legendFormat": "storage used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "JetStream Streams Detail",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jetstream_stream_messages{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "jetstream_stream_bytes{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "jetstream_stream_consumer_count{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "C"
            },
            {
              "expr": "jetstream_stream_last_seq{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "D"
            }
          ],
          "transformations": [
            { "id": "merge" },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "server_id": true,
                  "account": true
                },
                "renameByName": {
                  "stream_name": "Stream",
                  "Value #A": "Messages",
                  "Value #B": "Bytes",
                  "Value #C": "Consumers",
                  "Value #D": "Last Seq"
                }
              }
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Bytes" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              }
            ]
          }
        },
        {
          "title": "Message Rate per Stream",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(jetstream_stream_messages{job=\"nats\"}[5m])",
              "legendFormat": "{{stream_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Storage per Stream",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jetstream_stream_bytes{job=\"nats\"}",
              "legendFormat": "{{stream_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "JetStream Consumers Detail",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jetstream_consumer_num_pending{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "jetstream_consumer_num_ack_pending{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "jetstream_consumer_delivered_consumer_seq{job=\"nats\"}",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "merge" },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "server_id": true,
                  "account": true
                },
                "renameByName": {
                  "stream_name": "Stream",
                  "consumer_name": "Consumer",
                  "Value #A": "Pending",
                  "Value #B": "Ack Pending",
                  "Value #C": "Delivered Seq"
                }
              }
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["nats", "messaging", "observability"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "NATS Overview",
      "uid": "nats-overview"
    }
  service-health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total[5m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "P99 Latency by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_milliseconds_bucket[5m])) by (le, service_name))",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Error Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_total{status_code=~\"5..\"}[5m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["services", "observability"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Service Health",
      "uid": "service-health"
    }
  nats-subjects.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "NATS Overview",
          "type": "link",
          "url": "/d/nats-overview"
        }
      ],
      "panels": [
        {
          "title": "Server Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/varz",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "columns": [
                { "selector": "uptime", "text": "Uptime", "type": "string" }
              ]
            }
          ],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Total Messages In",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/varz",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "columns": [
                { "selector": "in_msgs", "text": "Messages In", "type": "number" }
              ]
            }
          ],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Total Messages Out",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/varz",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "columns": [
                { "selector": "out_msgs", "text": "Messages Out", "type": "number" }
              ]
            }
          ],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "Total Subscriptions",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/subsz",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "columns": [
                { "selector": "num_subscriptions", "text": "Subscriptions", "type": "number" }
              ]
            }
          ],
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "title": "JetStream Streams",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/jsz?streams=true",
              "url_options": { "method": "GET" },
              "root_selector": "account_details.0.stream_detail",
              "columns": [
                { "selector": "name", "text": "Stream", "type": "string" },
                { "selector": "config.subjects", "text": "Subjects", "type": "string" },
                { "selector": "state.messages", "text": "Messages", "type": "number" },
                { "selector": "state.bytes", "text": "Bytes", "type": "number" },
                { "selector": "state.consumer_count", "text": "Consumers", "type": "number" },
                { "selector": "state.last_seq", "text": "Last Seq", "type": "number" },
                { "selector": "state.first_seq", "text": "First Seq", "type": "number" }
              ]
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Bytes" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              }
            ]
          }
        },
        {
          "title": "Client Connections & Subscriptions",
          "type": "table",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nats-monitor" },
          "targets": [
            {
              "refId": "A",
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://nats:8222/connz?subs=true&sort=subs&limit=256",
              "url_options": { "method": "GET" },
              "root_selector": "connections",
              "columns": [
                { "selector": "name", "text": "Client Name", "type": "string" },
                { "selector": "ip", "text": "IP", "type": "string" },
                { "selector": "lang", "text": "Language", "type": "string" },
                { "selector": "version", "text": "Version", "type": "string" },
                { "selector": "subs", "text": "Num Subs", "type": "number" },
                { "selector": "subscriptions_list", "text": "Subjects", "type": "string" },
                { "selector": "in_msgs", "text": "Msgs In", "type": "number" },
                { "selector": "out_msgs", "text": "Msgs Out", "type": "number" },
                { "selector": "in_bytes", "text": "Bytes In", "type": "number" },
