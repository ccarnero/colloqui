            {
              "expr": "rate(cnpg_pg_stat_database_xact_commit{datname=~\"temporal|temporal_visibility\"}[1m])",
              "legendFormat": "commit {{datname}}"
            },
            {
              "expr": "rate(cnpg_pg_stat_database_xact_rollback{datname=~\"temporal|temporal_visibility\"}[1m])",
              "legendFormat": "rollback {{datname}}"
