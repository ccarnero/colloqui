apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector:8889

      - job_name: nats
        static_configs:
          - targets:
              - nats:7777

      # Temporal Server self-metrics. Post-HA-migration (see
      # DOCS/runbooks/temporal-ha-migration.md) the cluster runs the 4
      # roles (frontend, history, matching, worker) as separate
      # Deployments under the same `app.kubernetes.io/name=temporal`
      # label, distinguished by `temporal.io/role`. The keep filter
      # below still matches all 4 since the label is shared; we add a
      # `temporal_role` target label so Grafana / PromQL can group by
      # role. Required env on every Deployment:
      # `PROMETHEUS_ENDPOINT=0.0.0.0:9090`.
      #
      # The metric `service_name` (set by Temporal itself) and the
      # label `temporal_role` (set here) are 1:1 — keeping both
      # makes it easy to migrate dashboards incrementally.
      - job_name: temporal-server
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: temporal
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9090"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_label_temporal_io_role]
            target_label: temporal_role

      # Temporal TypeScript SDK metrics from the orchestrator worker
      # (`@temporalio/worker` Runtime). Exposed when the Deployment env
      # `PROMETHEUS_BIND_ADDRESS=0.0.0.0:9464` is set. Critical for
      # detecting client-side worker slot saturation under load.
      - job_name: workflow-worker-sdk
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: workflow-worker
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9464"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # Temporal TypeScript SDK metrics from connector-runtime (activity-only
      # worker on the `connector-runtime` task queue, see
      # `CONNECTOR_RUNTIME_TASK_QUEUE` in `packages/shared/src/constants.ts`).
      # Same rationale as the orchestrator job above.
      - job_name: connector-runtime-sdk
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: connector-runtime
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9464"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # CNPG cluster `postgres-temporal` (Temporal Server's persistence
      # backend). Each CNPG instance pod exposes the built-in Postgres
      # exporter on port 9187. We discover them dynamically by the
      # `cnpg.io/cluster` label so adding/removing replicas reflects
      # immediately without editing static targets.
      #
      # Requires the SA + ClusterRole defined in `rbac.yaml`.
      - job_name: cnpg-postgres-temporal
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: postgres-temporal
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9187"
          - source_labels: [__meta_kubernetes_pod_label_role]
            target_label: cnpg_role
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
