apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector:8889

      - job_name: nats
        static_configs:
          - targets:
              - nats:7777

      # Temporal Server self-metrics. The `temporalio/auto-setup` image
      # runs all 4 services (frontend, history, matching, internal-worker)
      # in one process so a single endpoint exports every `temporal_*`
      # metric — `service_name` label disambiguates them. Required env in
      # the Temporal Deployment: `PROMETHEUS_ENDPOINT=0.0.0.0:9090`.
      #
      # Discovers pods by `app.kubernetes.io/name=temporal` so multi-replica
      # deployments yield one target per pod (vs. Service round-robin which
      # mixes metrics across pods).
      - job_name: temporal-server
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: temporal
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9090"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace

      # Temporal TypeScript SDK metrics from the orchestrator worker
      # (`@temporalio/worker` Runtime). Exposed when the Deployment env
      # `PROMETHEUS_BIND_ADDRESS=0.0.0.0:9464` is set. Critical for
      # detecting client-side worker slot saturation under load.
      - job_name: workflow-worker-sdk
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: workflow-worker
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9464"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # Temporal TypeScript SDK metrics from connector-runtime (activity-only
      # worker on the `connector-runtime` task queue, see
      # `CONNECTOR_RUNTIME_TASK_QUEUE` in `packages/shared/src/constants.ts`).
      # Same rationale as the orchestrator job above.
      - job_name: connector-runtime-sdk
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: connector-runtime
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9464"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      # CNPG cluster `postgres-temporal` (Temporal Server's persistence
      # backend). Each CNPG instance pod exposes the built-in Postgres
      # exporter on port 9187. We discover them dynamically by the
      # `cnpg.io/cluster` label so adding/removing replicas reflects
      # immediately without editing static targets.
      #
      # Requires the SA + ClusterRole defined in `rbac.yaml`.
      - job_name: cnpg-postgres-temporal
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: postgres-temporal
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9187"
          - source_labels: [__meta_kubernetes_pod_label_role]
            target_label: cnpg_role
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
