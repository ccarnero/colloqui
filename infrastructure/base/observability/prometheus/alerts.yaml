apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  labels:
    app: prometheus
data:
  alerts.yml: |
    groups:
      - name: api-gateway
        rules:
          - alert: HighErrorRate
            expr: >
              sum(rate(http_server_request_total{service_name="api-gateway", status_code=~"5.."}[5m]))
              /
              sum(rate(http_server_request_total{service_name="api-gateway"}[5m]))
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "API Gateway error rate above 5%"
              description: "Gateway 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

          - alert: HighP99Latency
            expr: >
              histogram_quantile(0.99,
                sum(rate(http_server_request_duration_milliseconds_bucket{service_name="api-gateway"}[5m])) by (le)
              ) > 5000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "API Gateway P99 latency above 5s"
              description: "Gateway P99 latency is {{ $value }}ms over the last 5 minutes."

          - alert: HighRateLimitRate
            expr: >
              sum(rate(http_server_request_total{service_name="api-gateway", status_code="429"}[5m]))
              /
              sum(rate(http_server_request_total{service_name="api-gateway"}[5m]))
              > 0.20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Rate limiting above 20% of requests"
              description: "{{ $value | humanizePercentage }} of gateway requests are being rate limited."

      - name: services
        rules:
          - alert: ServiceHighErrorRate
            expr: >
              sum(rate(http_server_request_total{status_code=~"5.."}[5m])) by (service_name)
              /
              sum(rate(http_server_request_total[5m])) by (service_name)
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.service_name }} error rate above 5%"
              description: "{{ $labels.service_name }} 5xx error rate is {{ $value | humanizePercentage }}."

          - alert: ServiceHighLatency
            expr: >
              histogram_quantile(0.99,
                sum(rate(http_server_request_duration_milliseconds_bucket[5m])) by (le, service_name)
              ) > 5000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Service {{ $labels.service_name }} P99 latency above 5s"
              description: "{{ $labels.service_name }} P99 latency is {{ $value }}ms."

      - name: nats
        rules:
          - alert: NatsDown
            expr: up{job="nats"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "NATS exporter unreachable"
              description: "Prometheus cannot scrape the NATS exporter for more than 1 minute."

          - alert: NatsSlowConsumers
            expr: gnatsd_varz_slow_consumers > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "NATS has slow consumers"
              description: "NATS reports {{ $value }} slow consumer(s) for more than 5 minutes."

          - alert: NatsJetStreamStorageHigh
            expr: >
              (jetstream_server_total_message_bytes / jetstream_server_max_storage) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "JetStream storage above 80%"
              description: "JetStream storage usage is at {{ $value | humanizePercentage }} of configured max."

          - alert: NatsHighConnectionCount
            expr: gnatsd_varz_connections > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "NATS connection count above 1000"
              description: "NATS currently has {{ $value }} active connections."

      - name: nats-dlq
        rules:
          - alert: DlqMessageDetected
            expr: >
              sum by (stream_name) (
                increase(jetstream_stream_messages{stream_name=~"DLQ-.*"}[1m])
              ) > 0
            for: 0m
            labels:
              severity: critical
              category: poison-pill
            annotations:
              summary: "New DLQ message on {{ $labels.stream_name }}"
              description: >
                A permanent-failure message was terminated and routed to
                {{ $labels.stream_name }}. Inspect the envelope headers
                (X-Dlq-Reason / X-Dlq-Stage / X-Dlq-Original-Subject)
                to identify the poison-pill and tenant.

          - alert: DlqIngestRateSustained
            expr: >
              sum by (stream_name) (
                rate(jetstream_stream_messages{stream_name=~"DLQ-.*"}[5m])
              ) > 0.05
            for: 10m
            labels:
              severity: warning
              category: poison-pill
            annotations:
              summary: "Sustained DLQ ingest on {{ $labels.stream_name }}"
              description: >
                DLQ ingest rate on {{ $labels.stream_name }} is
                {{ $value | humanize }} msg/s over the last 10 minutes —
                indicates repeated permanent failures (likely a bad
                deploy or a misconfigured tenant endpoint).

          - alert: DlqBacklogGrowing
            expr: >
              deriv(
                jetstream_stream_messages{stream_name=~"DLQ-.*"}[15m]
              ) > 0
            for: 30m
            labels:
              severity: warning
              category: poison-pill
            annotations:
              summary: "DLQ {{ $labels.stream_name }} backlog is growing"
              description: >
                {{ $labels.stream_name }} has been accumulating messages
                for 30+ minutes with no drainage. Triage the DLQ consumer
                or replay the envelopes once the root cause is fixed.

      - name: temporal-postgres
        rules:
          - alert: TemporalPostgresDown
            expr: up{job="cnpg-postgres-temporal"} == 0
            for: 1m
            labels:
              severity: critical
              category: temporal-persistence
            annotations:
              summary: "Temporal Postgres pod down ({{ $labels.instance }})"
              description: >
                Pod has been unreachable for >1m. Temporal Server cannot
                persist workflow state — pending starts/signals will pile
                up in the gRPC frontend.

          - alert: TemporalPostgresReplicationLagHigh
            expr: cnpg_pg_replication_lag > 10
            for: 2m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "CNPG replication lag >10s ({{ $value }}s)"
              description: >
                Replica is {{ $value }}s behind primary; risk of data
                divergence on failover. Investigate IO pressure or
                long-running queries on standby.

          - alert: TemporalPostgresDeadTuplesHigh
            expr: >
              cnpg_pg_stat_user_tables_n_dead_tup{
                relname=~"history_node|tasks|executions|transfer_tasks|timer_tasks"
              } > 100000
            for: 10m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "Bloat alto en {{ $labels.relname }} ({{ $value }} dead tuples)"
              description: >
                Autovacuum no está siguiendo el ritmo en una tabla
                hot de Temporal. Revisar autovacuum_naptime,
                autovacuum_vacuum_cost_limit y CPU disponible para
                workers de vacuum.

          - alert: TemporalPostgresConnectionsSaturated
            expr: >
              sum(cnpg_backends_total{job="cnpg-postgres-temporal"})
              /
              max(cnpg_pg_settings_setting{job="cnpg-postgres-temporal", name="max_connections"})
              > 0.8
            for: 5m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "Postgres connections >80% del max ({{ $value | humanizePercentage }})"
              description: >
                Considerar bump de max_connections (hoy 500) o
                investigar conexiones colgadas (idle in transaction).

          - alert: TemporalPostgresCheckpointSyncSlow
            expr: >
              rate(
                cnpg_pg_stat_bgwriter_checkpoint_sync_time{job="cnpg-postgres-temporal"}[5m]
              ) > 1000
            for: 5m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "Checkpoint sync time alto ({{ $value }}ms/s)"
              description: >
                IO subsystem saturado durante checkpoints; ajustar
                checkpoint_timeout/max_wal_size o bajar la presión
                de escrituras (workflows concurrentes).

          - alert: TemporalPostgresWalSizeGrowing
            expr: cnpg_pg_wal_size_bytes / (1024 * 1024 * 1024) > 10
            for: 10m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "WAL size >10GB ({{ $value }}GB)"
              description: >
                Replication slot retrasada o checkpoint no progresando.
                Revisar `pg_replication_slots` y estado del standby.

          - alert: TemporalServerErrors
            expr: sum(rate(temporal_service_errors[5m])) > 0.5
            for: 5m
            labels:
              severity: warning
              category: temporal-persistence
            annotations:
              summary: "Temporal Server errors >0.5/s"
              description: >
                Possible persistence backend degradation. Scraped
                from job `temporal-server` (`temporal_service_errors`).

      - name: temporal-server
        rules:
          - alert: TemporalServerDown
            expr: up{job="temporal-server"} == 0
            for: 1m
            labels:
              severity: critical
              category: temporal
            annotations:
              summary: "Temporal Server unreachable ({{ $labels.instance }})"
              description: >
                Prometheus cannot scrape Temporal Server for >1m.
                Workflow starts/queries are failing. Check the
                temporal Deployment, the `metrics` port, and the
                CNPG `postgres-temporal` cluster.

          - alert: TemporalScheduleToStartHigh
            expr: >
              histogram_quantile(0.95,
                sum(rate(temporal_workflow_task_schedule_to_start_latency_bucket[2m])) by (le, task_queue)
              ) > 5000
            for: 2m
            labels:
              severity: warning
              category: temporal
            annotations:
              summary: "Workflow task schedule_to_start p95 >5s ({{ $labels.task_queue }})"
              description: >
                Workflow tasks on {{ $labels.task_queue }} are sitting
                in the queue for >5s before any worker picks them up.
                Symptom of worker starvation — scale the Deployment
                that owns this task queue or lower KEDA targetQueueSize.

          - alert: TemporalActivityScheduleToStartHigh
            expr: >
              histogram_quantile(0.95,
                sum(rate(temporal_activity_schedule_to_start_latency_bucket[2m])) by (le, task_queue)
              ) > 5000
            for: 2m
            labels:
              severity: warning
              category: temporal
            annotations:
              summary: "Activity schedule_to_start p95 >5s ({{ $labels.task_queue }})"
              description: >
                Activities on {{ $labels.task_queue }} are queued >5s
                before a worker picks them up. Workflows risk
                hitting `WORKFLOW_DEFAULT_TIMEOUT_MS` (10m) before
                the activity even runs.

          - alert: TemporalWorkflowTimeoutsSpike
            expr: sum(rate(temporal_workflow_timeout_total[2m])) > 0.5
            for: 2m
            labels:
              severity: critical
              category: temporal
            annotations:
              summary: "Workflows timing out >0.5/s"
              description: >
                Sustained workflow timeout rate. Either backend
                saturation, schedule_to_start latency, or activity
                start_to_close timeouts. Cross-check
                `TemporalScheduleToStartHigh` and the CNPG
                `postgres-temporal` dashboard.

          - alert: TemporalPersistenceLatencyHigh
            expr: >
              histogram_quantile(0.99,
                sum(rate(temporal_persistence_latency_bucket[2m])) by (le, operation)
              ) > 100
            for: 2m
            labels:
              severity: warning
              category: temporal
            annotations:
              summary: "Persistence p99 >100ms ({{ $labels.operation }})"
              description: >
                Temporal persistence operation `{{ $labels.operation }}`
                p99 above 100ms. Check CNPG `postgres-temporal` IO,
                connection saturation, and autovacuum lag.

          - alert: TemporalStickyCacheHitLow
            expr: >
              sum(rate(temporal_sticky_cache_hit[5m]))
              /
              clamp_min(
                sum(rate(temporal_sticky_cache_hit[5m]))
                + sum(rate(temporal_sticky_cache_miss[5m])),
                1
              ) < 0.7
            for: 10m
            labels:
              severity: warning
              category: temporal
            annotations:
              summary: "Sticky cache hit ratio <70%"
              description: >
                Workers are losing sticky cache affinity (replays
                cost CPU + DB). Likely too few worker pods for the
                workflow population or aggressive scale-down.
                Bump `minReplicaCount` or workflow cache size.

      - name: nats-consumer-lag
        rules:
          - alert: NatsConsumerPendingHigh
            expr: >
              jetstream_consumer_num_pending{
                consumer_name=~"workflow-triggers|channel-webhook-ingress|auto-reply|channel-egress|webhook-dispatcher|event-processor"
              } > 500
            for: 2m
            labels:
              severity: warning
              category: nats-backpressure
            annotations:
              summary: "Consumer {{ $labels.consumer_name }} pending >500 ({{ $value }})"
              description: >
                Consumer {{ $labels.consumer_name }} on stream
                {{ $labels.stream_name }} has >500 messages waiting
                to be acknowledged for 2m+. Likely the downstream
                handler cannot keep up — check pod CPU/Memory and
                downstream service health.

          - alert: NatsConsumerAckPendingHigh
            expr: >
              jetstream_consumer_num_ack_pending{
                consumer_name=~"workflow-triggers|channel-webhook-ingress|auto-reply|channel-egress|webhook-dispatcher|event-processor"
              } > 200
            for: 5m
            labels:
              severity: warning
              category: nats-backpressure
            annotations:
              summary: "Consumer {{ $labels.consumer_name }} ack_pending >200"
              description: >
                {{ $labels.consumer_name }} has many in-flight
                deliveries waiting on ack. Possible slow handler,
                stuck activity, or `ack_wait` configured too short.
