# Default values for yoizenclaw-runtime.
# This is a YAML-formatted file.

# -- Tenant identifier (REQUIRED)
tenantId: ""

# -- Deployment environment
environment: dev

# -- Container image configuration
image:
  repository: dev.local/yoizenclaw-runtime
  # -- Image tag (REQUIRED for production, defaults to empty for explicit --set)
  tag: ""
  pullPolicy: IfNotPresent

# -- Resource requests and limits
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- NATS configuration
nats:
  url: nats://nats.default.svc.cluster.local:4222
  account: ""
  credentialsSecretName: ""

# -- PostgreSQL configuration (per-tenant)
postgres:
  host: ""  # Auto-computed: postgres.{tenantId}-{environment}-ns.svc.cluster.local
  port: 5432
  database: yoizen
  user: yoizen
  passwordSecretName: ""  # Secret with POSTGRES_PASSWORD key

# -- Runtime environment variables
env:
  # Heartbeat interval in seconds
  RUNTIME_HEARTBEAT_INTERVAL_SECONDS: "15"
  # Platform environment
  PLATFORM_ENVIRONMENT: dev
  # Log level
  LOG_LEVEL: info
  # OpenTelemetry
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: yoizenclaw-runtime
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.support-services-dev.svc.cluster.local:4318"

# -- Knative serving configuration
knative:
  # Autoscaling
  minScale: 0
  maxScale: 3
  targetConcurrency: 50
  # Service configuration
  timeoutSeconds: 300
  containerConcurrency: 50

# -- Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- ConfigMap data (runtime configuration files)
config:
  data: {}
    # Example:
    # agent-config.yaml: |
    #   default_model: gpt-4

# -- Security context configuration
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Labels to apply to all resources
commonLabels:
  app.kubernetes.io/part-of: yoizen-arch
  yoizen.io/managed-by: helm
