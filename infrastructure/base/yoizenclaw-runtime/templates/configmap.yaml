{{- if empty .Values.tenantId -}}
{{- fail "tenantId is required. Please provide --set tenantId=<tenant-id>" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yoizenclaw-runtime.fullname" . }}-config
  labels:
    {{- include "yoizenclaw-runtime.labels" . | nindent 4 }}
data:
  {{- with .Values.config.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}