services:
  mongo:
    image: mongo:7.0
    container_name: yoizen-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: yoizen
      MONGO_INITDB_ROOT_PASSWORD: yoizen
      MONGO_INITDB_DATABASE: yoizenclaw
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: yoizen-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--js --store_dir /data --http_port 8222"
    volumes:
      - nats_data:/data

  yoizenclaw:
    image: python:3.11-slim
    container_name: yoizenclaw-app
    working_dir: /app
    environment:
      MONGO_URI: mongodb://yoizen:yoizen@mongo:27017/yoizenclaw?authSource=admin
      NATS_URL: nats://nats:4222
      TENANT_ID: test-tenant
      OPENAI_API_KEY: lm-studio
      OPENAI_BASE_URL: http://host.docker.internal:1234/v1
      OTEL_EXPORTER_OTLP_ENDPOINT:
      PORT: 8080
      LOG_LEVEL: INFO
      PYTHONPATH: /app/src:/packages/shared-python
    ports:
      - "8080:8000"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./:/app:cached
      - ../../packages/shared-python:/packages/shared-python:cached
    command: sh -c "pip install -e /packages/shared-python --break-system-packages 2>/dev/null || true && pip install -e /app --break-system-packages 2>/dev/null || true && sleep 10 && uvicorn src.api.routes:app --host 0.0.0.0 --port 8000 --log-level info"

volumes:
  mongo_data:
  nats_data:
