name: "DevOps Assistant Enhanced"
description: "Enhanced DevOps agent with deployment, monitoring, and infrastructure skills"
role:
  name: "DevOps Assistant"
  description: "A technical DevOps assistant that can manage deployments, monitoring, and infrastructure"
  systemPrompt: "You are an expert DevOps assistant with deep knowledge of cloud infrastructure, deployment strategies, monitoring, and automation. Help users with technical operations efficiently."
  temperature: 0.3
  maxTokens: 1000
rules:
  - "Always prioritize security and stability"
  - "Provide detailed technical explanations"
  - "Consider scalability and performance implications"
  - "Use enhanced skills for DevOps operations"
responseStyle: "Technical, precise, and security-focused"
llm:
  provider: "anthropic"
  model: "claude-3-opus"
skills:
  # Deployment skill with complex argument handling
  - id: "deploy-skill"
    name: "deploy_skill"
    description: "Deploy applications to various environments"
    enabled: true
    instructions: "Deploy $SERVICE_NAME to $ENVIRONMENT. Version: $VERSION. Strategy: $STRATEGY. Region: $REGION. Configuration: $CONFIG. Full deployment details: $ARGUMENTS"
    when_to_use: "Use when deploying applications, services, or infrastructure"
    triggers: ["/deploy", "/release", "/rollout"]
    arguments: ["service_name", "environment", "version", "strategy", "region", "config"]
    allowedTools: ["deploy_tool", "k8s_tool", "monitoring_tool"]
    context_mode: "fork"
    modelOverride: "claude-3-sonnet"
    priority: 10
  
  # Infrastructure provisioning skill
  - id: "provision-skill"
    name: "provision_skill"
    description: "Provision infrastructure and resources"
    enabled: true
    instructions: "Provision $RESOURCE_TYPE in $ENVIRONMENT. Size: $SIZE. Region: $REGION. IaC template: $TEMPLATE. Variables: $VARIABLES. Full context: $ARGUMENTS"
    when_to_use: "Use when provisioning infrastructure, servers, or cloud resources"
    triggers: ["/provision", "/create", "/infra"]
    arguments: ["resource_type", "environment", "size", "region", "template", "variables"]
    allowedTools: ["terraform_tool", "cloud_tool", "security_tool"]
    context_mode: "fork"
    modelOverride: "claude-3-opus"
    priority: 9
  
  # Monitoring and alerting skill
  - id: "monitor-skill"
    name: "monitor_skill"
    description: "Set up monitoring and alerting for services"
    enabled: true
    instructions: "Configure monitoring for $SERVICE_NAME in $ENVIRONMENT. Metrics: $METRICS. Alerting: $ALERTING. Dashboard: $DASHBOARD. Thresholds: $THRESHOLDS. Details: $ARGUMENTS"
    when_to_use: "Use when setting up monitoring, alerts, or observability"
    triggers: ["/monitor", "/alert", "/metrics", "/observability"]
    arguments: ["service_name", "environment", "metrics", "alerting", "dashboard", "thresholds"]
    allowedTools: ["monitoring_tool", "alert_tool", "dashboard_tool"]
    context_mode: "inline"
    priority: 7
  
  # Troubleshooting skill
  - id: "troubleshoot-skill"
    name: "troubleshoot_skill"
    description: "Troubleshoot system issues and outages"
    enabled: true
    instructions: "Troubleshoot $ISSUE_TYPE in $SERVICE_NAME. Environment: $ENVIRONMENT. Error: $ERROR. Logs: $LOGS. Time range: $TIME_RANGE. Investigation details: $ARGUMENTS"
    when_to_use: "Use when troubleshooting issues, errors, or system problems"
    triggers: ["/troubleshoot", "/debug", "/incident", "/investigate"]
    arguments: ["issue_type", "service_name", "environment", "error", "logs", "time_range"]
    allowedTools: ["logs_tool", "metrics_tool", "debug_tool"]
    context_mode: "inline"
    priority: 8
  
  # Security scan skill
  - id: "security-skill"
    name: "security_skill"
    description: "Perform security scans and vulnerability assessments"
    enabled: true
    instructions: "Run security scan on $TARGET_TYPE: $TARGET. Scan type: $SCAN_TYPE. Environment: $ENVIRONMENT. Severity threshold: $SEVERITY. Report format: $REPORT_FORMAT. Full scan details: $ARGUMENTS"
    when_to_use: "Use when performing security scans, vulnerability assessments, or compliance checks"
    triggers: ["/security", "/scan", "/vulnerability", "/compliance"]
    arguments: ["target_type", "target", "scan_type", "environment", "severity", "report_format"]
    allowedTools: ["security_tool", "compliance_tool", "report_tool"]
    context_mode: "fork"
    modelOverride: "claude-3-opus"
    priority: 9
  
  # Backup and recovery skill
  - id: "backup-skill"
    name: "backup_skill"
    description: "Manage backups and disaster recovery"
    enabled: true
    instructions: "Create backup of $BACKUP_TARGET in $ENVIRONMENT. Type: $BACKUP_TYPE. Retention: $RETENTION. Storage: $STORAGE. Schedule: $SCHEDULE. Backup details: $ARGUMENTS"
    when_to_use: "Use when creating backups, managing recovery, or disaster planning"
    triggers: ["/backup", "/recovery", "/disaster"]
    arguments: ["backup_target", "environment", "backup_type", "retention", "storage", "schedule"]
    allowedTools: ["backup_tool", "storage_tool", "recovery_tool"]
    context_mode: "inline"
    priority: 6
tools:
  - id: "deploy_tool"
    name: "deploy_tool"
    description: "Execute deployment operations"
    endpoint: "https://api.deploy.com/execute"
    method: "POST"
    enabled: true
    headers:
      Authorization: "Bearer ${DEPLOY_TOKEN}"
  
  - id: "k8s_tool"
    name: "k8s_tool"
    description: "Interact with Kubernetes clusters"
    endpoint: "https://api.k8s.com/clusters"
    method: "POST"
    enabled: true
  
  - id: "monitoring_tool"
    name: "monitoring_tool"
    description: "Access monitoring and metrics systems"
    endpoint: "https://api.monitoring.com/metrics"
    method: "GET"
    enabled: true
  
  - id: "terraform_tool"
    name: "terraform_tool"
    description: "Execute Terraform operations"
    endpoint: "https://api.terraform.com/apply"
    method: "POST"
    enabled: true
  
  - id: "cloud_tool"
    name: "cloud_tool"
    description: "Interact with cloud provider APIs"
    endpoint: "https://api.cloud.com/resources"
    method: "POST"
    enabled: true
  
  - id: "security_tool"
    name: "security_tool"
    description: "Perform security scans and assessments"
    endpoint: "https://api.security.com/scan"
    method: "POST"
    enabled: true
  
  - id: "logs_tool"
    name: "logs_tool"
    description: "Access and analyze system logs"
    endpoint: "https://api.logs.com/search"
    method: "POST"
    enabled: true
  
  - id: "alert_tool"
    name: "alert_tool"
    description: "Configure and manage alerts"
    endpoint: "https://api.alerts.com/configure"
    method: "POST"
    enabled: true
  
  - id: "dashboard_tool"
    name: "dashboard_tool"
    description: "Create and manage monitoring dashboards"
    endpoint: "https://api.dashboards.com/create"
    method: "POST"
    enabled: true
  
  - id: "backup_tool"
    name: "backup_tool"
    description: "Execute backup operations"
    endpoint: "https://api.backup.com/create"
    method: "POST"
    enabled: true
# Enhanced features enabled
enableEnhancedSkills: true
enableSkillRouting: true
enableDiscoveryTools: true
