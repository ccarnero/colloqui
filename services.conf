# services.conf — single source of truth for the platform's application services.
# Sourced by bootstrap-*.sh, rebuild-changed.sh, rebuild-all.sh. Plain POSIX/bash.
# Infrastructure (postgres, redis, nats, temporal) is intentionally NOT listed here.

# Canonical build/rollout order: foundations first, dependents next, frontend last.
YZ_SERVICES="auth-service tenant-service cache-service connector-admin registry-service audit-service usage-aggregator-service channel-service workflow-service connector-runtime api-gateway proxy-service agent-memory-service agent-ai-service agent-scheduler-service agent-admin-service ai-agent-gateway tracking-ingester-service provisioning-service admin-console"

# Shared-package fan-out groups: which services rebuild when a shared package changes.
#   testing -> watches packages/{shared,observability,database,testing}
#   core    -> watches packages/{shared,observability,database}
#   nodb    -> watches packages/{shared,observability}
YZ_TESTING_SVCS="auth-service tenant-service registry-service channel-service connector-admin usage-aggregator-service"
YZ_CORE_SVCS="api-gateway cache-service audit-service workflow-service agent-admin-service ai-agent-gateway agent-ai-service agent-memory-service agent-scheduler-service provisioning-service"
YZ_NODB_SVCS="proxy-service connector-runtime"

# Derived groups.
YZ_NESTJS_ALL="$YZ_TESTING_SVCS $YZ_CORE_SVCS $YZ_NODB_SVCS"
YZ_DB_SVCS="$YZ_TESTING_SVCS $YZ_CORE_SVCS"

# Angular frontend (watches packages/angular-shared).
YZ_ANGULAR_SVCS="admin-console"
