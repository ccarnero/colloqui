name: "Sales Assistant Enhanced"
description: "Enhanced sales agent with intelligent skill routing and argument handling"
role:
  name: "Sales Assistant"
  description: "A helpful sales assistant that can qualify leads and manage customer relationships"
  systemPrompt: "You are a professional sales assistant. Help customers with product information, qualify leads, and manage the sales process efficiently."
  temperature: 0.6
  maxTokens: 800
rules:
  - "Always be professional and courteous"
  - "Qualify leads before providing detailed pricing"
  - "Focus on solving customer problems"
  - "Use enhanced skills for sales tasks"
responseStyle: "Professional, helpful, and solution-oriented"
llm:
  provider: "openai"
  model: "gpt-4"
skills:
  # Lead qualification skill with triggers
  - id: "qualify-lead-skill"
    name: "qualify_lead_skill"
    description: "Qualify sales leads and assess potential"
    enabled: true
    instructions: "Qualify lead for $LEAD_NAME from $COMPANY. Budget: $BUDGET. Timeline: $TIMELINE. Use case: $USE_CASE. All details: $ARGUMENTS"
    when_to_use: "Use when you need to qualify a sales lead or assess customer potential"
    triggers: ["/qualify", "/lead", "/assess"]
    arguments: ["lead_name", "company", "budget", "timeline", "use_case"]
    allowedTools: ["crm_tool", "email_tool"]
    context_mode: "inline"
    priority: 10
  
  # Product recommendation skill
  - id: "recommend-product-skill"
    name: "recommend_product_skill"
    description: "Recommend products based on customer needs"
    enabled: true
    instructions: "Recommend products for $CUSTOMER_NEEDS in $INDUSTRY. Budget range: $BUDGET_RANGE. Key requirements: $REQUIREMENTS. Details: $ARGUMENTS"
    when_to_use: "Use when customers need product recommendations or solutions"
    triggers: ["/recommend", "/suggest", "/products"]
    arguments: ["customer_needs", "industry", "budget_range", "requirements"]
    allowedTools: ["catalog_tool", "pricing_tool"]
    context_mode: "fork"
    modelOverride: "claude-3-sonnet"
    priority: 8
  
  # Follow-up management skill
  - id: "followup-skill"
    name: "followup_skill"
    description: "Manage customer follow-ups and communication"
    enabled: true
    instructions: "Schedule follow-up for $CUSTOMER_NAME on $DATE. Type: $FOLLOWUP_TYPE. Notes: $NOTES. Contact: $CONTACT_INFO. Full context: $ARGUMENTS"
    when_to_use: "Use when scheduling or managing customer follow-ups"
    triggers: ["/followup", "/schedule", "/contact"]
    arguments: ["customer_name", "date", "followup_type", "notes", "contact_info"]
    allowedTools: ["calendar_tool", "email_tool", "crm_tool"]
    context_mode: "inline"
    priority: 6
  
  # Deal analysis skill (complex, uses fork mode)
  - id: "analyze-deal-skill"
    name: "analyze_deal_skill"
    description: "Analyze complex deals and provide recommendations"
    enabled: true
    instructions: "Analyze deal for $DEAL_NAME with $DEAL_VALUE. Stakeholders: $STAKEHOLDERS. Risk factors: $RISKS. Timeline: $TIMELINE. Complete analysis: $ARGUMENTS"
    when_to_use: "Use for complex deal analysis requiring detailed assessment"
    triggers: ["/analyze-deal", "/deal-analysis", "/complex"]
    arguments: ["deal_name", "deal_value", "stakeholders", "risks", "timeline"]
    allowedTools: ["analytics_tool", "risk_tool", "crm_tool"]
    context_mode: "fork"
    modelOverride: "claude-3-opus"
    priority: 9
tools:
  - id: "crm_tool"
    name: "crm_tool"
    description: "Access CRM system for lead and customer data"
    endpoint: "https://api.crm.com/leads"
    method: "GET"
    enabled: true
    headers:
      Authorization: "Bearer ${CRM_TOKEN}"
  
  - id: "email_tool"
    name: "email_tool"
    description: "Send emails to customers"
    endpoint: "https://api.email.com/send"
    method: "POST"
    enabled: true
    headers:
      Authorization: "Bearer ${EMAIL_TOKEN}"
  
  - id: "catalog_tool"
    name: "catalog_tool"
    description: "Access product catalog and pricing"
    endpoint: "https://api.catalog.com/products"
    method: "GET"
    enabled: true
  
  - id: "pricing_tool"
    name: "pricing_tool"
    description: "Calculate pricing and discounts"
    endpoint: "https://api.pricing.com/calculate"
    method: "POST"
    enabled: true
  
  - id: "calendar_tool"
    name: "calendar_tool"
    description: "Schedule meetings and follow-ups"
    endpoint: "https://api.calendar.com/events"
    method: "POST"
    enabled: true
  
  - id: "analytics_tool"
    name: "analytics_tool"
    description: "Analyze deal metrics and trends"
    endpoint: "https://api.analytics.com/deals"
    method: "POST"
    enabled: true
  
  - id: "risk_tool"
    name: "risk_tool"
    description: "Assess deal risks and factors"
    endpoint: "https://api.risk.com/assess"
    method: "POST"
    enabled: true
# Enhanced features enabled
enableEnhancedSkills: true
enableSkillRouting: true
enableDiscoveryTools: true
