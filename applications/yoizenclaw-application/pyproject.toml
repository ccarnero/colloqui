[project]
name = "yoizen-claw"
version = "0.1.0"
description = "Lightweight agent runtime for conversation recovery"
requires-python = ">=3.11"

dependencies = [
    "pydantic-ai[anthropic,bedrock,cohere,google,groq,huggingface,mistral,openai,xai]>=0.0.50",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.25",
    "nats-py>=2.7.2",
    "asyncpg>=0.29",
    "pgvector>=0.2.4",
    "apscheduler>=3.10.0",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "opentelemetry-instrumentation-asyncpg>=0.40b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",

    "opentelemetry-exporter-otlp>=1.20",
    "prometheus_client>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "e2e"]
python_files = ["test_*.py", "tests_e2e_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "-p", "no:logfire"]
markers = [
    "e2e: end-to-end tests requiring live infrastructure (NATS, PostgreSQL, YoizenClaw)",
    "slow: tests that take significant time to run",
    "security: security-focused E2E tests",
]
