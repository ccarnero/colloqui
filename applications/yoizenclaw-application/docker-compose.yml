services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yoizen-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yoizenclaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: yoizen-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--js --store_dir /data --http_port 8222"
    volumes:
      - nats_data:/data

  yoizenclaw:
    image: python:3.11-slim
    container_name: yoizenclaw-app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yoizenclaw
      NATS_URL: nats://nats:4222
      TENANT_ID: test-tenant
      OPENAI_API_KEY: lm-studio
      OPENAI_BASE_URL: http://host.docker.internal:1234/v1
      OTEL_EXPORTER_OTLP_ENDPOINT:
      PORT: 8080
      LOG_LEVEL: INFO
      PYTHONPATH: /app/src:/shared/types/python
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./:/app:cached
      - ../shared/types/python:/shared/types/python:cached
    command: sh -c "pip install -e /shared/types/python --break-system-packages 2>/dev/null || true && pip install -e /app --break-system-packages 2>/dev/null || true && sleep 10 && uvicorn src.api.routes:app --host 0.0.0.0 --port 8000 --log-level info"

volumes:
  postgres_data:
  nats_data:
