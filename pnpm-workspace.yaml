# Bun-style `workspaces` in package.json is not read by pnpm; this file is the
# single source of truth for workspace membership.
packages:
  - 'packages/*'
  - 'services/*'
  # Not real workspace members (stale / non-Node):
  - '!services/messaging-console'
  - '!services/yoizenclaw-runtime'

# Build-script policy (pnpm v11 `allowBuilds`, replaces the deprecated
# `ignoredBuiltDependencies` list). Native deps whose install scripts we
# intentionally DON'T run (supply-chain hardening) are set to false — they all
# ship prebuilt binaries selected at runtime, so blocking their build scripts
# is safe and matches the previous Bun behaviour. `@scarf/scarf` is telemetry.
#
# esbuild is allowed because its postinstall script is benign (downloads
# platform-specific prebuilt binaries) and vitest/angular need the binary.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

minimumReleaseAge: 1440
