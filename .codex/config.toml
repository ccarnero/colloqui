# No seatbelt for the principal nor for what it launches: the manual loop's gates run Playwright against the
# local dev cluster, and Chromium cannot start inside the macOS sandbox. What the loop may change is bounded by
# each task's Allowed write paths (scripts/loop-commit.py --check), and git commit stays with the human.
sandbox_mode = "danger-full-access"
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

# The dev cluster (*.platform-services-dev.dev.local) resolves to 127.0.0.1: without this every gate that
# talks to it fails with "connect EPERM". Nothing here opens the internet to a role that did not have it.
[sandbox_workspace_write]
network_access = true
